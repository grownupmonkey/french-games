/* Le marché: UI. Stage is 1440x810; the canvas is 480x270 shown at 3x. Palette: Paris café + warm store light. */
:root{--ink:#2a1c10;--paper:#f4e6c8;--paper2:#e8d3a6;--navy:#1f2a44;--amber:#e9a24b;--amber2:#ffd9a0;--rose:#e88b9c;--blue:#5b8db8;--gold:#f2c14e;--ok:#3f9a5a;--ko:#d8382f;--line:#8a6a3c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0d18;overflow:hidden;font-family:Pix,"Trebuchet MS",system-ui,sans-serif;font-size:26px;color:var(--ink);font-variant-ligatures:none;font-feature-settings:'liga' 0,'clig' 0}
#stage{position:absolute;left:0;top:0;width:1440px;height:810px;transform-origin:0 0}
canvas#c{position:absolute;left:0;top:0;width:1440px;height:810px;image-rendering:pixelated;background:#1b1f33}
#ui{position:absolute;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
.hidden{display:none!important}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:default}

.btn{background:var(--amber);color:var(--ink);border:3px solid var(--ink);padding:8px 22px 10px;font-size:28px;box-shadow:0 5px 0 #8a5a1f;border-radius:6px;line-height:1.1}
.btn:hover:not(:disabled){transform:translateY(-1px);background:#f2b25c}.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #8a5a1f}
.btn.sm{font-size:22px;padding:5px 16px 7px}.btn.sec{background:var(--paper);box-shadow:0 5px 0 #a89468}
.btn.sec:hover:not(:disabled){background:#fff3d6}
.pill{display:inline-block;min-width:30px;padding:0 8px;margin-left:6px;background:var(--paper2);border:2px solid var(--ink);border-radius:14px;font-size:22px;text-align:center}
.pill.on{background:var(--ko);color:#fff}
.sbtn{width:46px;height:46px;font-size:34px;line-height:1;background:var(--paper);border:3px solid var(--ink);border-radius:6px;box-shadow:0 4px 0 #a89468;padding:0}
.sbtn:hover{background:#fff3d6}.sbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #a89468}
.step{display:flex;align-items:center;gap:10px}.sn{min-width:42px;text-align:center;font-size:34px}

#hud{position:absolute;left:24px;bottom:20px;display:flex;gap:14px}
#hud.top{left:auto;right:24px;top:84px;bottom:auto}
.hint.top{bottom:auto;top:84px}
.hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:rgba(31,42,68,.92);color:#fbf3e4;border:3px solid var(--gold);border-radius:30px;padding:8px 24px;font-size:26px;pointer-events:none;white-space:nowrap}
.wsign{position:absolute;transform:translateX(-50%);color:#fff7e4;border:3px solid var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.35);padding:2px 16px 4px;font-size:27px;white-space:nowrap;pointer-events:none;border-radius:4px}
.wsign.small{font-size:22px;padding:0 12px 2px}
.shelfsign{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-size:46px;color:#fff7e4;text-shadow:0 3px 0 #2a1c10,0 0 0 #000;letter-spacing:1px;pointer-events:none;white-space:nowrap}
.btn.back{position:absolute;left:24px;top:84px;font-size:24px;padding:5px 16px 7px}
#ptags,#badges{position:absolute;inset:0;pointer-events:none}
.ptag{position:absolute;transform:translateX(-50%);background:#fffaf0;border:3px solid var(--ink);border-radius:4px;padding:1px 4px 3px;text-align:center;line-height:1.05;cursor:pointer;pointer-events:auto;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.ptag:hover{background:#fff1b8}
.ptag .pn{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptag .ps{display:block;font-size:15px;color:#7a5a38;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptag b{display:block;font-size:24px;color:#b3261e}
.badge{position:absolute;min-width:34px;height:34px;border-radius:17px;background:var(--ko);color:#fff;border:3px solid #fff;font-size:22px;text-align:center;line-height:28px;box-shadow:0 3px 0 rgba(0,0,0,.3)}

.overlay{position:absolute;inset:0;background:rgba(10,6,18,.55);display:grid;place-items:center}
.fade{position:absolute;inset:0;background:#0b0d18;opacity:0;transition:opacity .6s;z-index:50;pointer-events:none}
.speech{position:absolute;transform:translate(-50%,-100%);background:#fffaf0;color:var(--ink);border:3px solid var(--ink);border-radius:10px;padding:8px 18px 10px;font-size:27px;max-width:430px;text-align:center;transition:opacity .4s;pointer-events:none;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.speech:after{content:"";position:absolute;left:50%;bottom:-13px;width:18px;height:18px;background:#fffaf0;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateX(-50%) rotate(45deg)}

/* label card */
.labelcard{width:900px;background:#fffaf0;border:5px solid var(--ink);border-radius:8px;box-shadow:0 10px 0 rgba(0,0,0,.35);overflow:hidden}
.lhead{padding:8px 24px;color:#fff;font-size:30px;text-shadow:0 2px 0 rgba(0,0,0,.35);letter-spacing:1px;border-bottom:4px solid var(--ink)}
.lbody{display:flex;gap:30px;padding:22px 28px}
.lart{width:250px;height:330px;flex:none;display:grid;place-items:center;background:radial-gradient(circle at 40% 30%,#fff8e8,#ecdcb4);border:4px solid var(--ink);border-radius:6px;position:relative}
#lbcv{width:160px;height:200px;image-rendering:pixelated;position:relative;z-index:1;margin-top:-10px}
.lshadow{position:absolute;left:50%;bottom:62px;width:150px;height:22px;margin-left:-75px;border-radius:50%;background:rgba(40,25,12,.28);filter:blur(3px)}
.ltext{flex:1}.ltext h2{margin:0 0 2px;font-size:42px;line-height:1}
.lsize{font-size:30px;color:#6a4a28;margin-bottom:8px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.tag{background:#e6f3dd;border:2px solid var(--ok);color:#1f5a30;border-radius:14px;padding:0 12px 2px;font-size:22px}
.lblock{font-size:25px;line-height:1.15;margin:8px 0;padding-top:8px;border-top:2px dashed #cdb98c}.lblock b{display:block;font-size:20px;color:#8a6a3c;text-transform:uppercase;letter-spacing:1px}
.lprice{margin-top:10px;display:flex;align-items:baseline;gap:16px}.lprice b{font-size:50px;color:#b3261e}.lprice span{font-size:24px;color:#6a4a28}
.lfoot{display:flex;align-items:center;gap:18px;padding:14px 28px;background:var(--paper);border-top:4px solid var(--ink)}.lcap{font-size:24px;flex:1;color:#6a4a28}

/* shopping list paper */
.listp{position:absolute;left:24px;top:84px}
.paper{width:520px;background:var(--paper);border:4px solid var(--ink);padding:16px 22px 18px 54px;box-shadow:0 8px 0 rgba(0,0,0,.35);position:relative;background-image:repeating-linear-gradient(transparent,transparent 41px,#cdb98c 41px,#cdb98c 43px);background-position:0 70px}
.paper:before{content:"";position:absolute;left:38px;top:0;bottom:0;width:3px;background:#d98a8a}
.ptop{display:flex;justify-content:space-between;font-size:30px}.ptop span{font-size:22px;color:#6a4a28;align-self:center}
.pdish{font-size:27px;color:#8a3a2a;margin:4px 0 10px;font-style:italic}
.lrow{display:flex;align-items:center;gap:14px;height:43px;font-size:27px;cursor:pointer}.lrow input{display:none}
.lrow .box{width:24px;height:24px;border:3px solid var(--ink);background:#fffaf0;flex:none;position:relative}
.lrow input:checked+.box:after,.lrow .box.on:after{content:"";position:absolute;left:4px;top:-5px;width:9px;height:18px;border:solid var(--ok);border-width:0 5px 5px 0;transform:rotate(40deg)}
.lrow input:checked~.ltxt{text-decoration:line-through;color:#8a7a5a}.lrow.done .ltxt{color:#8a7a5a}
.pnote{font-size:21px;color:#6a4a28;margin:12px 0 12px;line-height:1.1}
.paper .btn{margin-top:4px}

/* basket */
.cartcard,.checkcard{width:860px;max-height:720px;background:#fffaf0;border:5px solid var(--ink);border-radius:8px;box-shadow:0 10px 0 rgba(0,0,0,.35);padding:20px 30px 24px;display:flex;flex-direction:column}
.cartcard h2,.checkcard h2{margin:0 0 10px;font-size:40px}
.crows{overflow:auto;max-height:460px;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink)}
.crow{display:flex;align-items:center;gap:18px;padding:8px 6px;border-bottom:2px dashed #cdb98c}.crow:last-child{border-bottom:0}
.cart-ic{width:48px;height:60px;image-rendering:pixelated;flex:none}.cname{flex:1}.cname b{display:block;font-size:28px}.cname small{font-size:21px;color:#7a5a38}
.cprice{width:130px;text-align:right;font-size:28px}.empty{padding:30px;text-align:center;font-size:28px;color:#7a5a38}
.ctotal{display:flex;justify-content:space-between;font-size:38px;margin:12px 6px 14px}.cbtns{display:flex;gap:16px;justify-content:flex-end;margin-top:6px}
.receipt{width:520px;background:#fbf6e8;border:2px solid #cfc3a4;box-shadow:0 12px 0 rgba(0,0,0,.35);padding:22px 30px 26px;font-size:25px;max-height:760px;overflow:auto}
.rtitle{text-align:center;font-size:34px;font-weight:700}.rsub{text-align:center;font-size:21px;color:#7a6a4a;margin-bottom:8px}.rline{border-top:3px dashed #8a7a5a;margin:10px 0}
.rrow{display:flex;justify-content:space-between;gap:12px;padding:3px 0}.rrow small{color:#8a7a5a;font-size:19px}.rtot{display:flex;justify-content:space-between;font-size:36px;margin-top:6px}.rbtn{text-align:center;margin-top:18px}
.vrows{overflow:auto;max-height:480px}
.vrow{display:flex;gap:16px;padding:10px 6px;border-bottom:2px dashed #cdb98c;align-items:flex-start}.vrow b{font-size:28px;display:block}.vrow small{display:block;font-size:23px;color:var(--ko);line-height:1.1;margin-top:2px}.vrow em{font-style:normal;color:#7a5a38;font-size:22px}
.vmark{width:44px;height:44px;flex:none;text-align:center;line-height:44px;font-size:32px;border:3px solid var(--ink);border-radius:50%;color:#fff}.vrow.ok .vmark{background:var(--ok)}.vrow.ko .vmark{background:var(--ko)}

/* title / creator / intro */
.title{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#fff7e4}
.tlogo{font-size:150px;line-height:1;color:var(--gold);text-shadow:0 6px 0 #8a3a1f,0 12px 0 rgba(0,0,0,.4)}
.tsub{font-size:42px;margin:8px 0 6px;color:#f4d8d0}.tp{font-size:28px;max-width:760px;margin:12px auto 24px}.tbtns{display:flex;gap:18px;justify-content:center}
.tbest{margin-top:20px;font-size:26px;color:#d8c9a8}.tkeys{margin-top:12px;font-size:22px;color:#b8a888}
.intro{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:30px;align-items:flex-end;width:1000px}
.ines canvas{width:224px;height:448px;image-rendering:pixelated;filter:drop-shadow(0 8px 0 rgba(0,0,0,.35))}
.ibox{flex:1;background:var(--paper);border:5px solid var(--ink);border-radius:8px;padding:20px 28px 24px;box-shadow:0 8px 0 rgba(0,0,0,.35);font-size:30px;line-height:1.15}.ibox b{font-size:34px;color:#b3261e}.ibox p{margin:8px 0}.ibox .small{font-size:23px;color:#6a4a28}.ibox .btn{margin-top:10px}
.creator{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:1200px;background:var(--paper);border:5px solid var(--ink);padding:14px 30px 20px;box-shadow:0 8px 0 rgba(0,0,0,.35)}
.creator h2{margin:0 0 6px;font-size:40px}.cr-main{display:flex;gap:30px}.cr-big{width:210px;text-align:center}.pvbig{width:160px;height:320px;image-rendering:pixelated;background:#e8d9b8;border:4px solid var(--ink)}
.cr-dir{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap;justify-content:center}.cr-dir button,.tog button{background:var(--paper2);border:2px solid var(--ink);padding:0 10px 2px;font-size:20px}.cr-dir .sel,.tog .sel{background:var(--amber)}
.cr-opts{flex:1}.grp{display:flex;align-items:center;gap:14px;margin-bottom:6px}.grp h3{margin:0;width:110px;font-size:24px}.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{padding:2px 6px;background:#fffaf0;border:3px solid var(--ink);border-radius:4px}.opt.sel{background:var(--amber);box-shadow:0 0 0 3px var(--ink)}.pv{width:32px;height:64px;image-rendering:pixelated}
.namerow{display:flex;align-items:center;gap:14px;margin-top:12px}.namerow h3{margin:0;font-size:24px;width:110px}.namerow input{font:inherit;font-size:28px;width:230px;padding:2px 10px;border:3px solid var(--ink);background:#fffaf0}.acc{font-size:22px;margin-left:10px}.tog{display:inline-flex}

/* cooking */
.cookp{position:absolute;left:0;right:0;bottom:0;height:300px;background:var(--paper);border-top:6px solid var(--ink);box-shadow:0 -8px 0 rgba(0,0,0,.25);display:flex}
.cl{width:520px;padding:18px 28px;border-right:4px dashed #b89c68;display:flex;flex-direction:column}.cstep{font-size:22px;color:#8a6a3c;text-transform:uppercase;letter-spacing:2px}.cinstr{font-size:38px;line-height:1.1;margin:6px 0 10px}
.cdots{display:flex;gap:8px}.cdots i{width:22px;height:22px;border:3px solid var(--ink);background:#fffaf0;border-radius:50%}.cdots i.d{background:var(--ok)}.cdots i.c{background:var(--amber)}
.cmsg{margin-top:auto;font-size:25px;min-height:60px;line-height:1.1}.cmsg.good{color:var(--ok)}.cmsg.bad{color:var(--ko)}
.cw{flex:1;position:relative;display:grid;place-items:center}
.jinfo{display:flex;flex-direction:column;gap:8px;align-items:flex-start}.jinfo small{font-size:21px;color:#6a4a28;max-width:260px}.jb{display:flex;gap:10px}.read{font-size:46px;min-width:230px}
.jugwrap{display:flex;gap:40px;align-items:center}.jug{position:relative;width:150px;height:230px;border:5px solid var(--ink);border-top-width:3px;background:rgba(255,255,255,.6);border-radius:0 0 14px 14px;overflow:visible}
.jug:before{content:"";position:absolute;right:-30px;top:30px;width:24px;height:50px;border:5px solid var(--ink);border-left:0;border-radius:0 24px 24px 0}
.liq{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#7ec8ef,#3a8fd6);transition:height .25s;border-radius:0 0 8px 8px}.liq:before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:rgba(255,255,255,.5)}
.tick{position:absolute;left:0;width:26px;height:3px;background:var(--ink)}.tick span{position:absolute;left:34px;top:-14px;font-size:20px;color:var(--ink)}
.balwrap{display:flex;gap:40px;align-items:center}.bal{width:300px;height:250px;position:relative}
.bal .pan{position:absolute;left:20px;right:20px;top:20px;height:96px;background:#e6e8ee;border:4px solid var(--ink);border-radius:50% 50% 8px 8px/30% 30% 8px 8px;overflow:visible}
.bal .stem{position:absolute;left:140px;top:116px;width:20px;height:50px;background:#8e96ad;border:4px solid var(--ink);border-top:0;border-bottom:0}
.bal .base{position:absolute;left:30px;right:30px;top:160px;height:80px;background:#c7cde0;border:4px solid var(--ink);border-radius:10px;display:grid;place-items:center}
.disp{background:#1d2a1a;color:#9dff8a;padding:2px 16px;font-size:34px;border:3px solid var(--ink);min-width:150px;text-align:center}
.cntwrap{display:flex;gap:30px;align-items:center}.bigitem{background:none;border:0;padding:0;cursor:pointer;transition:transform .08s}.bigitem:hover{transform:scale(1.06)}.bigitem:active{transform:scale(.94)}
.bowl{width:180px;min-height:90px;border:4px solid var(--ink);border-radius:0 0 80px 80px;background:#efe6cf;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;padding:10px;overflow:hidden}
.cutwrap{display:flex;gap:40px;align-items:center}.board{position:relative;width:360px;height:220px;background:#c08a4e;border:5px solid var(--ink);border-radius:10px;display:grid;place-items:center;box-shadow:inset 0 6px 0 #d9a867}
.board .pieces{position:absolute;right:10px;bottom:8px;left:10px;display:flex;flex-wrap:wrap;justify-content:center;pointer-events:none}.board .bigitem{position:relative;z-index:1;margin-bottom:30px}
.chop{animation:chop .18s}@keyframes chop{0%{transform:translateY(0)}40%{transform:translateY(-14px) rotate(-6deg)}100%{transform:translateY(0)}}
.waitwrap{display:flex;gap:40px;align-items:center}.clock{width:190px;height:190px;border-radius:50%;border:6px solid var(--ink);background:#fffaf0;display:grid;place-items:center;font-size:44px}
.pot{position:relative;width:200px;height:150px}.pot .water{position:absolute;left:10px;right:10px;top:30px;height:110px;background:#4a4f60;border:5px solid var(--ink);border-radius:6px 6px 24px 24px}.pot .lid{position:absolute;left:0;right:0;top:12px;height:22px;background:#8e96ad;border:5px solid var(--ink);border-radius:6px}

/* dinner, reflection, bilan */
.dcap{position:absolute;left:50%;top:22px;transform:translateX(-50%);text-align:center;color:#fff3d6;text-shadow:0 3px 0 #2a1c10;pointer-events:none}.dcap b{display:block;font-size:44px}.dcap span{font-size:26px;color:#f4d8a8}
.dgo{position:absolute;right:30px;bottom:26px}
.reflect,.bilan{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--paper);border:5px solid var(--ink);border-radius:8px;box-shadow:0 10px 0 rgba(0,0,0,.4);padding:20px 34px 26px}
.reflect{width:1080px}.reflect h2{margin:0 0 10px;font-size:42px}.reflect h2 small{font-size:24px;color:#6a4a28}.q{margin:10px 0}.q b{font-size:27px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.chip{background:#fffaf0;border:3px solid var(--ink);border-radius:20px;padding:0 16px 3px;font-size:22px}.chip.sel{background:var(--amber)}
.reflect textarea{width:100%;font:inherit;font-size:25px;padding:8px 12px;border:3px solid var(--ink);background:#fffaf0;margin-top:6px;resize:none}
.bilan{width:900px;text-align:center}.bilan h2{margin:0;font-size:48px}.stars{font-size:96px;color:var(--gold);text-shadow:0 5px 0 #8a5a1f;line-height:1.1}.stars i{font-style:normal;color:#cdbf9c;text-shadow:none}
.bscore{font-size:86px;line-height:1}.bscore small{font-size:36px;color:#6a4a28}.bilan p{font-size:29px;margin:8px 40px 14px}
.bstats{display:flex;justify-content:center;gap:34px;margin:6px 0 18px}.bstats div{background:#fffaf0;border:3px solid var(--ink);padding:6px 20px;min-width:230px}.bstats b{display:block;font-size:44px}.bstats span{font-size:21px;color:#6a4a28}
.bilan .cbtns{justify-content:center}.bhome{display:inline-block;margin-top:16px;font-size:24px;color:#6a4a28}

</style></head><body>

/* ===== Jetons: shared reward hook for "Le grand voyage" (index.html) =====
   Every game page calls GVJetons.award(gameId, ratio) when a student finishes.
   ratio is 0–1 (score). Reward: 2–5 jetons by score, +5 the first time a game is finished.
   After 2 finishes of the same game in one day, each further finish gives 1 jeton.
   Saved in localStorage key 'gv.v1', which the picker page reads (same site = same storage). */
window.GVJetons = (function () {
  var KEY = 'gv.v1', BASE = 2, RANGE = 3, FIRST = 5, DAILY_FULL = 2, last = 0;
  function load() { try { return JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { return {}; } }
  function save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
  function home() { return location.pathname.replace(/\/(10|20|30)-3y\/[^\/]*$/, '/') || '../'; }
  function badge(n, first) {
    var d = document.createElement('div');
    d.setAttribute('role', 'status');
    d.style.cssText = 'position:fixed;left:50%;bottom:22px;z-index:99999;transform:translate(-50%,140%);transition:transform .6s cubic-bezier(.2,1.4,.4,1);' +
      'display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;border-radius:999px;background:#1F2A44;color:#FBF3E4;' +
      'box-shadow:0 10px 30px rgba(20,28,48,.35),0 0 0 3px #F2C14E;font:700 16px/1.2 "Baloo 2","Atkinson Hyperlegible",system-ui,sans-serif;';
    d.innerHTML = '<span style="display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#F2C14E;color:#1F2A44;font-size:18px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)">★</span>' +
      '<span>+' + n + ' jetons' + (first ? ' <small style="opacity:.8;font-weight:600">(dont +' + FIRST + ' première fois)</small>' : '') + '</span>' +
      '<a href="' + home() + '" style="margin-left:4px;padding:7px 14px;border-radius:999px;background:#E88B9C;color:#1F2A44;text-decoration:none;font-weight:800">Boîte mystère →</a>' +
      '<button aria-label="Fermer" style="border:0;background:none;color:#FBF3E4;font-size:20px;cursor:pointer;padding:0 4px">×</button>';
    d.querySelector('button').onclick = function () { d.style.transform = 'translate(-50%,160%)'; setTimeout(function () { d.remove(); }, 600); };
    document.body.appendChild(d);
    requestAnimationFrame(function () { requestAnimationFrame(function () { d.style.transform = 'translate(-50%,0)'; }); });
  }
  function award(gameId, ratio) {
    var now = Date.now();
    if (now - last < 8000) return 0;          // ignore a double call from the same finish
    last = now;
    ratio = Math.max(0, Math.min(1, +ratio || 0));
    var s = load(), played = s.played || {}, g = played[gameId] || { n: 0, best: 0, day: '', today: 0 };
    var day = new Date().toLocaleDateString('en-CA');
    if (g.day !== day) { g.day = day; g.today = 0; }   // the daily count resets each day
    var first = g.n === 0;
    var n = g.today >= DAILY_FULL ? 1 : BASE + Math.round(RANGE * ratio) + (first ? FIRST : 0);
    g.today += 1; g.n += 1; g.best = Math.max(g.best, ratio); played[gameId] = g;
    s.played = played; s.tokens = (s.tokens || 0) + n;
    s.gain = { n: n, game: gameId, at: now };   // the picker shows this when the student returns
    save(s);
    try { badge(n, first); } catch (e) {}
    return n;
  }
  return { award: award };
})();

/* ===== Le marché: pixel painters. Light from the top left. Every shape gets three tones (light edge, body, shade edge) and a dark outline. ===== */
const OUTL = '#2a1c10';
function hx(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];}
function rgbHex(a){return '#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');}
function shade(c,f){const a=hx(c),t=f>0?255:0,k=Math.abs(f);return rgbHex(a.map(v=>v+(t-v)*k));}

/* mk(w,h,build): build(A) draws shapes with A.rect / A.ell / A.shape (auto-shaded), A.fill / A.put (flat details). Outline is added at the end. */
function mk(w,h,build){
  const M=new Array(w*h).fill(null);
  const A={w,h,
    put(x,y,c){x=Math.round(x);y=Math.round(y);if(x>=0&&y>=0&&x<w&&y<h)M[y*w+x]=c;},
    get(x,y){return(x>=0&&y>=0&&x<w&&y<h)?M[y*w+x]:null;},
    fill(x0,y0,x1,y1,c){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)A.put(x,y,c);},
    shape(test,col,mode){
      const pts=[],has=new Set();let x0=1e9,y0=1e9,x1=-1,y1=-1;
      for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(test(x,y)){pts.push([x,y]);has.add(y*w+x);x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);}
      if(!pts.length)return;
      const cx=(x0+x1)/2,cy=(y0+y1)/2,rx=(x1-x0+1)/2,ry=(y1-y0+1)/2,H=(x,y)=>has.has(y*w+x);
      for(const[x,y]of pts){let c=col;
        if(mode==='round'){const nx=(x-cx)/rx,ny=(y-cy)/ry,d=-.6*nx-.8*ny;c=d>.45?shade(col,.3):d<-.25?shade(col,-.28):col;}
        else if(mode!=='none'){if(!H(x,y-1)||!H(x-1,y))c=shade(col,.28);else if(!H(x+1,y)||!H(x,y+1))c=shade(col,-.26);}
        M[y*w+x]=c;}
    },
    rect(x0,y0,x1,y1,c,mode){A.shape((x,y)=>x>=x0&&x<=x1&&y>=y0&&y<=y1,c,mode||'flat');},
    ell(cx,cy,rx,ry,c,mode){A.shape((x,y)=>((x-cx)/rx)**2+((y-cy)/ry)**2<=1.02,c,mode||'round');}
  };
  build(A);
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const g=cv.getContext('2d'),id=g.createImageData(w,h);
  const set=(x,y,c)=>{const a=hx(c),i=(y*w+x)*4;id.data[i]=a[0];id.data[i+1]=a[1];id.data[i+2]=a[2];id.data[i+3]=255;};
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const c=M[y*w+x];
    if(c)set(x,y,c);else if(A.get(x-1,y)||A.get(x+1,y)||A.get(x,y-1)||A.get(x,y+1))set(x,y,OUTL);}
  g.putImageData(id,0,0);return cv;
}

/* tiny pictograms for labels: 5x5 around (cx,cy) */
function icon(A,k,cx,cy){
  const P=(dx,dy,c)=>A.put(cx+dx,cy+dy,c);
  if(k==='tomato'){A.fill(cx-2,cy-1,cx+2,cy+2,'#d8382f');A.fill(cx-1,cy+3,cx+1,cy+3,'#d8382f');P(-1,-2,'#3a8f4a');P(0,-2,'#3a8f4a');P(1,-2,'#3a8f4a');P(-1,0,'#ff8a7a');}
  else if(k==='leaf'){A.fill(cx-1,cy-2,cx+1,cy+1,'#3a8f4a');P(0,-3,'#3a8f4a');P(-2,0,'#3a8f4a');P(2,0,'#3a8f4a');P(0,2,'#2a6a34');P(0,3,'#6a4a2a');P(-1,-1,'#8ad07a');}
  else if(k==='chicken'){A.fill(cx-2,cy-1,cx+2,cy+2,'#e8a64a');A.fill(cx-1,cy-2,cx+1,cy-2,'#e8a64a');P(2,-2,'#d8382f');P(-3,0,'#e8a64a');P(-1,-1,'#fff3c0');P(1,3,'#8a5a2a');P(-1,3,'#8a5a2a');}
  else if(k==='olive'){A.fill(cx-1,cy-1,cx+1,cy+2,'#5a7a22');P(0,-2,'#5a7a22');P(0,-3,'#7a5a2a');P(-1,-1,'#a9c64a');P(2,-3,'#3a8f4a');P(3,-3,'#3a8f4a');}
  else if(k==='flower'){P(0,0,'#f2c230');P(-1,0,'#fff');P(1,0,'#fff');P(0,-1,'#fff');P(0,1,'#fff');P(0,2,'#3a8f4a');P(0,3,'#3a8f4a');}

/* ---------- audio (tiny, only after a click) ---------- */
const AU={c:null,on:true};
function actx(){if(!AU.c){try{AU.c=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AU.c;}
function tone(f,t0,d,v=.05,type='sine'){const c=actx();if(!c||!AU.on)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(c.destination);
  const t=c.currentTime+t0;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.05);}
function sfx(k){try{
  if(k==='pick'){tone(520,0,.08,.05,'square');tone(780,.07,.1,.04,'square');}
  else if(k==='drop'){tone(420,0,.09,.05,'square');tone(300,.07,.1,.04,'square');}
  else if(k==='ok'){tone(660,0,.1,.05);tone(880,.09,.16,.05);}
  else if(k==='no'){tone(200,0,.16,.06,'sawtooth');}
  else if(k==='beep'){tone(1500,0,.07,.04,'square');}
  else if(k==='chop'){tone(180,0,.05,.07,'square');}
  else if(k==='pour'){for(let i=0;i<4;i++)tone(300+i*40,i*.05,.08,.025,'triangle');}
  else if(k==='chime'){[523,659,784,1047].forEach((f,i)=>tone(f,i*.16,.9,.045));}
  else if(k==='clink'){tone(2400,0,.25,.03);tone(3100,.04,.2,.02);}
}catch(e){}}

function lightLayer(base,glows,vig=.5){const L=document.createElement('canvas');L.width=W;L.height=H;const c=L.getContext('2d');c.fillStyle=base;c.fillRect(0,0,W,H);c.globalCompositeOperation='lighter';
  for(const[x,y,r,rgb,a]of glows){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${rgb},${a})`);g.addColorStop(1,`rgba(${rgb},0)`);c.fillStyle=g;c.fillRect(x-r,y-r,2*r,2*r);}
  return L;}
function applyLight(L,vig=.5,vigCol='8,10,26'){ctx.save();ctx.globalCompositeOperation='multiply';ctx.drawImage(L,0,0);ctx.restore();
  const g=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.98);g.addColorStop(0,`rgba(${vigCol},0)`);g.addColorStop(1,`rgba(${vigCol},${vig})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}

function frameStore(dt){

  if(vx||vy){me.tx=null;me.path=null;moveMe(vx,vy,dt);}
  else if(me.tx!=null){const dx=me.tx-me.x,dy=me.ty-me.y,d=Math.hypot(dx,dy);

  if(!blocked(nx,me.y))me.x=nx;else if(me.tx!=null)me.tx=null;if(!blocked(me.x,ny))me.y=ny;else if(me.tx!=null)me.tx=null;

function verifyCart(){

    lines.push({L,ok,msg});}

function frameCook(dt){

  steam.forEach(p=>{p.y+=p.vy*dt;p.x+=Math.sin(T*3+p.y)*.1;p.a-=dt*.5;ctx.fillStyle=`rgba(255,255,255,${Math.max(0,p.a*.6)})`;ctx.fillRect(Math.round(p.x),Math.round(p.y),Math.ceil(p.s),Math.ceil(p.s));});

function runStep(){
  closePanel('cook');const R=G.recipe,s=R.steps[stepIdx];window.__boil=0;
  const dots=R.steps.map((_,i)=>`<i class="${i<stepIdx?'d':i===stepIdx?'c':''}"></i>`).join('');
  const p=el(`<div class="cookp" id="cook"><div class="cl"><div class="cstep">Étape ${stepIdx+1} sur ${R.steps.length}</div><div class="cinstr">${esc(s.say)}</div><div class="cdots">${dots}</div><div class="cmsg" id="cmsg"></div></div><div class="cw" id="cw"></div></div>`);
  ({measure:wMeasure,scale:wScale,count:wCount,cut:wCut,wait:wWait})[s.t](s,$('#cw'));
}
function stepDone(msg){sfx('ok');window.__emote=T+1.4;const m=$('#cmsg');if(m){m.className='cmsg good';m.textContent=msg||'Bien !';}
  setTimeout(()=>{stepIdx++;if(stepIdx>=G.recipe.steps.length){closePanel('cook');fadeTo(startDinner,800);}else runStep();},900);}
function stepWrong(msg){sfx('no');G.cookErr++;const m=$('#cmsg');if(m){m.className='cmsg bad';m.textContent=msg;}}
function icv(id,s){const c=document.createElement('canvas');c.width=16;c.height=20;c.style.cssText=`width:${16*s}px;height:${20*s}px;image-rendering:pixelated`;const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(SPR(id),0,0);return c;}
const nfr=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');

/* measure: a jug, + and − buttons by the step size */
function wMeasure(s,box){let v=0;const max=Math.max(500,Math.ceil(s.tgt*1.6/250)*250);
  const ticks=[];for(let m=s.inc;m<=max;m+=s.inc){const lab=(s.inc>=250||m%250===0)?`<span>${nfr(m)}</span>`:'';ticks.push(`<div class="tick" style="bottom:${m/max*100}%">${lab}</div>`);}
  box.innerHTML=`<div class="jugwrap"><div class="jug"><div class="liq" id="liq"></div>${ticks.join('')}</div><div class="jinfo"><div class="read" id="read">0 mL</div><div class="jb"><button class="sbtn" id="mMinus">−</button><button class="sbtn" id="mPlus">+</button></div><small>+ ou − ${nfr(s.inc)} ${s.u}</small><button class="btn" id="mOk">C’est bon !</button></div></div>`;
  const upd=()=>{$('#liq').style.height=(v/max*100)+'%';$('#read').textContent=nfr(v)+' '+s.u;};upd();
  $('#mPlus').onclick=()=>{if(v+s.inc<=max){v+=s.inc;sfx('pour');upd();}};$('#mMinus').onclick=()=>{if(v-s.inc>=0){v-=s.inc;sfx('drop');upd();}};
  $('#mOk').onclick=()=>{if(v===s.tgt)stepDone('Exactement la bonne quantité.');else stepWrong(v<s.tgt?`Pas assez : tu as ${nfr(v)} ${s.u}. Relis la consigne.`:`Trop : tu as ${nfr(v)} ${s.u}. Relis la consigne.`);};}
/* scale: a kitchen balance with a digital display */
function wScale(s,box){let v=0;
  box.innerHTML=`<div class="balwrap"><div class="bal"><div class="pan" id="pan"></div><div class="stem"></div><div class="base"><div class="disp" id="disp">0 g</div></div></div><div class="jinfo"><div class="jb"><button class="sbtn" id="mMinus">−</button><button class="sbtn" id="mPlus">+</button></div><small>+ ou − ${nfr(s.inc)} ${s.u}</small><button class="btn" id="mOk">C’est bon !</button></div></div>`;
  const pan=$('#pan');const upd=()=>{$('#disp').textContent=nfr(v)+' '+s.u;pan.innerHTML='';const n=Math.min(8,Math.round(v/s.inc));for(let i=0;i<n;i++){const c=icv(s.item,2);c.style.cssText+=`;position:absolute;left:${10+(i%4)*34}px;bottom:${6+Math.floor(i/4)*18}px`;pan.appendChild(c);}};upd();
  $('#mPlus').onclick=()=>{v+=s.inc;sfx('pick');upd();};$('#mMinus').onclick=()=>{if(v>=s.inc){v-=s.inc;sfx('drop');upd();}};
  $('#mOk').onclick=()=>{if(v===s.tgt)stepDone('Le poids est exact.');else stepWrong(v<s.tgt?`Pas assez : ${nfr(v)} ${s.u}. Relis la consigne.`:`Trop : ${nfr(v)} ${s.u}. Relis la consigne.`);};}
/* count: click the ingredient once for each one you take, then confirm */
function wCount(s,box){let n=0;
  box.innerHTML=`<div class="cntwrap"><button class="bigitem" id="bi"></button><div class="bowl" id="bowl"></div><div class="jinfo"><div class="read" id="read">0 ${s.what}</div><small>Clique sur le produit pour en prendre un.</small><div class="jb"><button class="sbtn" id="mMinus">−</button></div><button class="btn" id="mOk">C’est bon !</button></div></div>`;
  $('#bi').appendChild(icv(s.item,7));
  const upd=()=>{$('#read').textContent=n+' '+s.what;const b=$('#bowl');b.innerHTML='';for(let i=0;i<Math.min(n,12);i++){const c=icv(s.item,2);c.style.cssText+=`;margin:0 -4px`;b.appendChild(c);}};upd();
  $('#bi').onclick=()=>{if(n<20){n++;sfx('pick');upd();}};$('#mMinus').onclick=()=>{if(n>0){n--;sfx('drop');upd();}};
  $('#mOk').onclick=()=>{if(n===s.n)stepDone('Le compte est bon.');else stepWrong(n<s.n?`Pas assez : tu en as ${n}. Relis la consigne.`:`Trop : tu en as ${n}. Relis la consigne.`);};}
/* cut: chop on the board */
function wCut(s,box){let n=0;
  box.innerHTML=`<div class="cutwrap"><div class="board" id="board"><button class="bigitem" id="bi"></button><div class="pieces" id="pieces"></div></div><div class="jinfo"><div class="read" id="read">0 / ${s.n}</div><small>Clique sur la planche pour couper.</small></div></div>`;
  $('#bi').appendChild(icv(s.item,6));
  const upd=()=>{$('#read').textContent=n+' / '+s.n;const p=$('#pieces');p.innerHTML='';for(let i=0;i<n;i++){const c=icv(s.item,2);c.style.cssText+=`;transform:rotate(${(i*47)%40-20}deg) scale(.8);margin:0 -3px`;p.appendChild(c);}};upd();
  $('#bi').onclick=()=>{if(n<s.n){n++;sfx('chop');const b=$('#bi');b.classList.remove('chop');void b.offsetWidth;b.classList.add('chop');upd();if(n===s.n)setTimeout(()=>stepDone('Bien coupé.'),300);}};}
/* wait: start the timer and watch the pot */
function wWait(s,box){
  box.innerHTML=`<div class="waitwrap"><div class="clock" id="clk">${s.mins} min</div><div class="pot"><div class="water"></div><div class="lid"></div></div><div class="jinfo"><small>La minuterie va plus vite que dans la vraie vie.</small><button class="btn" id="mOk">Lancer la minuterie</button></div></div>`;
  $('#mOk').onclick=()=>{const b=$('#mOk');b.disabled=true;window.__boil=1;sfx('pour');const t0=performance.now(),D=3200,iv=setInterval(()=>{const f=Math.min(1,(performance.now()-t0)/D);$('#clk').textContent=Math.max(0,Math.ceil(s.mins*(1-f)))+' min';if(f>=1){clearInterval(iv);window.__boil=0;sfx('chime');stepDone('C’est prêt !');}},80);};
}

/* ---------- dinner by candlelight (drawn at double size: every unit below is 2 canvas pixels) ---------- */
const Z=2;
let dTimer=0,dLines=[],dBubbles=[],dust=[],dSteam=[],dStage=0;
const zim=(k,x,y,flip)=>drawIm(k,x*Z,y*Z,Z,flip);
const zcv=(c,x,y)=>drawCv(c,x*Z,y*Z,Z);
const zr=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x*Z),Math.round(y*Z),Math.round(w*Z),Math.round(h*Z));};
const zs=(cx,cy,rx,ry,a)=>shadow(cx*Z,cy*Z,rx*Z,ry*Z,a);
let CANDLE=null,PLATE=null,GLASS=null,BASKET=null,DBG=null;
function startDinner(){
  mode='dinner';clearUI();onFrame=frameDinner;dTimer=0;dStage=0;dBubbles=[];dust=Array.from({length:26},()=>({x:Math.random()*240,y:Math.random()*135,s:.3+Math.random()*.6,p:Math.random()*6}));dSteam=[];
  CANDLE=candleSprite();PLATE=plateSprite(G.recipe.dish);GLASS=glassSprite();BASKET=breadBasket();DBG=buildDinnerBG();
  sfx('chime');
  el(`<div class="dcap"><b>${esc(G.recipe.nom)}</b><span>${esc(G.recipe.table)}</span></div>`,'dcap');
  const lines=[[2.2,'ines',rnd(TABLE_TALK.ines)],[5.2,'theo',rnd(TABLE_TALK.theo)],[8.2,'me','Bon appétit, la coloc !']];
  lines.forEach(([t,who,txt])=>setTimeout(()=>{if(mode!=='dinner')return;sfx('clink');const pos={ines:[156,52],theo:[120,34],me:[76,52]}[who];dBubbles.push({who,t:T});speak(pos[0]*Z/1,pos[1]*Z,esc(txt),3400,who);},t*1000));
  setTimeout(()=>{if(mode!=='dinner')return;el(`<button class="btn dgo" id="dGo">Continuer →</button>`);$('#dGo').onclick=()=>{closePanel('dGo');fadeTo(startReflect,700);};},9800);
}
function buildDinnerBG(){
  const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.imageSmoothingEnabled=false;
  const Zr=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(x*Z,y*Z,w*Z,h*Z);};
  /* wall: warm panelling */
  Zr(0,0,240,46,'#7a5448');for(let x=0;x<240;x+=20){Zr(x,0,1,46,'#6a463c');}Zr(0,30,240,2,'#a07058');Zr(0,32,240,14,'#5e3e34');for(let x=6;x<240;x+=20)Zr(x,34,8,10,'#6a463c');Zr(0,46,240,2,'#3a2420');
  /* floor */
  for(let y=48;y<135;y+=16)for(let x=0;x<240;x+=16)g.drawImage(IM.t_floor,x*Z,y*Z,16*Z,16*Z);
  const fg=g.createLinearGradient(0,48*Z,0,70*Z);fg.addColorStop(0,'rgba(20,10,5,.45)');fg.addColorStop(1,'rgba(20,10,5,0)');g.fillStyle=fg;g.fillRect(0,48*Z,W,22*Z);
  /* night window */
  Zr(158,7,32,26,'#0e1536');for(let i=0;i<14;i++)Zr(160+((i*37)%28),9+((i*19)%20),1,1,i%3?'#fff4c8':'#ffd77a');
  g.fillStyle='#fff4d0';g.beginPath();g.arc(178*Z,16*Z,3.4*Z,0,7);g.fill();g.fillStyle='#0e1536';g.beginPath();g.arc(179.6*Z,15*Z,3*Z,0,7);g.fill();
  Zr(156,5,36,3,'#c8a070');Zr(156,33,36,3,'#a8804e');Zr(156,5,3,31,'#c8a070');Zr(189,5,3,31,'#c8a070');Zr(172,5,2,31,'#c8a070');
  /* pictures, plant, rug */
  g.drawImage(IM.k_paint1,40*Z,12*Z,10*Z,13*Z);g.drawImage(IM.k_paint2,60*Z,16*Z,10*Z,9*Z);g.drawImage(IM.k_paint1,105*Z,10*Z,10*Z,13*Z);
  g.drawImage(IM.p_plant_big,206*Z,18*Z,18*Z*1,31*Z*1);
  g.drawImage(IM.p_rug_red,60*Z,76*Z,120*0+60*Z,39*Z);
  return c;
}
function frameDinner(dt){
  dTimer+=dt;ctx.drawImage(DBG,0,0);
  /* string lights along the top of the wall */
  for(let i=0;i<14;i++){const x=10+i*17,y=3+Math.sin(i*.9)*2+2;zr(x,y,1,3,'#2a1c10');const on=(Math.floor(T*1.2+i)%2);zr(x-1,y+3,3,3,on?'#ffe9a8':'#ffc860');}
  /* table cloth */
  zs(120,104,38,5,.34);
  zr(86,78,68,24,'#e8d6c0');zr(86,78,68,2,'#fff6e8');zr(86,98,68,6,'#c0392b');
  for(let y=80;y<98;y+=4)for(let x=88;x<152;x+=4){if(((x-88)/4+(y-80)/4)%2===0)zr(x,y,4,4,'#d85a4a');else zr(x,y,4,4,'#fffaf0');}
  zr(86,98,68,1,'#8a2a20');for(let x=88;x<152;x+=6)zr(x,99,3,4,'#a8301f');
  zr(86,78,1,26,'#b8a890');zr(153,78,1,26,'#9a8a72');
  /* Théo sits behind the table */
  zs(120,70,8,2,.3);spr(AV.theo,'sit',3,0,120*Z,76*Z,Z);
  /* chairs + people on the sides */
  zim('k_chair_r',70,76);zs(76,100,7,2,.3);spr(AV.me,'sit',0,0,76*Z,100*Z,Z);
  zim('k_chair_r',160,76,true);zs(164,100,7,2,.3);spr(AV.ines,'sit',2,0,164*Z,100*Z,Z);
  /* the table in front of everyone: dishes, glasses, bread, candles */
  const plates=[[92,88],[132,88],[112,84]];plates.forEach(([x,y])=>{zcv(PLATE,x,y);});
  zcv(GLASS,86,84);zcv(GLASS,146,84);zcv(BASKET,142,78);
  zcv(CANDLE,114,72);zcv(CANDLE,123,74);
  /* steam above the plates */
  if(Math.random()<.35)dSteam.push({x:(plates[Math.floor(Math.random()*3)][0]+9)*Z,y:(plates[0][1]+2)*Z,a:.5});
  dSteam.forEach(p=>{p.y-=14*dt;p.x+=Math.sin(T*2+p.y*.1)*.3;p.a-=dt*.3;ctx.fillStyle=`rgba(255,255,255,${Math.max(0,p.a)*.55})`;ctx.fillRect(Math.round(p.x),Math.round(p.y),3,3);});dSteam=dSteam.filter(p=>p.a>0);
  /* flames */
  const fl=(x,y,s)=>{const f=1+.25*Math.sin(T*9+s)+.15*Math.sin(T*17+s*2);ctx.fillStyle='#ffd34a';ctx.fillRect(Math.round((x+2)*Z),Math.round((y-2-f)*Z),Z,Math.round((2+f)*Z));ctx.fillStyle='#fff3b0';ctx.fillRect(Math.round((x+2)*Z),Math.round((y-1)*Z),Z,Z);ctx.fillStyle='#ff9a2e';ctx.fillRect(Math.round((x+2)*Z),Math.round((y-3-f)*Z),Z,Z);};
  fl(114,72,1);fl(123,74,3);
  /* hearts now and then */
  dBubbles=dBubbles.filter(b=>T-b.t<2.6);dBubbles.forEach(b=>{const pos={ines:[164,60],theo:[120,42],me:[76,60]}[b.who];bubble('heart',pos[0]*Z+14,pos[1]*Z-4,Z/2);});
  /* dust floating in the candle light */
  dust.forEach(d=>{d.y-=d.s*3*dt;d.x+=Math.sin(T+d.p)*.1;if(d.y<0)d.y=135;const dist=Math.hypot(d.x-118,d.y-76);if(dist<70){ctx.fillStyle=`rgba(255,230,170,${.5-dist/160})`;ctx.fillRect(Math.round(d.x*Z),Math.round(d.y*Z),Z,Z);}});
  /* light: dark blue evening, everything near the candles glows warm */
  const f=1+.06*Math.sin(T*8)+.04*Math.sin(T*13.7);
  applyLight(lightLayer('rgb(82,74,112)',[[118*Z,80*Z,95*Z*f,'255,196,120',.95],[118*Z,76*Z,45*Z*f,'255,222,160',.7],[40*Z,8*Z,50*Z,'255,220,150',.25],[110*Z,10*Z,60*Z,'255,220,150',.22],[185*Z,10*Z,50*Z,'255,220,150',.25]]),.62);
  glowAdd(118*Z,76*Z,40*Z*f,'255,170,80',.22);
}

  const chips=a=>a.map(x=>`<button class="chip" data-v="${esc(x)}">${esc(x)}</button>`).join('');
  el(`<div class="reflect"><h2>Réflexion <small>· you can answer in English</small></h2>
    <div class="q"><b>1. Which part of a label helped you the most?</b><div class="chips" data-q="label">${chips(labels)}</div></div>
    <div class="q"><b>2. Which quantity words were hardest to turn into numbers?</b><div class="chips" data-q="words">${chips(words)}</div></div>
    <div class="q"><b>3. Next time I shop for food in French, I will…</b><textarea id="rText" rows="3" placeholder="Write one sentence."></textarea></div>
    <div class="cbtns"><button class="btn" id="rDone">Voir mon bilan →</button></div></div>`);
  $$('.chips').forEach(ch=>ch.querySelectorAll('.chip').forEach(b=>b.onclick=()=>b.classList.toggle('sel')));
  $('#rDone').onclick=()=>{G.reflect={label:$$('.chips[data-q=label] .sel').map(b=>b.dataset.v),words:$$('.chips[data-q=words] .sel').map(b=>b.dataset.v),text:$('#rText').value.trim()};LS.set(SAVE+'.reflect',G.reflect);fadeTo(startBilan,500);};
}

/* ---------- bilan ---------- */
const scoreNow=()=>Math.max(40,100-Math.min(40,10*G.lineErr)-Math.min(20,4*G.cookErr));
function startBilan(){
  mode='bilan';clearUI();const score=scoreNow(),stars=score>=90?3:score>=75?2:1,best=Math.max(LS.get(SAVE+'.best',0),score);LS.set(SAVE+'.best',best);
  onFrame=()=>{ctx.drawImage(DBG||STOREBG,0,0);ctx.fillStyle='rgba(20,12,30,.72)';ctx.fillRect(0,0,W,H);};
  try{if(window.GVJetons&&!startBilan.paid){startBilan.paid=1;GVJetons.award(GAME_ID,score/100);}}catch(e){}
  const msg=score>=90?'Un souper parfait : liste, étiquettes et quantités, tout y est.':score>=75?'Très bon souper ! Quelques détails à revoir dans les étiquettes ou les quantités.':'Le souper est servi. La prochaine fois, relis la liste et les étiquettes avec plus de calme.';
  el(`<div class="bilan"><h2>Bilan du souper</h2><div class="stars">${'★'.repeat(stars)}<i>${'★'.repeat(3-stars)}</i></div><div class="bscore">${score} <small>/ 100</small></div><p>${msg}</p>
    <div class="bstats"><div><b>${G.checks}</b><span>vérification${G.checks>1?'s':''} avant de partir</span></div><div><b>${G.lineErr}</b><span>erreur${G.lineErr>1?'s':''} de liste</span></div><div><b>${G.cookErr}</b><span>erreur${G.cookErr>1?'s':''} de quantité</span></div></div>
    <div class="cbtns"><button class="btn sec" id="bRec">Télécharger mon reçu</button><button class="btn" id="bAgain">Un autre souper</button></div><a class="bhome" href="../index.html">← Retour aux jeux</a></div>`);
  $('#bRec').onclick=()=>downloadReceipt(score);$('#bAgain').onclick=()=>{startIntro();};
}
function downloadReceipt(score){
  const R=G.recipe,c=document.createElement('canvas'),lines=R.lines.length;c.width=620;c.height=360+lines*34;const g=c.getContext('2d');
  g.fillStyle='#fbf6e8';g.fillRect(0,0,c.width,c.height);g.fillStyle='#2a1c10';g.font='700 40px Pix, monospace';g.textAlign='center';g.fillText('MARCHÉ DU COIN',c.width/2,56);
  g.font='24px Pix, monospace';g.fillText('La colocation · Le marché',c.width/2,90);g.textAlign='left';
  g.fillText(new Date().toLocaleDateString('fr-CA'),30,130);g.textAlign='right';g.fillText(look.name||'',c.width-30,130);g.textAlign='left';
  g.fillRect(30,146,c.width-60,2);g.font='26px Pix, monospace';let y=184;
  R.lines.forEach(L=>{g.textAlign='left';g.fillText(L.say,30,y);g.textAlign='right';g.fillText(money(PRODUCTS[L.id].price*L.n),c.width-30,y);y+=34;});
  g.fillRect(30,y-14,c.width-60,2);g.textAlign='left';g.font='700 28px Pix, monospace';g.fillText('Repas : '+R.nom,30,y+24);g.fillText('Score : '+score+' / 100',30,y+62);
  g.font='22px Pix, monospace';g.fillText('Erreurs de liste : '+G.lineErr+' · de quantité : '+G.cookErr,30,y+96);
  c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mon-souper.png';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);});
}

/* ---------- start (and a few hooks for testing: #store, #shelf-legumes, #cook, #dinner, #bilan) ---------- */
window.__G=G;window.__go={store:()=>{newGame();buildAv();startStore(true);},shelf:st=>{newGame();buildAv();startStore(true);openShelf(st);},cook:()=>{newGame();buildAv();for(const l of G.recipe.lines)G.cart[l.id]=l.n;startCook();},dinner:()=>{newGame();buildAv();startDinner();},bilan:()=>{newGame();buildAv();startBilan();},creator:()=>{buildAv();startCreator();}};
Promise.all([loadAll(),document.fonts?document.fonts.load('28px Pix'):0]).then(()=>{
  buildAv();requestAnimationFrame(frame);
  const h=location.hash.replace('#','');
  if(h==='store')__go.store();else if(h.startsWith('shelf-'))__go.shelf(h.slice(6));else if(h==='cook')__go.cook();else if(h==='dinner')__go.dinner();else if(h==='bilan')__go.bilan();else if(h==='creator')__go.creator();
  else startTitle();
});

</script></body></html>
