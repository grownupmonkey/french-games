<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Le grand voyage — Choisis ton jeu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF3E4; --navy:#1F2A44; --rose:#E88B9C; --blue:#5B8DB8; --gold:#F2C14E; --ink:#141c30;
  --ease:cubic-bezier(.2,.8,.2,1);
  --ch:min(430px,50vh); --cw:calc(var(--ch) * .714);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Atkinson Hyperlegible',system-ui,sans-serif;color:var(--cream);background:#1F2A44;overflow:hidden;display:flex;flex-direction:column}
button{font-family:inherit}
button:focus-visible,.rcard:focus-visible,.tile:focus-visible,.pin:focus-visible{outline:4px solid var(--gold);outline-offset:4px}
[hidden]{display:none!important}

/* ===== world background (swapped by the equipped prize) ===== */
#world{position:fixed;inset:0;z-index:0;background:var(--bgc,#1F2A44);transition:background .8s}
#world::before{content:"";position:absolute;inset:0;pointer-events:none}
#world.aurora::before{background:
  radial-gradient(60% 40% at 30% 30%,rgba(60,255,170,.35),transparent 70%),
  radial-gradient(50% 35% at 70% 25%,rgba(150,90,255,.35),transparent 70%);
  filter:blur(24px);animation:aur 9s ease-in-out infinite alternate}
@keyframes aur{to{transform:translateX(8%) skewX(-8deg);opacity:.7}}
#world.cosmos::before{background:radial-gradient(40% 30% at 20% 70%,rgba(255,120,200,.28),transparent 70%),radial-gradient(40% 30% at 85% 60%,rgba(80,160,255,.28),transparent 70%);animation:aur 12s ease-in-out infinite alternate}
#world.gold::before{background:linear-gradient(115deg,transparent 35%,rgba(255,240,170,.45) 48%,transparent 60%);background-size:260% 100%;animation:sweep 5s linear infinite}
@keyframes sweep{from{background-position:130% 0}to{background-position:-130% 0}}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.route{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.route path{fill:none;stroke:rgba(251,243,228,.25);stroke-width:2;stroke-dasharray:3 11;stroke-linecap:round}
.plane{position:absolute;left:0;top:0;width:40px;height:40px;pointer-events:none;offset-path:path('M -60 520 C 300 120, 900 700, 1500 160');offset-rotate:auto;animation:fly 18s linear infinite}
@keyframes fly{from{offset-distance:0%}to{offset-distance:100%}}
.plane svg{width:100%;height:100%;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}

/* ===== header ===== */
header{position:relative;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px 0}
.logo{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(20px,2.4vw,28px);margin:0;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.logo span{color:var(--rose)}
.pill{background:rgba(20,28,48,.35);color:var(--cream);border:2px solid rgba(251,243,228,.7);border-radius:999px;padding:7px 18px;font-weight:700;font-size:16px;cursor:pointer;transition:background .2s,color .2s,transform .2s var(--ease)}
.pill:hover{background:var(--cream);color:var(--navy);transform:translateY(-2px)}
.hslot{min-width:120px;display:flex}
.hslot.r{justify-content:flex-end}
.tokens{display:flex;align-items:center;gap:8px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px;padding:4px 16px 4px 6px}
.coin{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff4c2,#F2C14E 55%,#c9981f);border:3px solid var(--ink);display:grid;place-items:center;color:var(--ink);font-size:16px;box-shadow:inset -3px -3px 0 rgba(0,0,0,.15)}
.tokens.bump .coin{animation:bump .6s var(--ease)}
@keyframes bump{40%{transform:scale(1.5) rotate(20deg)}}

.titles{position:relative;z-index:20;text-align:center;padding:0 16px;min-height:clamp(80px,14vh,140px)}
.headline{margin:4px 0 0;font-family:'Baloo 2',sans-serif;font-weight:800;text-transform:uppercase;font-size:clamp(26px,4.6vw,64px);line-height:.95;color:var(--gold);text-shadow:0 5px 0 rgba(0,0,0,.3);transition:opacity .3s var(--ease),transform .3s var(--ease)}
.sub{margin:8px auto 0;max-width:640px;font-weight:700;font-size:clamp(14px,1.6vw,18px);color:var(--cream);opacity:.92;text-shadow:0 2px 0 rgba(0,0,0,.3);transition:opacity .3s}
.swap{opacity:0;transform:translateY(12px)}

.view{position:relative;z-index:10;flex:1;min-height:0;display:flex;flex-direction:column}

/* ===== 3D ring ===== */
.stage{position:relative;flex:1;min-height:0;perspective:2300px;perspective-origin:50% 40%;touch-action:pan-y;cursor:grab;user-select:none}
.stage.grabbing{cursor:grabbing}
.ring{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;will-change:transform}
.platform{position:absolute;left:50%;top:50%;border-radius:50%;transform-style:flat;pointer-events:none}
.platform i{position:absolute;inset:0;border-radius:50%}
.rcard{position:absolute;left:calc(var(--cw)/-2);top:calc(var(--ch)/-2);width:var(--cw);height:var(--ch);transform-style:preserve-3d;outline:none;cursor:pointer}
.rcard.pop .rot{animation:popIn .9s var(--ease) backwards;animation-delay:calc(var(--i) * 80ms)}
@keyframes popIn{from{opacity:0;scale:.55}}
.rot{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateY(var(--rotY,0deg)) rotateX(var(--rotX,0deg));will-change:transform}
.face{position:absolute;inset:0;border-radius:6% / 4.3%;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:5px solid var(--cream);box-shadow:0 0 0 3px var(--ink)}
.rcard.front .face.f{box-shadow:0 0 0 3px var(--ink),0 0 calc(34px * var(--o,0)) rgba(242,193,78,.85)}
.face::after{content:"";position:absolute;inset:0;background:#0b1224;opacity:var(--dim,0);pointer-events:none}
.f{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;padding:12px 12px 14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.badge{width:38px;height:38px;border-radius:50%;background:var(--cream);border:3px solid var(--ink);display:grid;place-items:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:19px;line-height:1;transform:rotate(-8deg);box-shadow:0 3px 0 var(--ink)}
.place{flex:1;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(14px,1.6vw,19px);line-height:1;text-align:right}
.window{position:relative;flex:1;min-height:0;border:4px solid var(--ink);border-radius:14px;overflow:hidden;background:#fff;box-shadow:inset 0 -8px 0 rgba(20,28,48,.15)}
.window svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.bob{animation:bob 4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-3px) rotate(-1.5deg)}}
.drift{animation:drift 9s linear infinite}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(230px)}}
.title{margin:10px 2px 6px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(17px,1.9vw,24px);line-height:1.03}
.chip{align-self:flex-start;background:var(--ink);color:var(--cream);border-radius:999px;padding:4px 12px;font-size:clamp(12px,1.2vw,14px);font-weight:700;min-height:24px}
.chip:empty{visibility:hidden}
.foot{margin-top:8px;font-weight:700;font-size:13px}
.stamp{display:inline-block;border:3px double var(--ink);border-radius:8px;padding:1px 8px;transform:rotate(-5deg);font-family:'Baloo 2',sans-serif;font-weight:800;letter-spacing:.06em}
.b{transform:rotateY(180deg);background:var(--navy);display:grid;place-items:center;background-image:radial-gradient(rgba(251,243,228,.13) 1.4px,transparent 1.8px);background-size:16px 16px}
.b .seal{width:62%;aspect-ratio:1;border-radius:50%;border:4px double var(--gold);display:grid;place-items:center;text-align:center;color:var(--gold);font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(16px,2vw,24px);line-height:1;padding:10px;transform:rotate(-10deg)}
.b .seal span{color:var(--rose)}

/* holo foil + glare */
.shine,.glare{position:absolute;inset:0;pointer-events:none;border-radius:inherit}
.shine{background-image:repeating-linear-gradient(115deg,#f80e7b 0%,#eedf10 8%,#21e985 16%,#0dbde9 24%,#c929f1 32%,#f80e7b 40%),repeating-linear-gradient(-60deg,rgba(255,255,255,0) 0 14px,rgba(255,255,255,.55) 16px 18px,rgba(255,255,255,0) 20px 34px);background-size:300% 300%,100% 100%;background-position:var(--posx,50%) var(--posy,50%),center;mix-blend-mode:color-dodge;filter:brightness(.8) contrast(1.4) saturate(.9);opacity:calc(var(--o,0) * .7)}
.glare{background:radial-gradient(farthest-corner circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.85) 0%,rgba(255,255,255,.15) 30%,rgba(0,0,0,.28) 100%);mix-blend-mode:soft-light;opacity:var(--o,0)}

.hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:14px;opacity:.75;pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.35)}

/* shelf of equipped landmarks + mascot */
.shelf{position:absolute;right:4%;bottom:7%;display:flex;gap:6px;align-items:flex-end;pointer-events:none;z-index:6}
.shelf .lm{width:clamp(54px,8vw,104px)}
.fig-bob{animation:figbob 4.5s ease-in-out infinite;transform-origin:50% 92%}
@keyframes figbob{50%{transform:translateY(-2px) rotate(1.5deg)}}
.mascot{position:absolute;left:3%;bottom:4%;width:clamp(80px,11vw,150px);z-index:6;cursor:pointer;transition:transform .3s var(--ease)}
.mascot:hover{transform:scale(1.06)}
.mascot svg{width:100%;display:block;overflow:visible}
.m-bob{animation:mbob 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes mbob{50%{transform:translateY(-4px) scaleY(1.015)}}
.m-eyes{animation:blink 5s infinite;transform-origin:70px 52px}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.mascot:hover .arm-r,.mascot.jump .arm-r{animation:wave .5s ease-in-out infinite alternate;transform-origin:100px 92px}
@keyframes wave{from{transform:rotate(-12deg)}to{transform:rotate(-70deg)}}
.mascot.jump{animation:jump .7s var(--ease)}
@keyframes jump{30%{transform:translateY(-34px) scale(1.08)}60%{transform:translateY(0) scale(.96,1.04)}}

/* ===== controls ===== */
.controls{position:relative;z-index:20;display:flex;align-items:center;justify-content:center;gap:18px;padding:6px 16px 20px}
.arrow{width:52px;height:52px;border-radius:50%;border:3px solid var(--cream);background:rgba(20,28,48,.35);color:var(--cream);font-size:26px;font-weight:800;cursor:pointer;transition:background .2s,color .2s,transform .2s var(--ease)}
.arrow:hover:not(:disabled){background:var(--cream);color:var(--navy);transform:scale(1.08)}
.arrow:disabled{opacity:.3;cursor:default}
.cta{background:var(--gold);color:var(--ink);border:0;border-radius:999px;padding:14px 34px;min-width:176px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;cursor:pointer;box-shadow:0 6px 0 #b98a1f;transition:transform .15s var(--ease),box-shadow .15s}
.cta:hover{transform:translateY(-2px)}
.cta:active{transform:translateY(5px);box-shadow:0 1px 0 #b98a1f}
.cta.off{background:#59627a;color:#d7dbe6;box-shadow:0 6px 0 #3b4258}
.dots{position:absolute;left:0;right:0;bottom:5px;display:flex;justify-content:center;gap:7px;pointer-events:none}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(251,243,228,.3);transition:all .3s var(--ease)}
.dots i.on{background:var(--gold);width:22px;border-radius:6px}

/* ===== burst transition ===== */
.burst{position:fixed;z-index:80;background:var(--bgc2);border:5px solid var(--cream);border-radius:6% / 4.3%;transition:left .65s var(--ease),top .65s var(--ease),width .65s var(--ease),height .65s var(--ease),border-radius .65s var(--ease),opacity .5s;pointer-events:all}
.burst.go{left:0!important;top:0!important;width:100vw!important;height:100vh!important;border-radius:0;border-width:0}
.burst.out{opacity:0;pointer-events:none}

/* ===== globe view ===== */
#globeView{display:none}
#globeView.on{display:flex}
.gstage{position:relative;flex:1;min-height:0;overflow:hidden;cursor:grab;touch-action:none}
.gstage.grabbing{cursor:grabbing}
#gc{position:absolute;inset:0;width:100%;height:100%;display:block}
.pins{position:absolute;inset:0;pointer-events:none}
.pin,.cluster,.home{position:absolute;left:0;top:0;pointer-events:auto;border:0;background:none;padding:0;cursor:pointer;transform:translate(-50%,-100%);will-change:transform}
.pin .head{display:grid;place-items:center;width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--pc);border:3px solid var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.35),inset -4px -4px 0 rgba(0,0,0,.15);transition:transform .25s var(--ease)}
.pin .head b{transform:rotate(45deg);font-family:'Baloo 2',sans-serif;font-weight:800;font-size:17px;color:var(--ink);line-height:1}
.pin:hover .head,.pin.hot .head{transform:rotate(-45deg) scale(1.2)}
.pin.lock{filter:saturate(.2) brightness(.9)}
.pin .lab,.home .lab,.cluster .lab{position:absolute;left:50%;top:calc(100% + 4px);transform:translateX(-50%);white-space:nowrap;background:rgba(20,28,48,.88);color:var(--cream);border-radius:999px;padding:2px 10px;font-weight:700;font-size:13px;pointer-events:none}
.pin::before{content:"";position:absolute;left:50%;bottom:-6px;width:44px;height:16px;margin-left:-22px;border-radius:50%;border:3px solid var(--pc);opacity:0;animation:ping 2.2s ease-out infinite}
.pin.lock::before{display:none}
@keyframes ping{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.cluster .head{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--cream);color:var(--ink);border:3px solid var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.35);font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px;transition:transform .25s var(--ease)}
.cluster:hover .head{transform:scale(1.15)}
.cluster{transform:translate(-50%,-50%)}
.home{transform:translate(-50%,-50%)}
.home .head{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--rose);border:3px solid var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.35);font-size:16px;color:var(--ink)}
.home{pointer-events:none}
.home .lab{top:auto;bottom:calc(100% + 4px)}
.cluster .lab{top:calc(100% + 6px)}
.gtools{position:absolute;right:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:5}
.gtools .arrow{width:46px;height:46px;font-size:24px}
.gbar{position:relative;z-index:20;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:4px 16px 16px;max-width:1100px;margin:0 auto}
.gchip{background:rgba(20,28,48,.5);color:var(--cream);border:2px solid rgba(251,243,228,.55);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px;cursor:pointer;transition:background .2s,color .2s,transform .2s var(--ease)}
.gchip:hover:not(.lock){background:var(--gold);color:var(--ink);border-color:var(--gold);transform:translateY(-2px)}
.gchip.lock{opacity:.5;cursor:default}
.gchip.surprise{background:var(--rose);color:var(--ink);border-color:var(--rose)}

/* flight HUD + landing card */
.flight{position:absolute;left:0;right:0;top:12px;text-align:center;z-index:12;pointer-events:none}
.flight .big{display:inline-block;background:rgba(20,28,48,.85);border:3px solid var(--gold);border-radius:999px;padding:8px 22px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(18px,2.4vw,28px);color:var(--cream)}
.flight .big span{color:var(--gold)}
.skip{position:absolute;right:16px;bottom:16px;z-index:12}
.landing{position:absolute;left:50%;bottom:22px;transform:translate(-50%,140%);z-index:14;width:min(520px,92vw);background:var(--cream);color:var(--ink);border:5px solid var(--ink);border-radius:28px;box-shadow:0 14px 0 rgba(0,0,0,.3);padding:16px 18px 18px;display:flex;gap:14px;align-items:center;transition:transform .7s var(--ease)}
.landing.show{transform:translate(-50%,0)}
.landing .pic{flex:0 0 112px;height:112px;border-radius:16px;overflow:hidden;border:4px solid var(--ink);position:relative}
.landing .pic svg{position:absolute;inset:0;width:100%;height:100%}
.landing h3{margin:0 0 2px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(20px,2.4vw,26px);line-height:1}
.landing .kick{font-weight:700;color:#8a3a4a;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.landing p{margin:6px 0 10px;font-size:15px;line-height:1.3}
.landing .btns{display:flex;gap:10px;flex-wrap:wrap}
.landing .ghost{background:transparent;border:3px solid var(--ink);color:var(--ink);border-radius:999px;padding:8px 16px;font-weight:700;font-size:16px;cursor:pointer}
.stampfx{position:absolute;right:-8px;top:-18px;width:78px;height:78px;border:5px double #c4302b;color:#c4302b;border-radius:50%;display:grid;place-items:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:15px;transform:rotate(-14deg) scale(3);opacity:0;text-align:center;line-height:1}
.landing.show .stampfx{animation:thump .5s .5s var(--ease) forwards}
@keyframes thump{to{transform:rotate(-14deg) scale(1);opacity:.95}}

/* ===== modals ===== */
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(10,14,28,.78);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .35s}
.modal.on{opacity:1;pointer-events:auto}
.panel{position:relative;width:min(980px,96vw);max-height:92vh;overflow:auto;background:var(--navy);border:5px solid var(--cream);border-radius:28px;box-shadow:0 18px 0 rgba(0,0,0,.35);padding:20px 22px 22px;transform:translateY(30px) scale(.96);transition:transform .5s var(--ease)}
.modal.on .panel{transform:none}
.panel h2{margin:0 0 4px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(24px,3vw,36px);color:var(--gold)}
.x{position:absolute;right:14px;top:12px;width:40px;height:40px;border-radius:50%;border:3px solid var(--cream);background:transparent;color:var(--cream);font-size:20px;font-weight:800;cursor:pointer}
.x:hover{background:var(--cream);color:var(--navy)}
.tabs{display:flex;gap:8px;margin:10px 0 14px;flex-wrap:wrap}
.tab{background:transparent;color:var(--cream);border:2px solid rgba(251,243,228,.6);border-radius:999px;padding:7px 18px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px;cursor:pointer}
.tab.on{background:var(--cream);color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tile{position:relative;aspect-ratio:3/4;border-radius:18px;border:4px solid var(--rc);background:#26335a;color:var(--cream);cursor:pointer;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;font-family:inherit;overflow:hidden;transition:transform .25s var(--ease)}
.tile:hover:not(.lockd){transform:translateY(-4px) rotate(-1deg)}
.tile .art{flex:1;width:100%;display:grid;place-items:center;overflow:hidden;min-height:0}
.tile .art svg{height:100%;max-width:100%}
.tile .art .sw{width:100%;height:100%;border-radius:10px;border:3px solid var(--ink)}
.tile .nm{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:15px;line-height:1.05;margin-top:4px}
.tile .rr{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--rc)}
.tile.lockd{filter:grayscale(1) brightness(.5)}
.tile.lockd .art{font-size:44px;font-family:'Baloo 2',sans-serif;opacity:.6}
.tile.eq::after{content:"✓ ÉQUIPÉ";position:absolute;left:0;right:0;top:0;background:var(--gold);color:var(--ink);font-weight:800;font-size:11px;padding:2px}
.tile .cnt{position:absolute;right:6px;top:22px;background:var(--rose);color:var(--ink);border-radius:999px;font-weight:800;font-size:12px;padding:0 7px}
.tile .seas{font-size:11px;opacity:.8}
.tile.r-holo,.pcard.r-holo{background-image:linear-gradient(115deg,rgba(248,14,123,.28),rgba(238,223,16,.28),rgba(33,233,133,.28),rgba(13,189,233,.28),rgba(201,41,241,.28),rgba(248,14,123,.28));background-size:300% 100%;animation:foil 5s linear infinite}
@keyframes foil{to{background-position:300% 0}}
.tile.r-or,.pcard.r-or{background-image:linear-gradient(115deg,rgba(242,193,78,.25) 20%,rgba(255,245,190,.7) 45%,rgba(242,193,78,.25) 70%);background-size:300% 100%;animation:foil 3.5s linear infinite}
.progress{margin:0 0 6px;font-weight:700;opacity:.85}

/* ===== mystery box ===== */
.gx{text-align:center;min-height:430px;display:flex;flex-direction:column;align-items:center}
.arena{position:relative;width:min(380px,80vw);height:300px;margin:6px auto 0}
.rays{position:absolute;left:50%;top:50%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 8deg,var(--rg,#F2C14E) 10deg 20deg,transparent 22deg 40deg,var(--rg,#F2C14E) 42deg 52deg,transparent 54deg 72deg,var(--rg,#F2C14E) 74deg 84deg,transparent 86deg 104deg,var(--rg,#F2C14E) 106deg 116deg,transparent 118deg 140deg,var(--rg,#F2C14E) 142deg 152deg,transparent 154deg 180deg,var(--rg,#F2C14E) 182deg 192deg,transparent 194deg 220deg,var(--rg,#F2C14E) 222deg 232deg,transparent 234deg 260deg,var(--rg,#F2C14E) 262deg 272deg,transparent 274deg 300deg,var(--rg,#F2C14E) 302deg 312deg,transparent 314deg 340deg,var(--rg,#F2C14E) 342deg 352deg,transparent 354deg);opacity:0;-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%);transform:scale(.3)}
.arena.go .rays{opacity:.8;animation:spin 8s linear infinite,rayin .6s var(--ease) both}
@keyframes spin{to{rotate:360deg}}
@keyframes rayin{from{transform:scale(.3)}to{transform:scale(1)}}
.suit{position:absolute;left:50%;bottom:0;width:230px;margin-left:-115px;transform-origin:50% 100%}
.suit svg{width:100%;overflow:visible}
.suit .lid{transform-origin:20px 78px;transition:transform .5s var(--ease)}
.arena.shake .suit{animation:shake 1.25s ease-in-out}
@keyframes shake{0%,100%{transform:rotate(0)}10%{transform:rotate(-7deg) translateY(-6px)}20%{transform:rotate(7deg)}30%{transform:rotate(-9deg) translateY(-10px)}40%{transform:rotate(9deg)}55%{transform:rotate(-11deg) translateY(-14px) scale(1.04)}70%{transform:rotate(11deg) scale(1.06)}85%{transform:rotate(-5deg) scale(1.1)}}
.arena.go .suit .lid{transform:rotate(-70deg) translateY(-8px)}
.arena.go .suit{animation:squash .5s var(--ease)}
@keyframes squash{40%{transform:scale(1.15,.85)}}
.glowc{position:absolute;left:50%;bottom:30px;width:260px;height:160px;margin-left:-130px;border-radius:50%;background:radial-gradient(circle,var(--rg,#F2C14E),transparent 70%);opacity:0;filter:blur(8px)}
.arena.shake .glowc{opacity:.6;animation:glowp .5s ease-in-out infinite alternate}
@keyframes glowp{to{opacity:1;transform:scale(1.2)}}
.pcard{position:absolute;left:50%;top:6px;width:178px;height:236px;margin-left:-89px;border-radius:18px;border:5px solid var(--rc,#FBF3E4);background:#26335a;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px;color:var(--cream);opacity:0;transform:translateY(130px) scale(.3) rotateY(180deg);pointer-events:none}
.pcard{z-index:4}
.pcard.rise{opacity:1;transform:none;transition:transform 1s var(--ease),opacity .3s}
.arena.show .suit{animation:none;transform:translateY(120px) scale(.9);opacity:0;transition:transform .8s var(--ease),opacity .6s}
.pcard .art{flex:1;width:100%;display:grid;place-items:center;overflow:hidden;min-height:0}
.pcard .art svg{height:100%;max-width:100%}
.pcard .art .sw{width:100%;height:100%;border-radius:10px;border:3px solid var(--ink)}
.pcard .nm{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:17px;line-height:1.05}
.pcard .rr{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--rc)}
.pcard.r-or.rise,.pcard.r-holo.rise{box-shadow:0 0 36px var(--rc)}
.conf{position:absolute;left:50%;top:60%;width:10px;height:10px;border-radius:2px;pointer-events:none;z-index:3}
.flash{position:fixed;inset:0;background:#fff7d0;opacity:0;pointer-events:none;z-index:90}
.flash.on{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.gmsg{min-height:54px;margin:8px 0 6px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(18px,2.4vw,26px)}
.gmsg small{display:block;font-family:'Atkinson Hyperlegible',sans-serif;font-weight:700;font-size:15px;opacity:.85}
.gbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn2{background:var(--gold);color:var(--ink);border:0;border-radius:999px;padding:11px 26px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px;cursor:pointer;box-shadow:0 5px 0 #b98a1f}
.btn2:active{transform:translateY(4px);box-shadow:0 1px 0 #b98a1f}
.btn2.alt{background:transparent;color:var(--cream);box-shadow:none;border:3px solid var(--cream)}
.btn2:disabled{opacity:.4;cursor:default}

.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);opacity:0;z-index:95;background:var(--cream);color:var(--navy);padding:12px 24px;border-radius:999px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:19px;transition:opacity .3s,transform .3s;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:680px){
  :root{--ch:min(380px,46vh)}
  .hint{display:none}.gtools{right:8px}.landing{flex-direction:column;text-align:center}.landing .pic{flex-basis:90px;width:90px;height:90px}
  .shelf{display:none}.hslot{min-width:70px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="clay" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="b"/>
      <feSpecularLighting in="b" surfaceScale="3.5" specularConstant=".75" specularExponent="22" lighting-color="#fff" result="s">
        <fePointLight x="-40" y="-60" z="90"/>
      </feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
      <feComposite in="SourceGraphic" in2="s2" operator="arithmetic" k1="0" k2="1" k3=".5" k4="0"/>
    </filter>
  </defs>
</svg>

<div id="world">
  <canvas id="fx"></canvas>
  <svg class="route" viewBox="0 0 1440 800" preserveAspectRatio="none" aria-hidden="true"><path d="M -60 520 C 300 120, 900 700, 1500 160"/></svg>
  <div class="plane" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M3 22 45 4 33 44 23 28 3 22Z" fill="#FBF3E4" stroke="#1F2A44" stroke-width="2.5" stroke-linejoin="round"/><path d="M23 28 45 4 18 25Z" fill="#E88B9C" stroke="#1F2A44" stroke-width="2.5" stroke-linejoin="round"/></svg></div>
</div>

<header>
  <div class="hslot"><button class="pill" id="back" hidden>← Retour</button></div>
  <h1 class="logo">Le grand <span>voyage</span></h1>
  <div class="hslot r"><button class="pill tokens" id="tokens" aria-label="Jetons : ouvrir la boîte mystère"><span class="coin">★</span><span id="tokN">0</span></button></div>
</header>

<div class="titles">
  <h2 class="headline" id="headline">Choisis ta classe</h2>
  <p class="sub" id="sub"></p>
</div>

<!-- ring view (home + 10-3Y) -->
<section class="view" id="ringView">
  <div class="stage" id="stage">
    <div class="platform" id="platform"></div>
    <div class="ring" id="ring"></div>
    <div class="shelf" id="shelf"></div>
    <div class="mascot" id="mascot" title="Salut !"></div>
    <p class="hint" id="hint">Glisse pour faire tourner · clique la carte du devant</p>
  </div>
  <nav class="controls" aria-label="Navigation">
    <button class="arrow" id="prev" aria-label="Précédent">‹</button>
    <button class="cta" id="cta">Choisir →</button>
    <button class="arrow" id="next" aria-label="Suivant">›</button>
    <div class="dots" id="dots"></div>
  </nav>
</section>

<!-- globe view (20-3Y) -->
<section class="view" id="globeView">
  <div class="gstage" id="gstage">
    <canvas id="gc"></canvas>
    <div class="pins" id="pins"></div>
    <div class="gtools">
      <button class="arrow" id="zin" aria-label="Zoom avant">+</button>
      <button class="arrow" id="zout" aria-label="Zoom arrière">−</button>
    </div>
    <div class="flight" id="flightHud" hidden><span class="big">✈ Calgary → <span id="fto"></span></span></div>
    <button class="pill skip" id="skip" hidden>Passer le vol ⏭</button>
    <div class="landing" id="landing">
      <div class="stampfx">TAMPON<br>✓</div>
      <div class="pic" id="lpic"></div>
      <div>
        <div class="kick" id="lkick"></div>
        <h3 id="ltitle"></h3>
        <p id="lq"></p>
        <div class="btns"><button class="btn2" id="lplay">Jouer →</button><button class="ghost" id="lback">Retour au globe</button></div>
      </div>
    </div>
  </div>
  <div class="gbar" id="gbar"></div>
</section>

<!-- mystery box -->
<div class="modal" id="gachaM" role="dialog" aria-modal="true" aria-label="Boîte mystère">
  <div class="panel gx">
    <button class="x" data-close aria-label="Fermer">✕</button>
    <h2>Boîte mystère</h2>
    <p class="progress" id="gcost">Une boîte coûte 3 jetons.</p>
    <div class="arena" id="arena">
      <div class="rays"></div><div class="glowc"></div>
      <div class="pcard" id="pcard"></div>
      <div class="suit" id="suit"></div>
    </div>
    <div class="gmsg" id="gmsg"></div>
    <div class="gbtns"><button class="btn2" id="openBtn">Ouvrir · 3 jetons</button><button class="btn2 alt" id="equipBtn" hidden>Équiper</button><button class="btn2 alt" data-close>Fermer</button></div>
  </div>
</div>

<!-- collection -->
<div class="modal" id="colM" role="dialog" aria-modal="true" aria-label="Ma collection">
  <div class="panel">
    <button class="x" data-close aria-label="Fermer">✕</button>
    <h2>Ma collection</h2>
    <p class="progress" id="colProg"></p>
    <div class="tabs" id="tabs"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="flash" id="flash"></div>
<div class="toast" id="toast" role="status"></div>

<script>/* ================= APP ================= */
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const mod = (n,m) => ((n % m) + m) % m;

/* ---------- background particles ---------- */
const FX = (() => {
  const cv = $('fx'), x = cv.getContext('2d');
  let W = 0, H = 0, type = 'none', P = [], F = [], last = 0, nextF = 0;
  const rnd = (a,b) => a + Math.random() * (b - a);
  function size(){ W = cv.width = innerWidth; H = cv.height = innerHeight; init(); }
  function init(){
    P = []; F = [];
    const n = { stars:90, snow:90, petals:36, leaves:36, bubbles:34, sparks:70, goldsparks:70 }[type] || 0;
    for (let i = 0; i < n; i++) P.push({ x:rnd(0,W), y:rnd(0,H), r:rnd(1,3.5), ph:rnd(0,6.3), vy:rnd(20,60), vx:rnd(-14,14), rot:rnd(0,6.3), vr:rnd(-2,2), c:Math.random() });
  }
  function set(t){ type = reduceMotion && t !== 'stars' ? 'none' : t; init(); }
  const LEAF = ['#c4302b','#d9692a','#f2a33a','#a8402a'], PET = ['#f8c8d8','#fff','#fbe39a'];
  function frame(ts){
    const dt = Math.min(.05, (ts - last) / 1000 || .016); last = ts;
    x.clearRect(0,0,W,H);
    if (type === 'stars'){
      P.forEach(p => { p.ph += dt * 2; x.globalAlpha = .25 + .55 * (.5 + .5 * Math.sin(p.ph)); x.fillStyle = '#fbf3e4'; x.beginPath(); x.arc(p.x,p.y,p.r*.6,0,6.3); x.fill(); });
    } else if (type === 'snow'){
      P.forEach(p => { p.y += p.vy*dt*.6; p.x += Math.sin(p.ph += dt) * 18 * dt; if (p.y > H) { p.y = -5; p.x = rnd(0,W); } x.globalAlpha = .85; x.fillStyle = '#fff'; x.beginPath(); x.arc(p.x,p.y,p.r,0,6.3); x.fill(); });
    } else if (type === 'petals' || type === 'leaves'){
      const cols = type === 'leaves' ? LEAF : PET;
      P.forEach(p => { p.y += p.vy*dt; p.x += (p.vx + Math.sin(p.ph += dt*1.5)*24) * dt; p.rot += p.vr*dt; if (p.y > H + 20) { p.y = -20; p.x = rnd(0,W); }
        x.save(); x.translate(p.x,p.y); x.rotate(p.rot); x.globalAlpha = .9; x.fillStyle = cols[Math.floor(p.c * cols.length)];
        x.beginPath(); x.ellipse(0,0,p.r*3.2,p.r*1.8,0,0,6.3); x.fill(); x.restore(); });
    } else if (type === 'bubbles'){
      P.forEach(p => { p.y -= p.vy*dt*.7; p.x += Math.sin(p.ph += dt) * 10 * dt; if (p.y < -10) { p.y = H + 10; p.x = rnd(0,W); } x.globalAlpha = .5; x.strokeStyle = '#fff'; x.lineWidth = 2; x.beginPath(); x.arc(p.x,p.y,p.r*2.4,0,6.3); x.stroke(); });
    } else if (type === 'sparks' || type === 'goldsparks'){
      P.forEach(p => { p.y -= p.vy*dt*.25; p.ph += dt*3; if (p.y < -10) { p.y = H + 10; p.x = rnd(0,W); }
        x.globalAlpha = .3 + .6 * Math.abs(Math.sin(p.ph)); x.fillStyle = type === 'goldsparks' ? '#ffe79a' : `hsl(${Math.floor(p.c*360)},90%,75%)`;
        x.beginPath(); x.moveTo(p.x, p.y - p.r*2.2); x.lineTo(p.x + p.r*.7, p.y); x.lineTo(p.x, p.y + p.r*2.2); x.lineTo(p.x - p.r*.7, p.y); x.closePath(); x.fill(); });
    } else if (type === 'fireworks'){
      nextF -= dt;
      if (nextF <= 0){ nextF = rnd(.7,1.5); const cx = rnd(W*.15,W*.85), cy = rnd(H*.1,H*.5), col = `hsl(${Math.floor(rnd(0,360))},90%,65%)`;
        const parts = []; for (let i = 0; i < 46; i++){ const a = i / 46 * 6.283, v = rnd(80,170); parts.push({ x:cx, y:cy, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:1 }); } F.push({ parts, col }); }
      F = F.filter(f => f.parts[0].life > 0);
      F.forEach(f => f.parts.forEach(p => { p.vy += 110*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt*.7; x.globalAlpha = Math.max(0,p.life); x.fillStyle = f.col; x.beginPath(); x.arc(p.x,p.y,2.4,0,6.3); x.fill(); }));
    }
    x.globalAlpha = 1;
  }
  size(); addEventListener('resize', size);
  return { set, frame };
})();

const stage = $('stage'), ringEl = $('ring'), plat = $('platform');
const RG = { items:[], cards:[], N:0, step:0, R:0, cw:0, ang:0, tgt:0, drag:false, sel:-1, px:null, py:null, view:'home' };
const STAMP = { g20:'PASSEPORT', g10:'6 JEUX', box:'SURPRISE', col:'ALBUM', rnd:'HASARD' };
const prizeTotal = PRIZES.length;

function homeItems(){

  items.find(i => i.id === 'col').chip = `${ownedCount()}/${prizeTotal} objets`;
  return items;
}

function cardFront(it, i){
  const stamp = STAMP[it.id] || (it.open === false ? 'BIENTÔT' : it.kind === 'game' ? 'À JOUER' : 'PASSEPORT');
  return `<div class="face f" style="--bg:${it.color}">
    <div class="top"><div class="badge">${it.mark}</div><div class="place">${it.place}</div></div>
    <div class="window"><svg viewBox="0 0 200 150" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${renderScene(it.scene, 'r' + RG.view + i)}</svg><div class="shine"></div><div class="glare"></div></div>
    <h3 class="title">${it.title}</h3><span class="chip">${it.chip || ''}</span>
    <div class="foot"><span class="stamp">${stamp}</span></div>
    <div class="shine" style="mix-blend-mode:overlay;opacity:calc(var(--o,0)*.25)"></div><div class="glare"></div>
  </div>`;
}

function ringBuild(items, view){
  RG.items = items; RG.N = items.length; RG.step = 360 / RG.N; RG.view = view;
  ringEl.innerHTML = '';
  RG.cards = items.map((it, i) => {
    const el = document.createElement('div');
    el.className = 'rcard pop'; el.style.setProperty('--i', i);
    el.tabIndex = 0; el.setAttribute('role','option');
    el.setAttribute('aria-label', it.title + (it.open === false ? ' (bientôt)' : ''));
    el.innerHTML = `<div class="rot">${cardFront(it, i)}<div class="face b"><div class="seal">Le grand<br><span>voyage</span></div></div></div>`;
    ringEl.appendChild(el);
    return { el, rot:el.querySelector('.rot'), x:0, y:0, tx:0, ty:0, o:0, to:0 };
  });
  $('dots').innerHTML = items.map(() => '<i></i>').join('');
  RG.ang = 0; RG.tgt = 0; RG.sel = -1;
  ringLayout();
}
function ringLayout(){
  if (!RG.cards.length) return;
  RG.cw = RG.cards[0].el.offsetWidth;
  RG.R = Math.max(RG.cw * 1.3, (RG.cw * 1.1 / 2) / Math.tan(Math.PI / RG.N));
  RG.cards.forEach((c, i) => { c.el.style.transform = `rotateY(${i * RG.step}deg) translateZ(${RG.R}px)`; });
  const D = (RG.R + RG.cw * .62) * 2;
  const chh = RG.cards[0].el.offsetHeight;
  plat.style.width = plat.style.height = D + 'px';
  plat.style.marginLeft = plat.style.marginTop = (-D / 2) + 'px';
  plat.style.transform = `translateY(${chh / 2 + 10}px) translateZ(${-RG.R}px) rotateX(90deg)`;
  plat.innerHTML = `<i style="background:radial-gradient(circle,#3b4a7c 0,#2a3762 62%,#1d2748 100%);border:8px solid #141c30;box-shadow:0 0 0 10px rgba(251,243,228,.12)"></i><i class="ticks" style="background:repeating-conic-gradient(from 0deg,rgba(251,243,228,.5) 0 1.4deg,transparent 1.4deg 12deg);-webkit-mask:radial-gradient(circle,transparent 80%,#000 81%,#000 93%,transparent 94%);mask:radial-gradient(circle,transparent 80%,#000 81%,#000 93%,transparent 94%)"></i>`;
}

function ringSel(){ return mod(Math.round(-RG.ang / RG.step), RG.N); }
function ringGo(i){
  const base = -i * RG.step;
  RG.tgt = base + 360 * Math.round((RG.ang - base) / 360);
}
function ringNudge(d){ RG.tgt = Math.round(RG.tgt / RG.step) * RG.step - d * RG.step; }

function onSel(){
  const it = RG.items[RG.sel];
  if (!it) return;
  swapText($('headline'), it.title);
  swapText($('sub'), it.blurb || '');
  $('cta').textContent = it.cta || 'Choisir →';
  $('cta').classList.toggle('off', it.open === false);
  [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i === RG.sel));
}

function ringTick(t){
  const f = RG.cards.length; if (!f) return;
  if (!RG.drag){ const d = RG.tgt - RG.ang; RG.ang += d * .1; if (Math.abs(d) < .02) RG.ang = RG.tgt; }
  ringEl.style.transform = `translateZ(${-RG.R}px) rotateY(${RG.ang}deg)`;
  plat.style.setProperty('--pa', RG.ang + 'deg');
  const ticks = plat.querySelector('.ticks'); if (ticks) ticks.style.transform = `rotate(${-RG.ang}deg)`;
  const s = ringSel(); if (s !== RG.sel){ RG.sel = s; onSel(); }
  RG.cards.forEach((c, i) => {
    const rel = norm180(i * RG.step + RG.ang);
    const front = Math.abs(rel) < RG.step * .45;
    c.el.classList.toggle('front', front);
    c.el.style.setProperty('--dim', clamp((1 - Math.cos(rel * Math.PI / 180)) * .5, 0, .72).toFixed(3));
    let hover = false;
    if (front){
      const r = c.rot.getBoundingClientRect();
      if (RG.px !== null && RG.px >= r.left && RG.px <= r.right && RG.py >= r.top && RG.py <= r.bottom && !RG.drag){
        hover = true; c.tx = (RG.px - r.left) / r.width - .5; c.ty = (RG.py - r.top) / r.height - .5;
      }
    }
    if (front && !hover && !reduceMotion){ c.tx = Math.sin(t / 1400 + i) * .32; c.ty = Math.cos(t / 1900 + i) * .22; c.to = .55; }
    else { c.to = front && hover ? 1 : 0; if (!front){ c.tx = 0; c.ty = 0; } }
    c.x += (c.tx - c.x) * .09; c.y += (c.ty - c.y) * .09; c.o += (c.to - c.o) * .08;
    const st = c.el.style;
    c.rot.style.setProperty('--rotY', (c.x * 30) + 'deg');
    c.rot.style.setProperty('--rotX', (-c.y * 30) + 'deg');
    st.setProperty('--mx', ((c.x + .5) * 100) + '%'); st.setProperty('--my', ((c.y + .5) * 100) + '%');
    st.setProperty('--posx', ((c.x + .5) * 100) + '%'); st.setProperty('--posy', ((c.y + .5) * 100) + '%');
    st.setProperty('--o', Math.max(0, c.o).toFixed(3));
  });
}

// drag to spin, with momentum
let dr = null;
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('.mascot,button')) return;
  dr = { x:e.clientX, y:e.clientY, a:RG.ang, t:performance.now(), moved:false, v:0, lx:e.clientX, lt:performance.now() };
});
addEventListener('pointermove', e => {
  RG.px = e.clientX; RG.py = e.clientY;
  if (!dr) return;
  const dx = e.clientX - dr.x;
  if (!dr.moved && Math.abs(dx) > 6){ dr.moved = true; RG.drag = true; stage.classList.add('grabbing'); }
  if (dr.moved){
    RG.ang = dr.a + dx * (57.3 / RG.R) * .85;
    const now = performance.now(), dt = Math.max(1, now - dr.lt);
    dr.v = dr.v * .6 + ((e.clientX - dr.lx) * (57.3 / RG.R) * .85 / dt) * .4;
    dr.lx = e.clientX; dr.lt = now;
  }
});
addEventListener('pointerup', e => {
  if (!dr) return;
  const d = dr; dr = null;
  if (d.moved){
    RG.drag = false; stage.classList.remove('grabbing');
    const proj = RG.ang + d.v * 260;
    RG.tgt = Math.round(proj / RG.step) * RG.step;
    return;
  }
  const el = e.target.closest && e.target.closest('.rcard');
  if (!el) return;
  const i = RG.cards.findIndex(c => c.el === el);
  if (i < 0) return;
  if (i !== ringSel()) ringGo(i); else activate(RG.items[i]);
});
stage.addEventListener('pointerleave', () => { RG.px = null; RG.py = null; });
let wheelLock = 0;
stage.addEventListener('wheel', e => {
  e.preventDefault();
  if (performance.now() < wheelLock) return;
  wheelLock = performance.now() + 380;
  ringNudge(e.deltaY > 0 || e.deltaX > 0 ? 1 : -1);
}, { passive:false });
$('prev').addEventListener('click', () => ringNudge(-1));
$('next').addEventListener('click', () => ringNudge(1));
$('cta').addEventListener('click', () => activate(RG.items[ringSel()]));
stage.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); activate(RG.items[ringSel()]); }
});

function activate(it){
  if (!it) return;
  if (it.kind === 'grade'){
    burst(it.color, () => { it.grade === '20' ? goGlobe() : goRing10(); });

  else if (it.kind === 'collection'){ openCollection(); }

    const d = pool[Math.floor(Math.random() * pool.length)];
    burst(it.color, () => { goGlobe(); setTimeout(() => startFlight(d), 700); });
  } else if (it.kind === 'game'){ if (it.href) burst(it.color, () => { location.href = it.href; }); else toast('Ce jeu arrive bientôt !'); }
}

function globeResize(){
  G.dpr = Math.min(2, devicePixelRatio || 1);
  G.w = gstage.clientWidth; G.h = gstage.clientHeight;
  gc.width = G.w * G.dpr; gc.height = G.h * G.dpr;
  const old = G.R0; G.R0 = Math.min(G.w, G.h) * .46;
  G.cam.R = old ? G.cam.R * (G.R0 / old) : G.R0;

function globeReset(){

function drawGlobe(now){
  const { w, h } = G, R = G.cam.R, cx = w / 2, cy = h * .5;
  gx.setTransform(G.dpr, 0, 0, G.dpr, 0, 0); gx.clearRect(0, 0, w, h);
  proj.translate([cx, cy]).scale(R).rotate([-G.cam.c[0], -G.cam.c[1], 0]);
  // ground shadow
  gx.fillStyle = 'rgba(0,0,0,.22)'; gx.beginPath(); gx.ellipse(cx, cy + R * 1.05, R * .78, R * .1, 0, 0, 6.3); gx.fill();
  // ocean
  gx.beginPath(); gpath({ type:'Sphere' });
  const og = gx.createRadialGradient(cx - R * .3, cy - R * .35, R * .1, cx, cy, R); og.addColorStop(0, '#6fa3d3'); og.addColorStop(1, '#2d5d8c');
  gx.fillStyle = og; gx.fill();
  gx.beginPath(); gpath(GRAT); gx.strokeStyle = 'rgba(255,255,255,.13)'; gx.lineWidth = 1; gx.stroke();
  // land: soft shadow first (clay thickness), then fill
  gx.save(); gx.translate(0, Math.max(2, R * .014)); gx.beginPath(); gpath(LAND); gpath(ISLANDS); gx.fillStyle = 'rgba(8,24,52,.42)'; gx.fill(); gx.restore();
  gx.beginPath(); gpath(LAND); gpath(ISLANDS); gx.fillStyle = '#9fd09a'; gx.fill(); gx.lineWidth = 1.6; gx.strokeStyle = 'rgba(20,28,48,.55)'; gx.stroke();
  gx.beginPath(); gpath(BORDERS); gx.strokeStyle = 'rgba(20,28,48,.28)'; gx.lineWidth = .8; gx.stroke();
  // routes from Calgary
  gx.save(); gx.setLineDash([3, 8]); gx.lineCap = 'round'; gx.lineWidth = 2;
  GAMES_20.forEach(d => { gx.beginPath(); gpath({ type:'LineString', coordinates:[HOME_C, [d.lon, d.lat]] }); gx.strokeStyle = d.open ? 'rgba(251,243,228,.6)' : 'rgba(251,243,228,.2)'; gx.stroke(); });
  gx.restore();
  // flight trail
  const F = G.flight;
  if (F && F.phase !== 'prep' && F.e !== undefined){
    const pts = []; for (let i = 0; i <= 48; i++) pts.push(F.it(F.e * i / 48));
    gx.save(); gx.lineCap = 'round'; gx.lineJoin = 'round';
    gx.beginPath(); gpath({ type:'LineString', coordinates:pts }); gx.strokeStyle = 'rgba(232,139,156,.55)'; gx.lineWidth = 9; gx.stroke();
    gx.setLineDash([2, 12]); gx.strokeStyle = '#fff'; gx.lineWidth = 3.5; gx.stroke(); gx.restore();
  }
  // clay shading + rim
  gx.save(); gx.beginPath(); gpath({ type:'Sphere' }); gx.clip();
  const sg = gx.createRadialGradient(cx - R * .38, cy - R * .42, R * .05, cx, cy, R * 1.04);
  sg.addColorStop(0, 'rgba(255,255,255,.42)'); sg.addColorStop(.35, 'rgba(255,255,255,0)'); sg.addColorStop(.78, 'rgba(10,20,50,.12)'); sg.addColorStop(1, 'rgba(10,20,50,.55)');
  gx.fillStyle = sg; gx.fillRect(cx - R - 2, cy - R - 2, R * 2 + 4, R * 2 + 4); gx.restore();
  gx.beginPath(); gpath({ type:'Sphere' }); gx.lineWidth = 5; gx.strokeStyle = '#141c30'; gx.stroke();
  // plane
  if (F && F.phase === 'fly'){
    const a = proj(F.pos), b = proj(F.it(Math.min(1, F.e + .01)));
    if (a && b){
      const ang = Math.atan2(b[1] - a[1], b[0] - a[0]), alt = Math.sin(Math.PI * F.p), sc = (G.R0 / 300) * (1.5 + .9 * alt);
      gx.save(); gx.translate(a[0], a[1] + 10 + 34 * alt); gx.rotate(ang); gx.scale(sc, sc * .8); gx.fillStyle = 'rgba(0,0,0,.28)'; gx.fill(PLANE); gx.restore();
      gx.save(); gx.translate(a[0], a[1]); gx.rotate(ang); gx.scale(sc, sc);
      gx.fillStyle = '#FBF3E4'; gx.strokeStyle = '#141c30'; gx.lineWidth = 2.6; gx.lineJoin = 'round'; gx.fill(PLANE); gx.stroke(PLANE);
      gx.fillStyle = '#E88B9C'; gx.fill(FOLD); gx.stroke(PLANE); gx.restore();
    }
  }
}

function placePins(){
  const R = G.cam.R, center = G.cam.c, F = G.flight;
  const items = GAMES_20.map((d, i) => {
    const p = proj([d.lon, d.lat]);
    const vis = p && d3.geoDistance(center, [d.lon, d.lat]) < Math.PI / 2 - .09;
    return { d, i, p, vis, show:vis && (!F || d === F.d) };
  });
  // cluster nearby pins (only when not flying)
  const used = new Set(); let ci = 0;
  clusterEls.forEach(c => { c.hidden = true; });
  if (!F){
    items.forEach(a => {
      if (!a.vis || used.has(a.i)) return;
      const grp = [a]; items.forEach(b => { if (b !== a && b.vis && !used.has(b.i) && Math.hypot(a.p[0] - b.p[0], a.p[1] - b.p[1]) < 52) grp.push(b); });
      if (grp.length > 1 && ci < clusterEls.length){
        grp.forEach(g => used.add(g.i));
        const mx = grp.reduce((s, g) => s + g.p[0], 0) / grp.length, my = grp.reduce((s, g) => s + g.p[1], 0) / grp.length;
        const el = clusterEls[ci++]; el.hidden = false;
        el.style.transform = `translate(${mx}px,${my}px) translate(-50%,-50%)`;
        el.querySelector('.head').textContent = grp.length;
        el.querySelector('.lab').textContent = grp.map(g => g.d.place).join(' · ');
        el.onclick = () => { const lon = grp.reduce((s, g) => s + g.d.lon, 0) / grp.length, lat = grp.reduce((s, g) => s + g.d.lat, 0) / grp.length; camTo(lon, lat, Math.min(G.R0 * 5.5, Math.max(R * 2.6, G.R0 * 3.4)), 900); };
        el.setAttribute('aria-label', `${grp.length} destinations : ${grp.map(g => g.d.place).join(', ')}. Zoomer.`);
      }
    });
  }
  items.forEach(a => {
    const el = pinEls[a.i];
    const show = a.show && !used.has(a.i);
    el.style.visibility = show ? 'visible' : 'hidden';
    if (a.p) el.style.transform = `translate(${a.p[0]}px,${a.p[1]}px) translate(-50%,-100%)`;
    el.classList.toggle('hot', !!F && a.d === F.d);
  });
  const hp = proj(HOME_C);
  const hv = hp && d3.geoDistance(center, HOME_C) < Math.PI / 2 - .09 && !(F && F.phase !== 'prep');
  homeEl.style.visibility = hv ? 'visible' : 'hidden';
  if (hp) homeEl.style.transform = `translate(${hp[0]}px,${hp[1]}px) translate(-50%,-50%)`;
}

function globeTick(now){
  const dt = Math.min(.05, (now - G.last) / 1000 || .016); G.last = now;
  const A = G.anim;
  if (A){
    const k = clamp((now - A.t0) / A.ms, 0, 1), e = easeIO(k);
    G.cam.c = A.it(e); G.cam.R = A.R0 + (A.R1 - A.R0) * e;
    if (k >= 1){ G.anim = null; if (A.cb) A.cb(); }
  } else if (!G.drag && !G.flight){
    if (Math.abs(G.vel[0]) > .01 || Math.abs(G.vel[1]) > .01){
      G.cam.c[0] += G.vel[0]; G.cam.c[1] = clamp(G.cam.c[1] + G.vel[1], -80, 80); G.vel[0] *= .94; G.vel[1] *= .94;
    } else if (!G.hot && !reduceMotion && !document.querySelector('.landing.show')){
      G.cam.c[0] += dt * 3;   // slow idle spin
    }
  }
  const F = G.flight;
  if (F && F.phase === 'fly'){
    const p = clamp((now - F.t0) / F.dur, 0, 1); F.p = p; F.e = easeIO(p); F.pos = F.it(F.e);
    G.cam.c = [...F.pos]; G.cam.R = G.R0 * (1.5 - .32 * Math.sin(Math.PI * p));
    if (p >= 1) landFlight();
  }
  drawGlobe(now); placePins();
}

    const dist = d3.geoDistance(HOME_C, [d.lon, d.lat]);
    G.flight.phase = 'fly'; G.flight.t0 = performance.now(); G.flight.dur = clamp(2300 + dist * 1500, 2800, 5200); G.flight.e = 0; G.flight.p = 0; G.flight.pos = HOME_C;

}

function weighted(entries){
  const tot = entries.reduce((s, e) => s + e[1], 0); let r = Math.random() * tot;
  for (const [k, w] of entries){ if ((r -= w) < 0) return k; }
  return entries[0][0];
}
function rollPrize(){
  const season = currentSeason();
  let r = S.pity >= 8 ? weighted([['holo', 3], ['or', 1]]) : weighted(Object.entries(RARITY).map(([k, v]) => [k, v.w]));
  let pool = PRIZES.filter(p => p.r === r && !p.free && (r !== 'saisonnier' || p.s === season));
  if (!pool.length){ r = 'commun'; pool = PRIZES.filter(p => p.r === 'commun' && !p.free); }
  S.pity = (r === 'holo' || r === 'or') ? 0 : S.pity + 1;
  return pool[Math.floor(Math.random() * pool.length)];
}

}
function welcome(){
  if (!S.welcomed){ S.welcomed = true; S.tokens += 6; S.lastDaily = today(); saveS(); updateTokens(true); setTimeout(() => toast('Bienvenue ! 6 jetons pour ta première boîte mystère.'), 900); }
  else if (S.lastDaily !== today()){ S.lastDaily = today(); S.tokens += 3; saveS(); updateTokens(true); setTimeout(() => toast('Cadeau du jour : +3 jetons !'), 900); }
}
addEventListener('pageshow', () => { S = loadS(); updateTokens(); applyEquipped(); });
addEventListener('storage', e => { if (e.key === KEY){ S = loadS(); updateTokens(true); } });

applyEquipped(); updateTokens(); goHome(); welcome();
requestAnimationFrame(loop);
</script>
