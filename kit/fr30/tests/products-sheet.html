<!doctype html><meta charset="utf-8"><body style="margin:0;background:#4a3f52;font:11px sans-serif;color:#fff">
<canvas id="c"></canvas>
<script src="../src/marche-data.js"></script><script src="../src/marche-art.js"></script>
<script>
const ids=Object.keys(PRODUCTS),cols=10,S=5,cw=16*S+16,ch=20*S+30;
const c=document.getElementById('c');c.width=cols*cw;c.height=Math.ceil(ids.length/cols)*ch;const g=c.getContext('2d');g.imageSmoothingEnabled=false;
ids.forEach((id,i)=>{const x=(i%cols)*cw+8,y=Math.floor(i/cols)*ch+6;
 g.fillStyle='rgba(0,0,0,.25)';g.fillRect(x-6,y-4,cw-4,ch-4);
 g.drawImage(SPR(id),x,y,16*S,20*S);g.fillStyle='#fff';g.font='10px sans-serif';g.fillText(id,x,y+20*S+12);});
</script>
