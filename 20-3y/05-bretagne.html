<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La semaine bretonne — Escale 5 : Bretagne</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@500;600;700&display=swap">
<style>
:root{
 color-scheme:light;
 --page:#E8EDF1;--paper:#FFFFFF;--ink:#1F2433;--muted:#5A6172;--line:#DDE3EA;--soft:#F2F5F8;
 --accent:#9B2F2F;--accent-deep:#6E1F1F;--teal:#2C5E67;--teal-deep:#1B3E45;--gold:#C9952F;--gold-soft:#F6E7C4;
 --ok-bg:#E1F2EA;--ok-fg:#1D6247;--err-bg:#FBE6E3;--err-fg:#8E2A22;--info-bg:#E6EEF5;--info-fg:#244B6B;
 --font-display:"Fraunces",Georgia,"Times New Roman",serif;
 --font-body:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
 --radius:14px;--shadow:0 1px 2px rgba(20,24,40,.08),0 8px 24px rgba(20,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left)) 48px}
.eyebrow{margin:0 0 4px;font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(28px,4.4vw,44px);line-height:1.05}
h2{margin:0 0 10px;font-family:var(--font-display);font-weight:600;font-size:22px;line-height:1.2}
.card{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:15px;transition:background .15s,transform .05s}
.btn:hover{background:var(--soft)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.accent,.btn.primary{color:#fff}
.btn.primary:hover{background:var(--teal-deep)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.accent:hover{background:var(--accent-deep)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:14px;font-weight:600}
.pill input{accent-color:var(--teal);width:16px;height:16px;margin:0}
.svgdefs{position:absolute;width:0;height:0;overflow:hidden}

/* character creator */
.creator{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:24px;padding:22px;align-items:start}
@media (max-width:720px){.creator{grid-template-columns:1fr}}
.creator .preview{background:linear-gradient(#AFC0D3,#E8D5C2 70%,#F4F6F8 70%);border-radius:12px;overflow:hidden}
.creator .preview svg{display:block;width:100%;height:auto}
.field{margin:0 0 16px;border:0;padding:0}
.field legend,.field label.lab{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.field input[type=text]{width:100%;max-width:340px;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;font-size:17px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices label{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 14px;border:1px solid var(--line);border-radius:999px;font-weight:600;font-size:15px;cursor:pointer;background:var(--paper)}
.choices input{position:absolute;opacity:0;pointer-events:none}
.choices label:has(input:checked){border-color:var(--teal);background:#E5F0F1;color:var(--teal-deep);box-shadow:inset 0 0 0 1px var(--teal)}
.choices label:has(input:focus-visible){outline:3px solid var(--teal);outline-offset:2px}
.swatch{width:40px;height:40px;padding:0!important;justify-content:center}
.swatch span{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}

header.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 24px;margin-bottom:18px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px}
a.pill{text-decoration:none;color:inherit}
.pill .count{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--gold-soft);color:#6B4A0E;font-size:12px}
.game{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:20px;align-items:start}
.mapgrid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.game,.mapgrid{grid-template-columns:1fr}}
.stage{overflow:hidden}
.stagebox{position:relative;container-type:inline-size}
.stagebox svg{display:block;width:100%;height:auto}
.overlay{position:absolute;inset:0;pointer-events:none}
.overlay>*{pointer-events:auto}
.sign{position:absolute;display:grid;place-items:center;font-family:var(--font-display);font-weight:600;color:#E9C77B;font-size:1.85cqw;letter-spacing:.03em;white-space:nowrap;pointer-events:none}
.stagecap{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;padding:10px 16px 14px;color:var(--muted);font-size:14px;font-weight:600}
.stagecap b{font-family:var(--font-display);font-size:19px;color:var(--ink)}
.stars{margin-left:auto;color:var(--gold);letter-spacing:2px;font-size:16px}
@media (prefers-reduced-motion:no-preference){.flake{animation:fall linear infinite}}
@keyframes fall{from{transform:translateY(-40px)}to{transform:translateY(580px)}}

/* map */
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:0;font-weight:700;font-size:max(10px,1.45cqw);color:var(--ink)}
.pin .dot{width:clamp(22px,3vw,34px);height:clamp(22px,3vw,34px);border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;background:#9AA3AE;box-shadow:0 3px 6px rgba(20,24,40,.3);border:2px solid #fff}
.pin .dot i{transform:rotate(45deg);font-style:normal;color:#fff;font-size:clamp(10px,1.3vw,14px)}
.pin .lbl{background:rgba(255,255,255,.92);border-radius:6px;padding:1px 7px;box-shadow:0 1px 3px rgba(20,24,40,.2);white-space:nowrap}
.pin.done .dot{background:var(--teal)}
.pin.next .dot{background:var(--accent)}
.pin.next{cursor:pointer}
@media (prefers-reduced-motion:no-preference){.pin.next .dot{animation:bob 1.4s ease-in-out infinite}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -5px}}
.pin:disabled{cursor:default}
.maplabel{position:absolute;font-family:var(--font-display);font-weight:600;color:#3A4A5E;font-size:2.2cqw;pointer-events:none;letter-spacing:.03em}
.maplabel.river{color:#E9F2F8;font-style:italic;transform:rotate(-14deg)}
.missions{padding:18px 20px}
.mlede{margin:0 0 12px;color:var(--muted)}
.missions ol{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:6px}
.missions li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;color:var(--muted);font-weight:600}
.missions li .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-size:14px}
.missions li small{display:block;font-weight:500;font-size:13px}
.missions li.next{background:#FBEDEA;color:var(--ink)}
.missions li.next .n{background:var(--accent);color:#fff}
.missions li.done{color:var(--ink)}
.missions li.done .n{background:var(--teal);color:#fff}
.missions li .st{color:var(--gold);letter-spacing:1px}

/* chat */
.chat{display:flex;flex-direction:column;overflow:hidden;min-width:0}
.chathead{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.chathead .face{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:none;background:#C9D6E3}
.chathead .face svg{display:block;width:100%;height:100%}
.chathead b{display:block;font-family:var(--font-display);font-size:19px;line-height:1.1}
.chathead span{font-size:13px;color:var(--muted);font-weight:600}
.log{padding:16px;display:flex;flex-direction:column;gap:12px;min-height:240px;max-height:440px;overflow-y:auto;scroll-behavior:smooth}
@media (max-width:900px){.log{max-height:48vh;min-height:180px}}
@media (prefers-reduced-motion:reduce){.log{scroll-behavior:auto}}
.row{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.row.npc{align-self:flex-start}
.row.me{align-self:flex-end;flex-direction:row-reverse}
.mini{width:32px;height:32px;border-radius:50%;overflow:hidden;flex:none;background:#C9D6E3}
.mini svg{display:block;width:100%;height:100%}
.bubble{padding:10px 14px;border-radius:14px;font-size:17px;line-height:1.4;min-width:0;overflow-wrap:anywhere}
.row.npc .bubble{background:var(--soft);border-bottom-left-radius:4px}
.row.me .bubble{background:var(--teal);color:#fff;border-bottom-right-radius:4px}
.bubble .who{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.bubble .en{display:none;margin-top:6px;font-size:14px;color:var(--muted);font-style:italic}
body.showEn .bubble .en,body.showEn .act .en{display:block}
.say{border:0;background:none;padding:2px;margin-left:4px;vertical-align:-4px;color:var(--muted);border-radius:6px}
.say svg{width:18px;height:18px;display:block}
.qc{border:0;background:none;padding:0;font:inherit;color:inherit;text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:2px;text-underline-offset:3px;cursor:help}
.qc:hover{background:var(--gold-soft)}
.culture{align-self:stretch;border:1px solid #E9D9B6;background:linear-gradient(#FFFBF1,#FBF3E1);border-radius:12px;padding:14px 16px}
.culture .k{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8A6416}
.culture h3{margin:2px 0 6px;font-family:var(--font-display);font-size:19px}
.culture p{margin:0;font-size:16px}
.culture .en{display:none;margin-top:8px;font-size:14px;color:var(--muted);font-style:italic}
body.showEn .culture .en{display:block}
.act{border-top:1px solid var(--line);padding:14px 16px 16px;background:#FAFBFC}
.act .prompt{margin:0 0 10px;font-weight:700}
.act .en{display:none;margin:-6px 0 10px;font-size:14px;color:var(--muted);font-style:italic}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:16px;font-weight:500;min-height:44px}
.opt:hover:not(:disabled){border-color:var(--teal);background:#F1F7F8}
.opt.wrong{border-color:#E3B2AB;background:var(--err-bg);color:var(--err-fg);text-decoration:line-through;text-decoration-thickness:1px}
.opt.right{border-color:#9CCDB6;background:var(--ok-bg);color:var(--ok-fg)}
.optrow{display:flex;flex-wrap:wrap;gap:8px}
.optrow .opt{min-width:84px;text-align:center;font-weight:700}
.sentence{font-size:18px;margin:0 0 12px;line-height:1.6}
.blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--teal);text-align:center;color:var(--teal);font-weight:700;padding:0 4px}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:15px}
.fb.err{background:var(--err-bg);color:var(--err-fg)}
.fb.ok{background:var(--ok-bg);color:var(--ok-fg);font-weight:600}
.fb .en{display:none;margin-top:4px;font-style:italic}
body.showEn .fb .en{display:block}
.cont{margin-top:4px}
table.board{width:100%;border-collapse:collapse;margin:0 0 12px;background:#1E2433;color:#F6E7C4;border-radius:8px;overflow:hidden;font-variant-numeric:tabular-nums}
table.board caption{caption-side:top;text-align:left;font-weight:700;margin-bottom:6px;color:var(--ink)}
table.board th,table.board td{padding:7px 10px;text-align:left;font-size:15px;border-bottom:1px solid #333B4F}
table.board th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#AEB7C7}
table.board td.gone{color:#E38A7E}
table.board td.ontime{color:#8FD3A8}
.clock{display:inline-block;background:#1E2433;color:#F6E7C4;padding:2px 10px;border-radius:6px;font-weight:700;font-variant-numeric:tabular-nums}
.orderBuilt{list-style:decimal;margin:0 0 10px;padding-left:22px;min-height:24px}
.orderBuilt li{padding:3px 0;color:var(--ok-fg);font-weight:600}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}

/* drawer, popover, toast */
.drawer{position:fixed;inset:0;background:rgba(20,24,40,.45);display:flex;justify-content:flex-end;z-index:20}
.drawer-in{width:min(440px,100%);height:100%;border-radius:0;overflow-y:auto;padding:20px}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.drawer h3{margin:18px 0 8px;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.clues{margin:0;padding-left:20px}.clues li{margin-bottom:6px}
.qclist{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px}
.qclist dt{font-weight:700}.qclist dd{margin:0;color:var(--muted)}
.pop{position:fixed;z-index:30;max-width:260px;background:#1F2433;color:#fff;padding:8px 12px;border-radius:10px;font-size:14px;box-shadow:var(--shadow)}
.pop b{color:#F2C46D}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:25;background:#1F2433;color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;box-shadow:var(--shadow)}

/* end */
.endcard{padding:28px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:640px){.endcard{grid-template-columns:1fr;text-align:center}.endcard .stampwrap{margin:0 auto}}
.stampwrap{width:200px;height:200px}
.stampwrap svg{width:100%;height:100%}
@media (prefers-reduced-motion:no-preference){.stampwrap.go{animation:stampIn .5s cubic-bezier(.3,1.6,.6,1)}}
@keyframes stampIn{from{transform:scale(2.2);opacity:0}to{transform:scale(1);opacity:1}}
.endcard p{color:var(--muted);font-size:17px}
.endcard .bigstars{font-size:32px;color:var(--gold);letter-spacing:4px}
.endbtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}

/* printable passport stamp */
#printArea{display:none}
.endbtns .btn{white-space:nowrap}
@media print{
 @page{size:landscape;margin:12mm}
 body>*:not(#printArea){display:none!important}
 #printArea{display:block!important}
 #printArea svg{width:100%;height:auto;display:block}
}

.hint{font-size:14px;color:var(--muted);margin-top:14px}

/* ===== newer step types ===== */
.muted{color:var(--muted);font-size:14px}
.row2{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.linkbtn{background:none;border:0;padding:0;color:var(--teal);text-decoration:underline;font:inherit;font-size:14px;cursor:pointer}
.doclink{margin:-4px 0 8px}
.doc{align-self:stretch;border:1px solid #C9D6E3;background:linear-gradient(#FBFDFF,#EEF4F9);border-radius:12px;padding:14px 16px}
.doc .k{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--info-fg)}
.doc h3{margin:2px 0 8px;font-family:var(--font-display);font-size:19px}
.doc ul{margin:0;padding-left:18px}.doc li{margin:3px 0;font-size:15.5px}
.doc .en{display:none;margin-top:8px;font-size:14px;color:var(--muted);font-style:italic}body.showEn .doc .en{display:block}
.tablewrap{overflow-x:auto}
table.doctable{margin:0;font-size:13px}table.doctable th,table.doctable td{font-size:13px;padding:6px 8px;white-space:nowrap}
table.doctable tbody th{color:#F2C46D;font-size:12px;letter-spacing:0;text-transform:none}
/* plan */
.plan{display:grid;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;align-items:center}
.chip{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:15px;min-height:42px;cursor:pointer}
.chip.sel{background:var(--teal);color:#fff;border-color:var(--teal);box-shadow:0 0 0 3px rgba(44,94,103,.2)}
.slots{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.slots li{display:grid;grid-template-columns:minmax(84px,auto) 1fr;gap:10px;align-items:center}
.slab{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);font-size:15px}
.slot{min-height:42px;border-radius:10px;border:1.5px dashed #C3CCD6;background:var(--soft);text-align:left;padding:8px 12px;font-size:15px;color:var(--muted);cursor:pointer}
.slot.ready{border-color:var(--teal);color:var(--teal);background:#EAF3F4}
.slot.full{border-style:solid;border-color:#BFD3D6;background:#fff;color:var(--ink);font-weight:600}
.slot.bad{border-color:#E3B2AB;background:var(--err-bg);color:var(--err-fg)}
/* tiles */
.built{min-height:52px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border-radius:10px;background:var(--soft);border:1px solid var(--line)}
.tilebank{display:flex;flex-wrap:wrap;gap:8px}
.tile{padding:8px 12px;border-radius:8px;border:1px solid #CBD3DC;background:#fff;font-size:16px;font-weight:600;min-height:42px;cursor:pointer;box-shadow:0 1px 0 #CBD3DC}
.tile:disabled{opacity:.25;cursor:default}
.tile.on{background:#EAF3F4;border-color:#9CC3C8}
/* pack */
.packgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.pack{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;text-align:left;font-size:15px;font-weight:500;min-height:46px;cursor:pointer}
.pack.on{background:#EAF3F4;border-color:var(--teal);font-weight:700}
.pack.on::before{content:"✓ ";color:var(--teal)}
/* numbers */
.numgrid{display:grid;gap:8px}
.numrow{display:grid;grid-template-columns:1fr 110px 40px;gap:10px;align-items:center;font-size:15.5px}
.numrow input{font:inherit;font-size:17px;padding:8px 10px;border-radius:8px;border:1px solid #C3CCD6;text-align:right;font-variant-numeric:tabular-nums}
.numrow input.bad{border-color:#D98A80;background:var(--err-bg)}.numrow input.good{border-color:#8CC7AA;background:var(--ok-bg)}
.numrow .unit{color:var(--muted);font-weight:600}
/* letter */
.lettergrid{display:grid;gap:12px}
.lsec{display:grid;gap:4px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#fff}
.lsec .lt{font-weight:700}.lsec .lp{font-size:14.5px;color:var(--muted)}.lsec .en{display:none;font-size:13.5px;font-style:italic;color:var(--muted)}body.showEn .lsec .en{display:block}
.lsec textarea{font:inherit;font-size:16px;line-height:1.5;padding:8px 10px;border-radius:8px;border:1px solid #C3CCD6;resize:vertical;min-height:84px}
.lsec.bad{border-color:#E3B2AB;background:#FFF8F7}.lsec.good{border-color:#9CCDB6;background:#F6FCF9}
.lerr{font-size:14px;color:var(--err-fg)}
.letter,.printLetter{align-self:stretch;background:#FFFDF7;border:1px solid #E9D9B6;border-radius:6px;padding:20px 22px;font-family:Georgia,serif;font-size:16.5px;line-height:1.6;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.letter p,.printLetter p{margin:0 0 10px}.lplace{text-align:right;font-style:italic}.lsign{font-weight:700}
@media print{ .printLetter{border:0;box-shadow:none;font-size:13pt;padding:0} }
@media (max-width:640px){ .numrow{grid-template-columns:1fr 90px 30px} }
/* comic arrange */
.caps{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:8px}
.caps li{display:grid;grid-template-columns:28px 1fr 120px;gap:10px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:#fff}
.capn{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#FFE98A;border:2px solid var(--ink);font-weight:700;font-size:13px}
.capt{font-size:15px;line-height:1.35}
.capslot{min-height:64px;padding:2px;display:grid;place-items:center;font-size:13px;text-align:center}
.capslot svg,.thumb svg{display:block;width:100%;height:auto}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:6px 0}
.thumb{padding:3px;border-radius:8px;border:2px solid var(--line);background:#fff;cursor:grab}
.thumb.sel{border-color:var(--teal);box-shadow:0 0 0 3px rgba(44,94,103,.25)}
.thumb:active{cursor:grabbing}
@media (max-width:640px){ .caps li{grid-template-columns:24px 1fr 90px} }

/* ===== Traveller profile, shared by the journey page and every game (same site => same storage). ===== */
const STORE_KEY='jeuxFr20.voyage';
const Store={
 get(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY))||null; }catch(e){ return Store._mem||null; } },
 set(p){ Store._mem=p; try{ localStorage.setItem(STORE_KEY, JSON.stringify(p)); }catch(e){} },
 clear(){ Store._mem=null; try{ localStorage.removeItem(STORE_KEY); }catch(e){} }
};
/* agreement helper: {m|f} picks the masculine or feminine form for the player */
function agree(p){ return p && (p.agree||(p.gender==='fille'?'f':'m')); }
function fmt(text,p){
 const a=agree(p);
 return String(text).replace(/\{([^{}|]*)\|([^{}]*)\}/g,(m,mm,ff)=>a==='f'?ff:mm).replace(/\[nom\]/g,(p&&p.name)||'Voyageur');
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    ${SKIN.map((s,i)=>opt('skin',i,`<span style="background:${s.m}"></span>`,p.skin===i,`class="swatch" title="${s.name}" aria-label="${s.name}"`)).join('')}</div></fieldset>

    ${HAIR.map((s,i)=>opt('hair',i,`<span style="background:${s.c}"></span>`,p.hair===i,`class="swatch" title="${s.name}" aria-label="${s.name}"`)).join('')}</div>
    <div class="choices" style="margin-top:8px">${opt('style','long','longs',p.style==='long')}${opt('style','mid','mi-longs',p.style==='mid')}${opt('style','short','courts',p.style==='short')}</div></fieldset>
   <button class="btn primary" type="submit">C'est moi! Allons-y</button>
   <p class="note err" hidden>Écris ton prénom pour continuer.</p>
  </div></form>`;
 const f=host.querySelector('form'), pv=host.querySelector('.pv');
 const read=()=>{
  const g=f.gender.value; p.gender=g; p.name=f.querySelector('#cr-name').value.trim();
  p.agree = g==='fille'?'f': g==='garcon'?'m': (f.agree.value||'m');
  p.skin=+f.skin.value; p.hair=+f.hair.value;
  p.style = f.style.value || (g==='fille'?'long':g==='garcon'?'short':'mid');
  f.querySelector('.agreeRow').hidden = g!=='nb';
  pv.innerHTML = person(Object.assign(playerLook(p),{x:0,y:0,noShadow:false}));
 };
 if(!p.style){ p.style = p.gender==='fille'?'long':p.gender==='garcon'?'short':'mid'; f.querySelector(`input[name=style][value=${p.style}]`).checked=true; }
 f.addEventListener('input', e=>{
  if(e.target.name==='gender'){ const d=e.target.value==='fille'?'long':e.target.value==='garcon'?'short':'mid'; f.querySelector(`input[name=style][value=${d}]`).checked=true; }
  read();
 });
 f.addEventListener('submit', e=>{ e.preventDefault(); read();
  if(!p.name){ f.querySelector('.err').hidden=false; f.querySelector('#cr-name').focus(); return; }
  p.name=p.name.charAt(0).toUpperCase()+p.name.slice(1);
  Store.set(p); onDone(p);
 });
 read();
}

function gwennHaDu(x,y,w){ /* Breton flag: nine stripes, ermine canton */
 const h=w*.6, sh=h/9; let g='';
 for(let i=0;i<9;i++) g+=`<rect x="${x}" y="${y+i*sh}" width="${w}" height="${sh+.3}" fill="${i%2?'#F4F4F0':'#1C1E24'}"/>`;
 const cw=w*.42, ch=sh*5;
 g+=`<rect x="${x}" y="${y}" width="${cw}" height="${ch}" fill="#F4F4F0"/>`;
 for(let r=0;r<3;r++) for(let c=0;c<(r%2?3:4);c++){ const ex=x+cw*(.14+c*.24+(r%2?.12:0)), ey=y+ch*(.2+r*.3); g+=`<path d="M${ex},${ey-3} L${ex+2},${ey+3} L${ex-2},${ey+3} Z" fill="#1C1E24"/><circle cx="${ex}" cy="${ey-3.5}" r="1" fill="#1C1E24"/>`; }
 return g+`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#hull)" opacity=".12"/>`;
}

/* ===== Jetons: shared reward hook for "Le grand voyage" (index.html) =====
   Every game page calls GVJetons.award(gameId, ratio) when a student finishes.
   ratio is 0–1 (score). Reward: 2–5 jetons by score, +5 the first time a game is finished.
   Saved in localStorage key 'gv.v1', which the picker page reads (same site = same storage). */
window.GVJetons = (function () {
  var KEY = 'gv.v1', BASE = 2, RANGE = 3, FIRST = 5, last = 0;
  function load() { try { return JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { return {}; } }
  function save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
  function home() { return location.pathname.replace(/\/(10|20)-3y\/[^\/]*$/, '/') || '../'; }
  function badge(n, first) {
    var d = document.createElement('div');
    d.setAttribute('role', 'status');
    d.style.cssText = 'position:fixed;left:50%;bottom:22px;z-index:99999;transform:translate(-50%,140%);transition:transform .6s cubic-bezier(.2,1.4,.4,1);' +
      'display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;border-radius:999px;background:#1F2A44;color:#FBF3E4;' +
      'box-shadow:0 10px 30px rgba(20,28,48,.35),0 0 0 3px #F2C14E;font:700 16px/1.2 "Baloo 2","Atkinson Hyperlegible",system-ui,sans-serif;';
    d.innerHTML = '<span style="display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#F2C14E;color:#1F2A44;font-size:18px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)">★</span>' +
      '<span>+' + n + ' jetons' + (first ? ' <small style="opacity:.8;font-weight:600">(dont +' + FIRST + ' première fois)</small>' : '') + '</span>' +
      '<a href="' + home() + '" style="margin-left:4px;padding:7px 14px;border-radius:999px;background:#E88B9C;color:#1F2A44;text-decoration:none;font-weight:800">Boîte mystère →</a>' +
      '<button aria-label="Fermer" style="border:0;background:none;color:#FBF3E4;font-size:20px;cursor:pointer;padding:0 4px">×</button>';
    d.querySelector('button').onclick = function () { d.style.transform = 'translate(-50%,160%)'; setTimeout(function () { d.remove(); }, 600); };
    document.body.appendChild(d);
    requestAnimationFrame(function () { requestAnimationFrame(function () { d.style.transform = 'translate(-50%,0)'; }); });
  }
  function award(gameId, ratio) {
    var now = Date.now();
    if (now - last < 8000) return 0;          // ignore a double call from the same finish
    last = now;
    ratio = Math.max(0, Math.min(1, +ratio || 0));
    var s = load(), played = s.played || {}, g = played[gameId] || { n: 0, best: 0 };
    var first = g.n === 0, n = BASE + Math.round(RANGE * ratio) + (first ? FIRST : 0);
    g.n += 1; g.best = Math.max(g.best, ratio); played[gameId] = g;
    s.played = played; s.tokens = (s.tokens || 0) + n;
    s.gain = { n: n, game: gameId, at: now };   // the picker shows this when the student returns
    save(s);
    try { badge(n, first); } catch (e) {}
    return n;
  }
  return { award: award };
})();

let VOICE=null;
function pickVoice(){ if(!('speechSynthesis' in window)) return; const v=speechSynthesis.getVoices();
 // Only a real French voice is ever used. Without one, Chrome reads French with an English voice, so reading is switched off instead.
 const fr=v.filter(x=>/^fr/i.test(x.lang));
 VOICE=fr.find(x=>/^fr[-_]CA/i.test(x.lang))||fr.find(x=>/^fr[-_]FR/i.test(x.lang))||fr[0]||null; }
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }

 if(!VOICE){ if(!noVoiceWarned){ noVoiceWarned=true; toast('Aucune voix française sur cet appareil : la lecture est désactivée.'); } return; }
 speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(plain(text));
 u.lang=VOICE.lang; u.voice=VOICE; u.rate=.92; u.pitch=(NPC[who]&&NPC[who].pitch)||1;
 speechSynthesis.speak(u);

  const placeAt=(id,k)=>{ const old=cs.placed.indexOf(id); if(old>-1) cs.placed[old]=null; cs.placed[k]=id; sel=null; act.querySelector('.fb')?.remove(); save(); render(); };
  const render=()=>{
   thumbs.innerHTML=''; all.forEach(p=>{ if(cs.placed.includes(p.id)) return; const b=document.createElement('button'); b.type='button'; b.className='thumb'+(sel===p.id?' sel':''); b.draggable=true; b.innerHTML=thumbSVG(p); b.setAttribute('aria-label','Image : '+fmt(p.alt||p.caption,P)); b.setAttribute('aria-pressed',sel===p.id);
    b.addEventListener('click',()=>{ sel=sel===p.id?null:p.id; render(); });
    b.addEventListener('dragstart',e=>{ e.dataTransfer.setData('text/plain',p.id); sel=p.id; }); thumbs.appendChild(b); });
   act.querySelectorAll('.capslot').forEach(b=>{ const k=+b.dataset.k, id=cs.placed[k], p=all.find(q=>q.id===id); b.classList.toggle('full',!!p); b.classList.toggle('ready',!p&&!!sel); b.innerHTML=p?thumbSVG(p):(sel?'Placer ici':'Case vide'); });
   renderComic();
  };
  act.querySelectorAll('.capslot').forEach(b=>{ const k=+b.dataset.k;
   b.addEventListener('click',()=>{ if(sel) placeAt(sel,k); else if(cs.placed[k]){ cs.placed[k]=null; save(); render(); } });
   b.addEventListener('dragover',e=>e.preventDefault()); b.addEventListener('drop',e=>{ e.preventDefault(); placeAt(e.dataTransfer.getData('text/plain'),k); }); });
  const svg=$('#stageSvg');
  const frameAt=e=>{ const r=svg.getBoundingClientRect(), x=(e.clientX-r.left)*960/r.width, y=(e.clientY-r.top)*540/r.height; return FRAMES.findIndex(([fx,fy])=>x>=fx&&x<=fx+FW&&y>=fy&&y<=fy+FH); };
  svg.ondragover=e=>e.preventDefault();
  svg.ondrop=e=>{ e.preventDefault(); const k=frameAt(e); if(k>-1) placeAt(e.dataTransfer.getData('text/plain'),k); };
  svg.onclick=e=>{ if(stop.page&&sel&&!cs.done){ const k=frameAt(e); if(k>-1) placeAt(sel,k); } };
  render();
  act.querySelector('.check').addEventListener('click',()=>{
   if(cs.placed.some(x=>!x)){ feedback('err','Remplis les quatre cases avant de vérifier.','Fill all four frames first.'); return; }
   const badK=cs.placed.map((id,k)=>id===pg.panels[k].id?-1:k).filter(k=>k>-1);
   act.querySelectorAll('.capslot').forEach((b,k)=>b.classList.toggle('bad',badK.includes(k)));
   if(badK.length){ wrong(); const k=badK[0], id=cs.placed[k], p=all.find(q=>q.id===id);
    feedback('err',`Case ${k+1} : ${p.decoy?p.why:(pg.panels[k].why||'Relis la légende : qui fait quoi?')}`+(badK.length>1?` (Encore ${badK.length-1} autre${badK.length>2?'s':''} à revoir.)`:''),p.decoy?p.whyEn:pg.panels[k].whyEn); return; }
   cs.done=true; save(); svg.ondrop=svg.onclick=null; renderComic();
   act.querySelectorAll('button').forEach(b=>b.disabled=true); feedback('ok',s.done||'Bravo! La planche est dans le bon ordre.'); setTimeout(next,1100);
  });
 }
 else if(s.t==='clue'){
  if(!PR.clues.includes(s.text)) PR.clues.push(s.text); save(); updateCount();
  toast('Nouvel indice dans ton carnet'); next();
 }
}
function finishStop(){
 const i=PR.cur, st=starsFor(mistakes);
 if(stop.id!=='intro'){ PR.stars[stop.id]=Math.max(PR.stars[stop.id]||0,st); $('#stopStars').textContent='★'.repeat(st); }
 if(PR.i<=i) PR.i=i+1; save();
 const last=i===ALL.length-1;
 contBtn(last?'Terminer l\'escale':'Retour à la carte', ()=> last?endScreen():renderMap());
 if(stop.id!=='intro') feedback('ok', `Escale réussie! ${'★'.repeat(st)}${'☆'.repeat(3-st)}`);
}

/* ---------- end ---------- */
function endScreen(){
 show('scrEnd');
 const vals=STOPS.map(s=>PR.stars[s.id]||1), avg=Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
 window.GVJetons && GVJetons.award('fr20-'+GAME.id, avg/3);
 const d=new Date(), date=d.toLocaleDateString('fr-CA',{day:'numeric',month:'short',year:'numeric'});
 P.done=P.done||{}; if(!P.done[GAME.id]) P.done[GAME.id]=date; P.stars=P.stars||{}; P.stars[GAME.id]=Math.max(P.stars[GAME.id]||0,avg); save();
 const me=JOURNEY.find(j=>j.id===GAME.id), nx=nextStop(P);
 $('#scrEnd').innerHTML=`<div class="card endcard"><div class="stampwrap go">${stampSVG(me,'done',String(P.done[GAME.id]).toUpperCase())}</div>
  <div><p class="eyebrow">Escale réussie</p><h1>${esc(fmt('Bravo, [nom]!',P))}</h1>
  <p>${esc(fmt(GAME.endText,P))}</p>
  <div class="bigstars" aria-label="${avg} étoiles sur 3">${'★'.repeat(avg)}${'☆'.repeat(3-avg)}</div>
  <p>Prochaine escale : <b>${nx?nx.place+' — '+nx.sub:'retour à Calgary'}</b>${nx&&!nx.ready?' (bientôt disponible)':''}</p>
  <div class="endbtns"><button class="btn accent" type="button" id="dlStamp">Télécharger mon tampon (PNG)</button><button class="btn" type="button" id="printStamp">Imprimer mon tampon</button>${GAME.endDownload?`<button class="btn" type="button" id="dlExtra">${esc(GAME.endDownload.label)}</button>`:''}<button class="btn" type="button" id="replay">Rejouer l'escale</button></div>
  <p class="hint">Ton tampon est ton preuve de réussite : enregistre-le et téléverse-le dans Teams, ou imprime-le.</p></div></div>`;
 $('#replay').addEventListener('click',()=>{ PR={i:0,stars:{},clues:[],qc:PR.qc,cur:0}; save(); runStop(0); });
 $('#dlStamp').addEventListener('click',()=>downloadStamp(me,avg));
 $('#printStamp').addEventListener('click',()=>printStamp(me,avg));
 if(GAME.endDownload) $('#dlExtra').addEventListener('click',()=>FINALES[GAME.endDownload.finale].download(P,PR));
}

/* ---------- printable passport stamp ---------- */
function stampCard(me,avg){
 const date=String(P.done[GAME.id]||'');
 const stars='★'.repeat(avg)+'☆'.repeat(3-avg);
 return `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
  <rect x="6" y="6" width="788" height="508" rx="22" fill="#FFF9EE" stroke="${me.color}" stroke-width="4"/>
  <rect x="20" y="20" width="760" height="480" rx="14" fill="none" stroke="${me.color}" stroke-width="1.5" stroke-dasharray="6 6"/>
  <svg x="50" y="90" width="300" height="300" viewBox="-60 -60 120 120">${stampSVG(me,'done',date.toUpperCase()).replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'')}</svg>
  <text x="390" y="100" font-family="Inter,Arial,sans-serif" font-weight="700" font-size="15" letter-spacing="2" fill="#6B6F7A">PASSEPORT · LE GRAND VOYAGE</text>
  <text x="390" y="180" font-family="Fraunces,Georgia,serif" font-weight="700" font-size="50" fill="#2B2D42">${esc(P.name)}</text>
  <text x="390" y="228" font-family="Inter,Arial,sans-serif" font-weight="600" font-size="22" fill="#2B2D42">${esc(me.place)} — ${esc(me.sub)}</text>
  <text x="390" y="262" font-family="Fraunces,Georgia,serif" font-style="italic" font-size="19" fill="#6B6F7A">${esc(GAME.title)}</text>
  <text x="390" y="302" font-family="Inter,Arial,sans-serif" font-weight="600" font-size="19" fill="#2B2D42">Visité le ${esc(date)}</text>
  <text x="390" y="352" font-family="Arial,sans-serif" font-size="36" fill="#E9A93A" letter-spacing="4">${stars}</text>
  <text x="390" y="416" font-family="Inter,Arial,sans-serif" font-size="16" fill="#6B6F7A">Escale réussie.</text>
  <text x="390" y="440" font-family="Inter,Arial,sans-serif" font-size="16" fill="#6B6F7A">Présente ce tampon à ton enseignant·e.</text>
 </svg>`;
}
function stampFileName(){ return 'passeport-'+P.name.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+GAME.id+'.png'; }
function downloadStamp(me,avg){
 const svg=stampCard(me,avg), url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
 const img=new Image();
 const save=(href,name)=>{ const a=document.createElement('a'); a.href=href; a.download=name; document.body.appendChild(a); a.click(); a.remove(); };
 img.onload=()=>{ const c=document.createElement('canvas'); c.width=1600; c.height=1040; const x=c.getContext('2d'); x.fillStyle='#FFFFFF'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
   c.toBlob(b=>{ save(URL.createObjectURL(b), stampFileName()); URL.revokeObjectURL(url); },'image/png'); };
 img.onerror=()=>{ save(url, stampFileName().replace(/\.png$/,'.svg')); };
 img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function printStamp(me,avg){
 $('#printArea').innerHTML=stampCard(me,avg);
 window.print();
}

/* ---------- carnet ---------- */
function openCarnet(){
 $('#clueList').innerHTML=PR.clues.length?PR.clues.map(c=>`<li>${esc(c)}</li>`).join(''):'<li style="list-style:none;color:var(--muted)">Pas encore d\'indice.</li>';
 const q=Object.values(PR.qc); $('#qcList').innerHTML=q.length?q.map(([w,s,e])=>`<dt>${esc(w)}</dt><dd>${esc(s)} · <i>${esc(e)}</i></dd>`).join(''):'<dd style="grid-column:1/-1">Pas encore d\'expression.</dd>';
 $('#carnet').hidden=false; $('#closeCarnet').focus();
}
$('#btnCarnet').addEventListener('click',openCarnet);
$('#closeCarnet').addEventListener('click',()=>{ $('#carnet').hidden=true; $('#btnCarnet').focus(); });
$('#carnet').addEventListener('click',e=>{ if(e.target.id==='carnet') $('#carnet').hidden=true; });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ $('#carnet').hidden=true; $('#pop').hidden=true; } });
$('#optEn').addEventListener('change',e=>{ document.body.classList.toggle('showEn',e.target.checked); try{localStorage.setItem('jeuxFr20.en',e.target.checked?'1':'0');}catch(_){} });
$('#optVoice').addEventListener('change',e=>{ if(!e.target.checked&&'speechSynthesis' in window) speechSynthesis.cancel(); try{localStorage.setItem('jeuxFr20.voice',e.target.checked?'1':'0');}catch(_){} });
try{ if(localStorage.getItem('jeuxFr20.en')==='1'){ $('#optEn').checked=true; document.body.classList.add('showEn'); } if(localStorage.getItem('jeuxFr20.voice')==='0') $('#optVoice').checked=false; }catch(_){}

/* ---------- start ---------- */
$('#eyebrow').textContent=GAME.eyebrow; $('#title').textContent=GAME.title;
ensureProfile(()=>{
 P.prog=P.prog||{}; PR=P.prog[GAME.id]||{i:0,stars:{},clues:[],qc:{},cur:0};
 PR.qc=PR.qc||{}; PR.clues=PR.clues||[]; PR.stars=PR.stars||{};
 updateCount();
 if(PR.i===0) runStop(0);
 else if(PR.i>=ALL.length) endScreen();
 else renderMap();
});
window.__comic={page:(pg,cs)=>comicSVG(pg,cs),thumb:p=>thumbSVG(p)};
window.__game={runStop,renderMap,endScreen,get state(){return {P,PR,stepI,stop:stop&&stop.id,step:stop&&stop.steps[stepI]};}};
})();

</script>
