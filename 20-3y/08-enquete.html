<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>L'enquête — Escale 8 : Louisiane</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
 color-scheme:light;
 --page:#E8EDF1;--paper:#FFFFFF;--ink:#1F2433;--muted:#5A6172;--line:#DDE3EA;--soft:#F2F5F8;
 --accent:#9B2F2F;--accent-deep:#6E1F1F;--teal:#2C5E67;--teal-deep:#1B3E45;--gold:#C9952F;--gold-soft:#F6E7C4;
 --ok-bg:#E1F2EA;--ok-fg:#1D6247;--err-bg:#FBE6E3;--err-fg:#8E2A22;--info-bg:#E6EEF5;--info-fg:#244B6B;
 --font-display:"Fraunces",Georgia,"Times New Roman",serif;
 --font-body:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
 --radius:14px;--shadow:0 1px 2px rgba(20,24,40,.08),0 8px 24px rgba(20,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left)) 48px}
.eyebrow{margin:0 0 4px;font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(28px,4.4vw,44px);line-height:1.05}
h2{margin:0 0 10px;font-family:var(--font-display);font-weight:600;font-size:22px;line-height:1.2}
.card{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:15px;transition:background .15s,transform .05s}
.btn:hover{background:var(--soft)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.accent,.btn.primary{color:#fff}
.btn.primary:hover{background:var(--teal-deep)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.accent:hover{background:var(--accent-deep)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:14px;font-weight:600}
.pill input{accent-color:var(--teal);width:16px;height:16px;margin:0}
.svgdefs{position:absolute;width:0;height:0;overflow:hidden}

/* character creator */
.creator{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:24px;padding:22px;align-items:start}
@media (max-width:720px){.creator{grid-template-columns:1fr}}
.creator .preview{background:linear-gradient(#AFC0D3,#E8D5C2 70%,#F4F6F8 70%);border-radius:12px;overflow:hidden}
.creator .preview svg{display:block;width:100%;height:auto}
.field{margin:0 0 16px;border:0;padding:0}
.field legend,.field label.lab{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.field input[type=text]{width:100%;max-width:340px;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;font-size:17px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices label{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 14px;border:1px solid var(--line);border-radius:999px;font-weight:600;font-size:15px;cursor:pointer;background:var(--paper)}
.choices input{position:absolute;opacity:0;pointer-events:none}
.choices label:has(input:checked){border-color:var(--teal);background:#E5F0F1;color:var(--teal-deep);box-shadow:inset 0 0 0 1px var(--teal)}
.choices label:has(input:focus-visible){outline:3px solid var(--teal);outline-offset:2px}
.swatch{width:40px;height:40px;padding:0!important;justify-content:center}
.swatch span{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}

header.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 24px;margin-bottom:18px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px}
a.pill{text-decoration:none;color:inherit}
.pill .count{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--gold-soft);color:#6B4A0E;font-size:12px}
.game{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:20px;align-items:start}
.mapgrid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.game,.mapgrid{grid-template-columns:1fr}}
.stage{overflow:hidden}
.stagebox{position:relative;container-type:inline-size}
.stagebox svg{display:block;width:100%;height:auto}
.overlay{position:absolute;inset:0;pointer-events:none}
.overlay>*{pointer-events:auto}
.sign{position:absolute;display:grid;place-items:center;font-family:var(--font-display);font-weight:600;color:#E9C77B;font-size:1.85cqw;letter-spacing:.03em;white-space:nowrap;pointer-events:none}
.stagecap{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;padding:10px 16px 14px;color:var(--muted);font-size:14px;font-weight:600}
.stagecap b{font-family:var(--font-display);font-size:19px;color:var(--ink)}
.stars{margin-left:auto;color:var(--gold);letter-spacing:2px;font-size:16px}
@media (prefers-reduced-motion:no-preference){.flake{animation:fall linear infinite}}
@keyframes fall{from{transform:translateY(-40px)}to{transform:translateY(580px)}}

/* map */
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:0;font-weight:700;font-size:max(10px,1.45cqw);color:var(--ink)}
.pin .dot{width:clamp(22px,3vw,34px);height:clamp(22px,3vw,34px);border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;background:#9AA3AE;box-shadow:0 3px 6px rgba(20,24,40,.3);border:2px solid #fff}
.pin .dot i{transform:rotate(45deg);font-style:normal;color:#fff;font-size:clamp(10px,1.3vw,14px)}
.pin .lbl{background:rgba(255,255,255,.92);border-radius:6px;padding:1px 7px;box-shadow:0 1px 3px rgba(20,24,40,.2);white-space:nowrap}
.pin.done .dot{background:var(--teal)}
.pin.next .dot{background:var(--accent)}
.pin.next{cursor:pointer}
@media (prefers-reduced-motion:no-preference){.pin.next .dot{animation:bob 1.4s ease-in-out infinite}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -5px}}
.pin:disabled{cursor:default}
.maplabel{position:absolute;font-family:var(--font-display);font-weight:600;color:#3A4A5E;font-size:2.2cqw;pointer-events:none;letter-spacing:.03em}
.maplabel.river{color:#E9F2F8;font-style:italic;transform:rotate(-14deg)}
.missions{padding:18px 20px}
.mlede{margin:0 0 12px;color:var(--muted)}
.missions ol{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:6px}
.missions li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;color:var(--muted);font-weight:600}
.missions li .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-size:14px}
.missions li small{display:block;font-weight:500;font-size:13px}
.missions li.next{background:#FBEDEA;color:var(--ink)}
.missions li.next .n{background:var(--accent);color:#fff}
.missions li.done{color:var(--ink)}
.missions li.done .n{background:var(--teal);color:#fff}
.missions li .st{color:var(--gold);letter-spacing:1px}

/* chat */
.chat{display:flex;flex-direction:column;overflow:hidden;min-width:0}
.chathead{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.chathead .face{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:none;background:#C9D6E3}
.chathead .face svg{display:block;width:100%;height:100%}
.chathead b{display:block;font-family:var(--font-display);font-size:19px;line-height:1.1}
.chathead span{font-size:13px;color:var(--muted);font-weight:600}
.log{padding:16px;display:flex;flex-direction:column;gap:12px;min-height:240px;max-height:440px;overflow-y:auto;scroll-behavior:smooth}
@media (max-width:900px){.log{max-height:48vh;min-height:180px}}
@media (prefers-reduced-motion:reduce){.log{scroll-behavior:auto}}
.row{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.row.npc{align-self:flex-start}
.row.me{align-self:flex-end;flex-direction:row-reverse}
.mini{width:32px;height:32px;border-radius:50%;overflow:hidden;flex:none;background:#C9D6E3}
.mini svg{display:block;width:100%;height:100%}
.bubble{padding:10px 14px;border-radius:14px;font-size:17px;line-height:1.4;min-width:0;overflow-wrap:anywhere}
.row.npc .bubble{background:var(--soft);border-bottom-left-radius:4px}
.row.me .bubble{background:var(--teal);color:#fff;border-bottom-right-radius:4px}
.bubble .who{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.bubble .en{display:none;margin-top:6px;font-size:14px;color:var(--muted);font-style:italic}
body.showEn .bubble .en,body.showEn .act .en{display:block}
.say{border:0;background:none;padding:2px;margin-left:4px;vertical-align:-4px;color:var(--muted);border-radius:6px}
.say svg{width:18px;height:18px;display:block}
.qc{border:0;background:none;padding:0;font:inherit;color:inherit;text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:2px;text-underline-offset:3px;cursor:help}
.qc:hover{background:var(--gold-soft)}
.culture{align-self:stretch;border:1px solid #E9D9B6;background:linear-gradient(#FFFBF1,#FBF3E1);border-radius:12px;padding:14px 16px}
.culture .k{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8A6416}
.culture h3{margin:2px 0 6px;font-family:var(--font-display);font-size:19px}
.culture p{margin:0;font-size:16px}
.culture .en{display:none;margin-top:8px;font-size:14px;color:var(--muted);font-style:italic}
body.showEn .culture .en{display:block}
.act{border-top:1px solid var(--line);padding:14px 16px 16px;background:#FAFBFC}
.act .prompt{margin:0 0 10px;font-weight:700}
.act .en{display:none;margin:-6px 0 10px;font-size:14px;color:var(--muted);font-style:italic}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:16px;font-weight:500;min-height:44px}
.opt:hover:not(:disabled){border-color:var(--teal);background:#F1F7F8}
.opt.wrong{border-color:#E3B2AB;background:var(--err-bg);color:var(--err-fg);text-decoration:line-through;text-decoration-thickness:1px}
.opt.right{border-color:#9CCDB6;background:var(--ok-bg);color:var(--ok-fg)}
.optrow{display:flex;flex-wrap:wrap;gap:8px}
.optrow .opt{min-width:84px;text-align:center;font-weight:700}
.sentence{font-size:18px;margin:0 0 12px;line-height:1.6}
.blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--teal);text-align:center;color:var(--teal);font-weight:700;padding:0 4px}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:15px}
.fb.err{background:var(--err-bg);color:var(--err-fg)}
.fb.ok{background:var(--ok-bg);color:var(--ok-fg);font-weight:600}
.fb .en{display:none;margin-top:4px;font-style:italic}
body.showEn .fb .en{display:block}
.cont{margin-top:4px}
table.board{width:100%;border-collapse:collapse;margin:0 0 12px;background:#1E2433;color:#F6E7C4;border-radius:8px;overflow:hidden;font-variant-numeric:tabular-nums}
table.board caption{caption-side:top;text-align:left;font-weight:700;margin-bottom:6px;color:var(--ink)}
table.board th,table.board td{padding:7px 10px;text-align:left;font-size:15px;border-bottom:1px solid #333B4F}
table.board th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#AEB7C7}
table.board td.gone{color:#E38A7E}
table.board td.ontime{color:#8FD3A8}
.clock{display:inline-block;background:#1E2433;color:#F6E7C4;padding:2px 10px;border-radius:6px;font-weight:700;font-variant-numeric:tabular-nums}
.orderBuilt{list-style:decimal;margin:0 0 10px;padding-left:22px;min-height:24px}
.orderBuilt li{padding:3px 0;color:var(--ok-fg);font-weight:600}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}

/* drawer, popover, toast */
.drawer{position:fixed;inset:0;background:rgba(20,24,40,.45);display:flex;justify-content:flex-end;z-index:20}
.drawer-in{width:min(440px,100%);height:100%;border-radius:0;overflow-y:auto;padding:20px}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.drawer h3{margin:18px 0 8px;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.clues{margin:0;padding-left:20px}.clues li{margin-bottom:6px}
.qclist{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px}
.qclist dt{font-weight:700}.qclist dd{margin:0;color:var(--muted)}
.pop{position:fixed;z-index:30;max-width:260px;background:#1F2433;color:#fff;padding:8px 12px;border-radius:10px;font-size:14px;box-shadow:var(--shadow)}
.pop b{color:#F2C46D}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:25;background:#1F2433;color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;box-shadow:var(--shadow)}

/* end */
.endcard{padding:28px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:640px){.endcard{grid-template-columns:1fr;text-align:center}.endcard .stampwrap{margin:0 auto}}
.stampwrap{width:200px;height:200px}
.stampwrap svg{width:100%;height:100%}
@media (prefers-reduced-motion:no-preference){.stampwrap.go{animation:stampIn .5s cubic-bezier(.3,1.6,.6,1)}}
@keyframes stampIn{from{transform:scale(2.2);opacity:0}to{transform:scale(1);opacity:1}}
.endcard p{color:var(--muted);font-size:17px}
.endcard .bigstars{font-size:32px;color:var(--gold);letter-spacing:4px}
.endbtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}

/* printable passport stamp */
#printArea{display:none}
.endbtns .btn{white-space:nowrap}
@media print{
 @page{size:landscape;margin:12mm}
 body>*:not(#printArea){display:none!important}
 #printArea{display:block!important}
 #printArea svg{width:100%;height:auto;display:block}
}

.hint{font-size:14px;color:var(--muted);margin-top:14px}

/* ===== newer step types ===== */
.muted{color:var(--muted);font-size:14px}
.row2{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.linkbtn{background:none;border:0;padding:0;color:var(--teal);text-decoration:underline;font:inherit;font-size:14px;cursor:pointer}
.doclink{margin:-4px 0 8px}
.doc{align-self:stretch;border:1px solid #C9D6E3;background:linear-gradient(#FBFDFF,#EEF4F9);border-radius:12px;padding:14px 16px}
.doc .k{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--info-fg)}
.doc h3{margin:2px 0 8px;font-family:var(--font-display);font-size:19px}
.doc ul{margin:0;padding-left:18px}.doc li{margin:3px 0;font-size:15.5px}
.doc .en{display:none;margin-top:8px;font-size:14px;color:var(--muted);font-style:italic}body.showEn .doc .en{display:block}
.tablewrap{overflow-x:auto}
table.doctable{margin:0;font-size:13px}table.doctable th,table.doctable td{font-size:13px;padding:6px 8px;white-space:nowrap}
table.doctable tbody th{color:#F2C46D;font-size:12px;letter-spacing:0;text-transform:none}
/* plan */
.plan{display:grid;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;align-items:center}
.chip{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:15px;min-height:42px;cursor:pointer}
.chip.sel{background:var(--teal);color:#fff;border-color:var(--teal);box-shadow:0 0 0 3px rgba(44,94,103,.2)}
.slots{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.slots li{display:grid;grid-template-columns:minmax(84px,auto) 1fr;gap:10px;align-items:center}
.slab{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);font-size:15px}
.slot{min-height:42px;border-radius:10px;border:1.5px dashed #C3CCD6;background:var(--soft);text-align:left;padding:8px 12px;font-size:15px;color:var(--muted);cursor:pointer}
.slot.ready{border-color:var(--teal);color:var(--teal);background:#EAF3F4}
.slot.full{border-style:solid;border-color:#BFD3D6;background:#fff;color:var(--ink);font-weight:600}
.slot.bad{border-color:#E3B2AB;background:var(--err-bg);color:var(--err-fg)}
/* tiles */
.built{min-height:52px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border-radius:10px;background:var(--soft);border:1px solid var(--line)}
.tilebank{display:flex;flex-wrap:wrap;gap:8px}
.tile{padding:8px 12px;border-radius:8px;border:1px solid #CBD3DC;background:#fff;font-size:16px;font-weight:600;min-height:42px;cursor:pointer;box-shadow:0 1px 0 #CBD3DC}
.tile:disabled{opacity:.25;cursor:default}
.tile.on{background:#EAF3F4;border-color:#9CC3C8}
/* pack */
.packgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.pack{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;text-align:left;font-size:15px;font-weight:500;min-height:46px;cursor:pointer}
.pack.on{background:#EAF3F4;border-color:var(--teal);font-weight:700}
.pack.on::before{content:"✓ ";color:var(--teal)}
/* numbers */
.numgrid{display:grid;gap:8px}
.numrow{display:grid;grid-template-columns:1fr 110px 40px;gap:10px;align-items:center;font-size:15.5px}
.numrow input{font:inherit;font-size:17px;padding:8px 10px;border-radius:8px;border:1px solid #C3CCD6;text-align:right;font-variant-numeric:tabular-nums}
.numrow input.bad{border-color:#D98A80;background:var(--err-bg)}.numrow input.good{border-color:#8CC7AA;background:var(--ok-bg)}
.numrow .unit{color:var(--muted);font-weight:600}
/* letter */
.lettergrid{display:grid;gap:12px}
.lsec{display:grid;gap:4px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#fff}
.lsec .lt{font-weight:700}.lsec .lp{font-size:14.5px;color:var(--muted)}.lsec .en{display:none;font-size:13.5px;font-style:italic;color:var(--muted)}body.showEn .lsec .en{display:block}
.lsec textarea{font:inherit;font-size:16px;line-height:1.5;padding:8px 10px;border-radius:8px;border:1px solid #C3CCD6;resize:vertical;min-height:84px}
.lsec.bad{border-color:#E3B2AB;background:#FFF8F7}.lsec.good{border-color:#9CCDB6;background:#F6FCF9}
.lerr{font-size:14px;color:var(--err-fg)}
.letter,.printLetter{align-self:stretch;background:#FFFDF7;border:1px solid #E9D9B6;border-radius:6px;padding:20px 22px;font-family:Georgia,serif;font-size:16.5px;line-height:1.6;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.letter p,.printLetter p{margin:0 0 10px}.lplace{text-align:right;font-style:italic}.lsign{font-weight:700}
@media print{ .printLetter{border:0;box-shadow:none;font-size:13pt;padding:0} }
@media (max-width:640px){ .numrow{grid-template-columns:1fr 90px 30px} }
/* comic arrange */
.caps{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:8px}
.caps li{display:grid;grid-template-columns:28px 1fr 120px;gap:10px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:#fff}
.capn{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#FFE98A;border:2px solid var(--ink);font-weight:700;font-size:13px}
.capt{font-size:15px;line-height:1.35}
.capslot{min-height:64px;padding:2px;display:grid;place-items:center;font-size:13px;text-align:center}
.capslot svg,.thumb svg{display:block;width:100%;height:auto}

function snowCap(x1,x2,yTop,peakX,peakY){ /* scalloped snow on a gable roof */
 const steps=7, w=(x2-x1)/steps; let p=`M${x1},${yTop} L${peakX},${peakY} L${x2},${yTop}`;
 for(let i=steps;i>0;i--){const a=x1+i*w, b=a-w; p+=` C${a-w*.3},${yTop+6} ${b+w*.3},${yTop+4} ${b},${yTop+(i%2?5:2)}`;}
 return `<path d="${p} Z" fill="url(#snowTop)"/>`;
}

  const wx= cols===1? cx-15 : x+w*.2+c*(w*.6-30)/(cols-1||1), wy=y+30+r*80;
  if(wy+46>y+h-10) continue;
  wins+=`<rect x="${wx}" y="${wy}" width="30" height="44" fill="url(#win)"/><path d="M${wx+15},${wy} V${wy+44} M${wx},${wy+22} H${wx+30}" stroke="#3A3226" stroke-width="2"/><rect x="${wx-2}" y="${wy-2}" width="34" height="48" fill="none" stroke="#EFE7DA" stroke-width="3"/><rect x="${wx-5}" y="${wy+45}" width="40" height="5" rx="1" fill="#F4F6F8"/>`

 }
 return `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#${wall})"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#blocks)"/>

 ${snowCap(x-6,x+w+6,y,cx,peak+5)}${wins}</g>`;
}

const STORE_KEY='jeuxFr20.voyage';

 set(p){ Store._mem=p; try{ localStorage.setItem(STORE_KEY, JSON.stringify(p)); }catch(e){} },

function agree(p){ return p && (p.agree||(p.gender==='fille'?'f':'m')); }

/* ===== Shared learning steps (games 5–8): doc, plan, tiles, pack, number, letter.
   STEPS.run(s, ctx) renders step s into ctx.act. ctx = {
     act: container element, P: profile, done(): step solved, wrong(): count a mistake,
     me(text): echo the student's answer, fb(kind, fr, en): feedback line, log(el): show a document or letter,
     store: object that keeps letter drafts, save(): persist store, toast(text), docLink(): html, onTilesOk(s): optional } ===== */
const STEPS=(()=>{
 const PRAISE=['Bravo!','Excellent!','Parfait!','Super!','Bien joué!','Exactement!'];
 const praise=()=>PRAISE[Math.floor(Math.random()*PRAISE.length)];
 function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
 function deaccent(s){ return s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’]/g,"'"); }
 function normTxt(s){ return deaccent(s.toLowerCase()).replace(/\s+([.,!?])/g,'$1').replace(/\s+/g,' ').trim(); }
 const PUNCT_FR={'.':'un point (.)','!':"un point d'exclamation (!)",'?':"un point d'interrogation (?)"};
 /* If the words match an accepted answer and only the final punctuation differs, return [fr, en] feedback; else null. */
 function punctMsg(txt,answers){
  const end=s=>{ const m=normTxt(s).match(/[.!?]+$/); return m?m[0].slice(-1):''; }, core=s=>normTxt(s).replace(/[.!?]+$/,'').trim();
  const mine=end(txt), c=core(txt), hit=answers.filter(a=>core(a)===c);
  if(!hit.length||hit.some(a=>end(a)===mine)) return null;
  const want=end(hit[0]);
  if(!mine) return want?[`Tes mots sont bons, mais il manque la ponctuation à la fin de la phrase : ajoute ${PUNCT_FR[want]}.`,`Your words are right, but the sentence needs its final punctuation: add ${want==='.'?'a period':want==='!'?'an exclamation mark':'a question mark'}.`]:null;
  if(!want) return ['Tes mots sont bons, mais cette phrase ne prend pas de ponctuation finale : enlève-la.','Your words are right, but this sentence takes no final punctuation: remove it.'];
  return [`Tes mots sont bons, mais change la ponctuation finale : cette phrase se termine par ${PUNCT_FR[want]}.`,`Your words are right, but change the final punctuation: this sentence ends with ${want==='.'?'a period':want==='!'?'an exclamation mark':'a question mark'}.`];
 }
 function joinTiles(a){ return a.reduce((acc,t)=>acc+(acc===''||acc.endsWith("'")||/^[.,!?]/.test(t)?'':' ')+t,''); }
 const promptHTML=(s,P)=>`<p class="prompt">${esc(fmt(s.prompt,P))}</p>${s.en?`<p class="en">${esc(fmt(s.en,P))}</p>`:''}`;
 function letterParts(s,ctx){ const P=ctx.P, d=new Date().toLocaleDateString('fr-CA',{day:'numeric',month:'long',year:'numeric'});
  return {place:fmt(s.place||'Calgary',P)+', le '+d, greet:fmt(s.greet,P), paras:s.sections.map(x=>(ctx.store[x.id]||'').trim()), close:fmt(s.close||'Amitiés,',P), name:P.name}; }
 function letterHTML(s,ctx){ const L=letterParts(s,ctx); return `${s.heading?`<p class="lhead">${esc(fmt(s.heading,ctx.P))}</p>`:''}<p class="lplace">${esc(L.place)}</p><p>${esc(L.greet)}</p>${L.paras.map(p=>`<p>${esc(p)}</p>`).join('')}<p>${esc(L.close)}</p><p class="lsign">${esc(L.name)}</p>`; }
 function letterText(s,ctx){ const L=letterParts(s,ctx); return [...(s.heading?[fmt(s.heading,ctx.P),'']:[]),L.place,'',L.greet,'',...L.paras.flatMap(p=>[p,'']),L.close,L.name].join('\n'); }
 /* check one written section: returns a list of messages (grammar errors first) */
 function checkSection(x,txt){ const n=deaccent(txt.toLowerCase()), gram=[], need=[];
  const words=(txt.match(/[A-Za-zÀ-ÿ'’-]+/g)||[]).length;
  (x.checks||[]).forEach(c=>{ const re=new RegExp(c.re,'g'); const m=n.match(re)||[]; if(c.not){ if(m.length) gram.push(c.msg); } else if(m.length<(c.count||1)) need.push(c.msg); });
  const errs=[...gram,...need]; if(words<(x.min||10)) errs.push(`Écris au moins ${x.min||10} mots (tu en as ${words}).`); return errs; }

 function run(s,ctx){
  const act=ctx.act, P=ctx.P, fb=ctx.fb, docLink=ctx.docLink||(()=>'');
  act.innerHTML='';
  if(s.t==='doc'){
   const c=document.createElement('div'); c.className='doc'; let body='';
   if(s.table) body+=`<div class="tablewrap"><table class="board doctable"><thead><tr>${s.table[0].map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${s.table.slice(1).map(r=>`<tr>${r.map((v,j)=>j?`<td>${esc(v)}</td>`:`<th scope="row">${esc(v)}</th>`).join('')}</tr>`).join('')}</tbody></table></div>`;
   if(s.lines) body+=`<ul>${s.lines.map(l=>`<li>${esc(fmt(l,P))}</li>`).join('')}</ul>`;
   c.innerHTML=`<span class="k">${esc(s.kind||'Document')}</span><h3>${esc(s.title)}</h3>${body}${s.en?`<p class="en">${esc(s.en)}</p>`:''}`;
   ctx.log(c); ctx.cont?ctx.cont('J\'ai lu',ctx.done):ctx.done();
  }
  else if(s.t==='plan'){
   const pos={}; let sel=null;
   act.innerHTML=promptHTML(s,P)+docLink()+`<div class="plan"><div class="chips" role="group" aria-label="${esc(s.itemsLabel||'À placer')}"></div><ol class="slots"></ol></div><div class="row2"><button class="btn primary check" type="button">Vérifier</button></div>`;
   const chips=act.querySelector('.chips'), slots=act.querySelector('.slots');
   const render=()=>{
    chips.innerHTML=''; s.items.forEach(it=>{ if(it.id in pos) return; const b=document.createElement('button'); b.type='button'; b.className='chip'+(sel===it.id?' sel':''); b.textContent=fmt(it.txt,P); b.setAttribute('aria-pressed',sel===it.id);
     b.addEventListener('click',()=>{ sel=sel===it.id?null:it.id; render(); }); chips.appendChild(b); });
    if(!chips.children.length) chips.innerHTML='<span class="muted">Tout est placé. Vérifie ton plan!</span>';
    slots.innerHTML=''; s.slots.forEach((lab,k)=>{ const id=Object.keys(pos).find(i=>pos[i]===k), it=s.items.find(x=>x.id===id);
     const li=document.createElement('li'); li.innerHTML=`<span class="slab">${esc(fmt(lab,P))}</span>`; const b=document.createElement('button'); b.type='button';
     b.className='slot'+(it?' full':'')+(sel&&!it?' ready':''); b.textContent=it?fmt(it.txt,P):(sel?'Placer ici':'—');
     b.setAttribute('aria-label',`${lab} : ${it?fmt(it.txt,P):'vide'}`);
     b.addEventListener('click',()=>{ if(sel){ if(it) delete pos[it.id]; pos[sel]=k; sel=null; } else if(it){ delete pos[it.id]; } act.querySelector('.fb')?.remove(); render(); });
     li.appendChild(b); slots.appendChild(li); });
   };
   render();
   act.querySelector('.check').addEventListener('click',()=>{
    const missing=s.items.filter(it=>!(it.id in pos)), bad=s.items.filter(it=>(it.id in pos)&&!it.ok.includes(pos[it.id]));
    slots.querySelectorAll('.slot').forEach(b=>b.classList.remove('bad'));
    if(missing.length){ fb('err','Place tout avant de vérifier.','Place everything before checking.'); return; }
    if(bad.length){ ctx.wrong(); bad.forEach(it=>slots.querySelectorAll('.slot')[pos[it.id]].classList.add('bad')); const it=bad[0]; fb('err',`${fmt(it.txt,P)} : ${it.why}`+(bad.length>1?` (Encore ${bad.length-1} autre${bad.length>2?'s':''} à revoir.)`:''),it.whyEn); return; }
    act.querySelectorAll('button').forEach(b=>b.disabled=true);
    ctx.me(s.say||s.slots.map((lab,k)=>{const id=Object.keys(pos).find(i=>pos[i]===k);return id?`${lab} : ${s.items.find(x=>x.id===id).txt}`:null;}).filter(Boolean).join(' · '));
    fb('ok',s.done||'Ton plan fonctionne!'); setTimeout(ctx.done,1100);
   });
  }
  else if(s.t==='tiles'){
   const built=[];
   act.innerHTML=promptHTML(s,P)+docLink()+`<p class="sentence built" aria-live="polite"><span class="muted">Touche les mots dans l'ordre.</span></p><div class="tilebank"></div><div class="row2"><button class="btn" type="button" data-a="clear">Effacer</button><button class="btn primary check" type="button">Vérifier</button></div>`;
   const bank=act.querySelector('.tilebank'), out=act.querySelector('.built');
   const tiles=shuffle(s.tiles.map((t,i)=>({t:fmt(t,P),i})));
   const render=()=>{
    bank.innerHTML=''; tiles.forEach(o=>{ const b=document.createElement('button'); b.type='button'; b.className='tile'; b.textContent=o.t; b.disabled=built.includes(o);
     b.addEventListener('click',()=>{ built.push(o); act.querySelector('.fb')?.remove(); render(); }); bank.appendChild(b); });
    out.innerHTML=built.length?'':'<span class="muted">Touche les mots dans l\'ordre.</span>';
    built.forEach((o,k)=>{ const b=document.createElement('button'); b.type='button'; b.className='tile on'; b.textContent=o.t; b.setAttribute('aria-label','Enlever '+o.t);
     b.addEventListener('click',()=>{ built.splice(k,1); render(); }); out.appendChild(b); });
   };
   render();
   act.querySelector('[data-a=clear]').addEventListener('click',()=>{ built.length=0; render(); });
   act.querySelector('.check').addEventListener('click',()=>{
    const txt=joinTiles(built.map(o=>o.t));
    const hit=(s.answers||[s.answer]).find(a=>normTxt(fmt(a,P))===normTxt(txt));
    if(hit!==undefined){ act.querySelectorAll('button').forEach(b=>b.disabled=true); ctx.me(txt); ctx.onTilesOk&&ctx.onTilesOk(s,txt,hit); fb('ok',s.okMsg||praise()); setTimeout(()=>ctx.done(txt,hit),850); return; }
    ctx.wrong(); const dg=s.diagnose&&s.diagnose(txt); const h=!dg&&built.map(o=>o.t).find(t=>s.hints&&s.hints[t]);
    if(dg){ fb('err',dg); return; }
    const pm=punctMsg(txt,(s.answers||[s.answer]).map(a=>fmt(a,P)));
    if(pm){ fb('err',pm[0],pm[1]); return; }
    fb('err',h?s.hints[h]:(built.length<(s.min||3)?'Ta phrase n\'est pas complète.':(s.why||'Pas tout à fait. Vérifie la forme du verbe et l\'ordre des mots.')),h?null:s.whyEn);
   });
  }
  else if(s.t==='pack'){
   const on=new Set();
   act.innerHTML=promptHTML(s,P)+docLink()+`<div class="packgrid"></div><div class="row2"><button class="btn primary check" type="button">Vérifier</button></div>`;
   const grid=act.querySelector('.packgrid');
   s.items.forEach((it,k)=>{ const b=document.createElement('button'); b.type='button'; b.className='pack'; b.textContent=fmt(it.txt,P); b.setAttribute('aria-pressed','false');
    b.addEventListener('click',()=>{ on.has(k)?on.delete(k):on.add(k); b.setAttribute('aria-pressed',on.has(k)); b.classList.toggle('on',on.has(k)); act.querySelector('.fb')?.remove(); }); grid.appendChild(b); });
   act.querySelector('.check').addEventListener('click',()=>{
    const extra=s.items.filter((it,k)=>!it.need&&on.has(k)), miss=s.items.filter((it,k)=>it.need&&!on.has(k));
    if(!extra.length&&!miss.length){ act.querySelectorAll('button').forEach(b=>b.disabled=true); ctx.me(s.say||s.items.filter(it=>it.need).map(it=>it.txt).join(', ')); fb('ok',s.done||'Parfait, tu as tout!'); setTimeout(ctx.done,1000); return; }
    ctx.wrong();
    if(extra.length) fb('err',`${fmt(extra[0].txt,P)} : ${extra[0].why}`,extra[0].whyEn);
    else fb('err',s.missing||'Il manque encore quelque chose. Relis le document.',s.missingEn);
   });
  }
  else if(s.t==='number'){
   act.innerHTML=promptHTML(s,P)+docLink()+`<div class="numgrid">${s.rows.map((r,k)=>`<label class="numrow"><span>${esc(fmt(r.label,P))}</span><input type="text" inputmode="decimal" autocomplete="off" data-k="${k}" aria-label="${esc(r.label)}"><span class="unit">${esc(r.unit||'')}</span></label>`).join('')}</div><div class="row2"><button class="btn primary check" type="button">Vérifier</button></div>`;

   ratio is 0–1 (score). Reward: 2–5 jetons by score, +5 the first time a game is finished.
   After 2 finishes of the same game in one day, each further finish gives 1 jeton.

   const body=()=>`<div class="slots">${G.inv.map(id=>`<button class="slot${id===pick?' on':''}" data-id="${id}" type="button" title="${esc(T(ITEMS[id].name))}"><svg viewBox="0 0 48 48">${ITEMS[id].icon}</svg><span>${esc(T(ITEMS[id].name))}</span></button>`).join('')||'<p>Vos poches sont vides. Comme votre agenda social.</p>'}</div>`;
   const btns=[['Regarder',async()=>{ if(!pick) return; closeDlg(); await say(ITEMS[pick].look,{icon:ITEMS[pick].icon}); openInv(); }],
    ['Utiliser',async()=>{ if(!pick) return; closeDlg(); const it=ITEMS[pick]; if(it.use) await it.use(API); else await say('Vous ne pouvez pas utiliser ça tout seul. Choisissez-le, puis cliquez sur quelque chose dans la pièce.'); }],

 function openNotes(){ const linkable=G.notes.some(n=>n.id);
   dialog('Carnet', G.notes.length?`${linkable?'<p class="small notehelp">Pour relier deux indices, cochez-les, puis « Relier ». Une bonne déduction devient un nouvel indice.</p>':''}<ol class="notes">${G.notes.map((n,i)=>`<li${n.link?' class="ded"':''}>${n.id?`<label class="nchk"><input type="checkbox" data-i="${i}" aria-label="Choisir cet indice"></label>`:''}<b>${rich(n.title)}</b><span>${rich(n.text)}</span></li>`).join('')}</ol>`:'<p>Votre carnet est vide. Pour l\'instant.</p>',
     [['Relier',()=>linkNotes()],['Lexique',()=>openLexique()],['Fermer',closeDlg]]); }
 async function linkNotes(){ const sel=[...$('#dlg').querySelectorAll('.nchk input:checked')].map(c=>G.notes[+c.dataset.i]);
   if(sel.length!==2){ toast('Cochez exactement deux indices.'); return; }
   const ids=sel.map(n=>n.id).sort(); const L=(CFG.links||[]).find(l=>l.pair.slice().sort().join('|')===ids.join('|'));
   closeDlg();
   if(!L){ G.linkTries=(G.linkTries||0)+1; return say('Vous relisez les deux indices. Ils ne disent rien ensemble. Pour l\'instant.'); }
   if(G.notes.some(n=>n.id===L.id)) return say('Vous avez déjà fait cette déduction. Elle est dans votre carnet.');
   G.notes.push({title:L.title,text:L.text,id:L.id,link:true}); score(L.points||5,'link_'+L.id);
   return say('**Déduction.** '+L.text); }
 /* lexique: word-level glossary only (French word → English word); never English sentences */
 function openLexique(){ const L=$('#lexique'), entries=Object.entries(CFG.glossary||{}).sort((a,b)=>a[0].localeCompare(b[0],'fr'));
   const row=([w,v])=>{ const [en,note]=Array.isArray(v)?v:[v]; return `<li data-w="${esc(STEPS.deaccent(w.toLowerCase()))}"><b>${esc(w)}</b><span>${esc(en)}</span>${note?`<i>${esc(note)}</i>`:''}</li>`; };
   L.innerHTML=`<div class="lexwin" role="dialog" aria-modal="true" aria-label="Lexique"><div class="lexhead"><h2>Lexique</h2><input type="search" id="lexQ" placeholder="Chercher un mot…" aria-label="Chercher un mot" autocomplete="off"><button class="btn" type="button" id="lexClose">Fermer</button></div>
     <p class="lexnote">Des mots, pas des phrases. Pour le reste, votre dictionnaire est votre meilleur{|e} coéquipi{er|ère}.</p><ul class="lexlist">${entries.map(row).join('')}</ul></div>`.replace('{|e}',T('{|e}')).replace('{er|ère}',T('{er|ère}'));
   L.hidden=false; setCursor(); const q=$('#lexQ'); q.focus();
   q.oninput=()=>{ const v=STEPS.deaccent(q.value.toLowerCase().trim()); L.querySelectorAll('.lexlist li').forEach(li=>li.hidden=!!v&&!li.dataset.w.includes(v)); };
   const close=()=>{ L.hidden=true; L.innerHTML=''; setCursor(); };
   $('#lexClose').onclick=close; L.onkeydown=e=>{ if(e.key==='Escape'){ e.stopPropagation(); close(); } }; }
 /* strip any English sentences from task data (teacher decision: words only, via the lexique and hover glosses) */
 function noEnglish(x){ if(Array.isArray(x)) return x.map(noEnglish); if(x&&typeof x==='object'){ const o={}; for(const k in x){ if(/^(en|whyEn|missingEn)$/.test(k)) continue; o[k]=noEnglish(x[k]); } return o; } return x; }
 function openOpts(){ const pr=prefs();
   dialog('Options', `<div class="optgrid">
    <button class="sbtn" type="button" data-o="save">Sauvegarder</button><button class="sbtn" type="button" data-o="restore">Restaurer</button>
    <button class="sbtn" type="button" data-o="hint">Demander de l'aide (−${CFG.hintCost||2} points)</button><button class="sbtn" type="button" data-o="restart">Recommencer</button></div>
    <label class="opt"><input type="checkbox" id="optZones" ${showZones?'checked':''}> Montrer les zones (gratuit)</label>
    <label class="opt"><input type="checkbox" id="optVoice" ${pr.voice?'checked':''}> Lire les textes à voix haute (voix française)</label>
    <p class="small">Changer d'action : touches 1 à 4 (1 Marcher, 2 Regarder, 3 Prendre / Utiliser, 4 Parler, 5 l'objet choisi), ou gardez le bouton de la souris enfoncé pour ouvrir la roue des actions. Tab pour passer d'une zone à l'autre, Entrée pour agir, Échap pour la barre d'icônes.</p>`,
   [['Reprendre',()=>{ applyOpts(); closeDlg(); }]]);
   $('#dlg').querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{ applyOpts(); const o=b.dataset.o;
     if(o==='save') openSave(); else if(o==='restore') openRestore(); else if(o==='hint'){ closeDlg(); hint(); }
     else if(o==='restart'){ dialog('Recommencer?','<p>Recommencer l\'enquête depuis le début? Vos sauvegardes sont conservées.</p>',[['Oui, recommencer',()=>{ closeDlg(); newGame(); }],['Non',openOpts]]); } }); }
 function applyOpts(){ const z=$('#optZones'); if(!z) return; showZones=z.checked; setPref('voice',$('#optVoice').checked); 
   if(!$('#optVoice').checked) hush(); drawZones(); }

 /* ---------- save / restore (several slots, plus an automatic save at each act) ---------- */
 const slotLabel=st=>`${T(ROOMS[st.roomId]?ROOMS[st.roomId].name:'')} · ${clockOf(st.clock)} · ${st.score} pts`;
 const clockOf=c=>`${Math.floor(c/60)%24} h ${String(c%60).padStart(2,'0')}`;
 const today=()=>new Date().toLocaleString('fr-CA',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
 function slotList(d,mode){ const rows=[]; if(mode==='restore'&&d.auto) rows.push(`<button class="srow" type="button" data-k="auto"><b>Sauvegarde automatique</b><span>${esc(d.auto.label)}</span><i>${esc(d.auto.when)}</i></button>`);
   for(let i=0;i<NSLOTS;i++){ const sl=(d.slots||[])[i]; if(mode==='restore'&&!sl) continue;
     rows.push(`<button class="srow" type="button" data-k="${i}"><b>Emplacement ${i+1}</b><span>${sl?esc(sl.label):'— vide —'}</span><i>${sl?esc(sl.when):''}</i></button>`); }
   return rows.join('')||'<p>Aucune partie sauvegardée.</p>'; }
 function openSave(){ const d=DB.get();
   dialog('Sauvegarder', `<div class="slist">${slotList(d,'save')}</div>`, [['Annuler',closeDlg]]);
   $('#dlg').querySelectorAll('.srow').forEach(b=>b.onclick=()=>{ const st=snap(), dd=DB.get(); dd.slots=dd.slots||[]; dd.slots[+b.dataset.k]={label:slotLabel(st),when:today(),state:st}; DB.set(dd);
     closeDlg(); say('Partie sauvegardée. Le capitaine, lui, ne sauvegarde jamais rien. C\'est pour ça qu\'il a l\'air si fatigué.'); }); }
 function openRestore(after){ const d=DB.get();
   dialog('Restaurer', `<div class="slist">${slotList(d,'restore')}</div>`, [['Annuler',()=>{ closeDlg(); }]]);
   $('#dlg').querySelectorAll('.srow').forEach(b=>b.onclick=()=>{ const dd=DB.get(), sl=b.dataset.k==='auto'?dd.auto:dd.slots[+b.dataset.k]; if(!sl) return;
     closeDlg(); hideTitle(); restore(sl.state); checkpoint=snap(); after&&after(); }); }
 function autosave(){ const st=snap(), d=DB.get(); d.auto={label:slotLabel(st),when:today(),state:st}; DB.set(d); }

 /* ---------- help from the team (costs points, never below zero) ---------- */
 async function hint(){ const h=CFG.hint?CFG.hint(G,API):null;
   if(!h) return say('Le capitaine hausse les épaules. « Vous êtes l\'enquêt{eur|rice} principal{|e}. Enquêtez. »');
   const cost=CFG.hintCost||2; G.score=Math.max(0,G.score-cost); G.hints=(G.hints||0)+1; updBar();
   return say(h.text,{who:h.who||'Agent Thibodeaux'}); }

 /* ---------- dossier: learning tasks (steps.js) in a manila folder over the scene ---------- */
 function task(steps,o={}){ steps=Array.isArray(steps)?steps:[steps]; hideBar(); hush();
   steps=noEnglish(steps);
   return new Promise(res=>{ const d=$('#dossier'); let i=0, mistakes=0;
    d.innerHTML=`<div class="folder" role="dialog" aria-modal="true" aria-label="${esc(T(o.title||'Dossier'))}">
      <div class="ftab">${esc(T(o.kind||'Dossier'))}</div>
      <div class="fhead"><h2>${esc(T(o.title||'Dossier'))}</h2><span class="fbtns"><button class="btn" type="button" id="dosLex">Lexique</button>${o.cancel?'<button class="btn" type="button" id="dosClose">Fermer le dossier</button>':''}</span></div>
      ${o.intro?`<p class="fintro">${rich(o.intro)}</p>`:''}
      <div class="fbody"><div class="dlog" aria-live="polite"></div><div class="act"></div></div></div>`;
    d.hidden=false; setCursor();
    const act=d.querySelector('.act'), log=d.querySelector('.dlog');
    if(o.docs) o.docs.forEach(x=>{ const c=document.createElement('div'); c.className='doc'; c.innerHTML=x; log.appendChild(c); });
    const close=(r)=>{ d.hidden=true; d.innerHTML=''; setCursor(); res(r); };
    if(o.cancel) d.querySelector('#dosClose').onclick=()=>close({cancelled:true,mistakes});
    d.querySelector('#dosLex').onclick=()=>openLexique();
    const answers=[];
    const ctx={ act, P:profile, store:(G.writing=G.writing||{}), save:()=>{}, toast, wrong:()=>{ mistakes++; },
     docLink:()=>'', log:el=>{ log.appendChild(el); el.scrollIntoView({block:'nearest'}); },
     me:t=>{ const p=document.createElement('p'); p.className='mine'; p.textContent=fmt(t,profile); log.appendChild(p); p.scrollIntoView({block:'nearest'}); },
     fb:(kind,fr)=>{ let f=act.querySelector('.fb'); if(!f){ f=document.createElement('div'); act.appendChild(f); } f.className='fb '+kind; f.innerHTML=esc(fmt(fr,profile)); },
     cont:(label,fn)=>{ act.innerHTML=''; const b=document.createElement('button'); b.className='btn primary cont'; b.type='button'; b.textContent=label||'Continuer'; b.onclick=fn; act.appendChild(b); b.focus({preventScroll:true}); },
     done:(txt,hit)=>{ answers.push({txt,hit}); i++; run(); } };
    const run=()=>{ const s=steps[i]; if(!s) return close({mistakes,answers});
      if(s.t==='say'){ const p=document.createElement('div'); p.className='dsay'; p.innerHTML=(s.who?`<b>${esc(T(s.who))}</b> `:'')+rich(s.text); log.appendChild(p); ctx.cont(s.btn||'Continuer',ctx.done); return; }
      if(s.t==='choose'){ act.innerHTML=`<p class="prompt">${esc(T(s.prompt))}</p><div class="opts"></div>`; const box=act.querySelector('.opts');
        STEPS.shuffle(s.opts).forEach(op=>{ const b=document.createElement('button'); b.type='button'; b.className='opt'; b.innerHTML=op.icon?`<svg viewBox="0 0 48 48">${op.icon}</svg><span>${esc(T(op.txt))}</span>`:esc(T(op.txt));
          b.onclick=()=>{ if(op.ok||s.any){ box.querySelectorAll('button').forEach(x=>x.disabled=true); b.classList.add('right'); ctx.me(op.txt); setTimeout(()=>ctx.done(op.txt,op),500); }
            else { b.classList.add('wrong'); b.disabled=true; mistakes++; ctx.fb('err',op.why||'Non. Relisez le dossier.'); } }; box.appendChild(b); }); return; }
      STEPS.run(s,ctx); };
    run(); }); }

 /* ---------- title screen and new game ---------- */

 function newGame(){ const keep={ }; Object.keys(G).forEach(k=>delete G[k]); Object.assign(G,JSON.parse(JSON.stringify(INIT)),keep); hideTitle(); enter(CFG.first); autosave(); }

 /* ---------- failure ---------- */
 function fail(o){ busy=true; const f=$('#fail'); hideBar(); if(walkDone){ player.path=[]; }
   f.innerHTML=`<div class="fbox" role="alertdialog" aria-modal="true">${o.art?`<div class="fart"><svg viewBox="0 0 200 120">${o.art}</svg></div>`:''}<div class="win"><p>${rich(o.text)}</p>${o.lesson?`<p class="lesson">${rich(o.lesson)}</p>`:''}
   <div class="wbtn"><button class="sbtn" id="btnRetry" type="button">Réessayer</button>${(DB.get().slots||[]).some(Boolean)?'<button class="sbtn" id="btnRestore" type="button">Restaurer</button>':''}</div></div></div>`;
   f.hidden=false; setCursor(); $('#btnRetry').focus();

   return new Promise(res=>{ $('#btnRetry').onclick=()=>{ f.hidden=true; restore(checkpoint); G.fails=fails; busy=false; setCursor(); res(); };
     const rb=$('#btnRestore'); if(rb) rb.onclick=()=>{ openRestore(()=>{ f.hidden=true; busy=false; setCursor(); res(); }); }; }); }
 const snap=()=>JSON.parse(JSON.stringify(Object.assign({},G,{px:player?player.x:G.px,py:player?player.y:G.py,face:player?player.face:G.face})));
 function restore(s){ Object.assign(G,JSON.parse(JSON.stringify(s))); enter(G.roomId,true); }

 /* ---------- rooms ---------- */
 function enter(id,restoring,entry){ room=ROOMS[id]; G.roomId=id;
   $('#bg').innerHTML=room.bg(G); $('#fg').innerHTML=room.fg?room.fg(G):''; $('#world').innerHTML='';
   props=(room.props||[]).filter(p=>!p.when||p.when(G)).map(p=>{ const g=document.createElementNS(NS,'g'); g.innerHTML=p.svg(G); return {g,base:p.base}; });
   npcs=(room.npcs||[]).filter(n=>!n.when||n.when(G)).map(n=>{ const a=mkActor(n.look,n.x,n.y,n.face,{size:n.size,block:n.block,dance:n.dance,sway:n.sway||14,off:n.off||0,x0:n.x}); return a; });
   const st=restoring?{x:G.px,y:G.py,face:G.face}:((entry&&room.entries&&room.entries[entry])||room.start);
   player=mkActor(Object.assign({},CFG.playerLook,G.wearing.gants?{glove:'#4E8FD9'}:{}),st.x,st.y,st.face); G.px=st.x; G.py=st.y;
   npcs.forEach(draw); draw(player); sortWorld(); focusIdx=-1; drawZones(); updBar();
   if(!restoring){ checkpoint=snap(); if(room.onEnter) room.onEnter(API); }
 }
 function fade(on){ const f=$('#fade'); f.classList.toggle('on',on); return new Promise(r=>setTimeout(r,on?260:20)); }
 async function go(id,entry,min){ busy=true; setCursor(); hush(); await fade(true); if(min) tickClock(min); enter(id,false,entry); await new Promise(r=>setTimeout(r,60)); await fade(false); busy=false; setCursor(); }
 /* Sierra-style conversation menu: choose what to say or ask; returns the chosen option */
 function menu(title,opts){ opts=opts.filter(o=>!o.when||o.when(G)); return new Promise(res=>{ hideBar();
   dialog(T(title), `<div class="mlist">${opts.map((o,i)=>`<button class="mrow" type="button" data-i="${i}">${rich(o.txt)}</button>`).join('')}</div>`, [['Rien',()=>{ closeDlg(); res(null); }]]);
   $('#dlg').querySelectorAll('.mrow').forEach(b=>b.onclick=()=>{ closeDlg(); res(opts[+b.dataset.i]); }); $('#dlg .mrow')&&$('#dlg .mrow').focus(); }); }
 /* full-screen cutscene: an animated SVG (1280x800) over the stage; resolves after ms */
 function cinema(svg,ms){ return new Promise(res=>{ const c=$('#cine'); hideBar(); c.innerHTML=`<svg viewBox="0 0 1280 800" preserveAspectRatio="xMidYMid slice">${svg}</svg>`; c.hidden=false; setCursor();
   setTimeout(()=>res(),ms); }); }
 function endCinema(){ const c=$('#cine'); c.hidden=true; c.innerHTML=''; setCursor(); }
 const API={ G, say, score, tickClock, walkTo, fail, enter, go, menu, cinema, endCinema, get profile(){return profile;}, get look(){return CFG.playerLook;}, get player(){return player;},
  give(id){ if(!G.inv.includes(id)) G.inv.push(id); updBar(); },
  drop(id){ G.inv=G.inv.filter(x=>x!==id); if(G.sel===id){ G.sel=null; if(G.verb==='item') G.verb='walk'; } updBar(); },
  has:id=>G.inv.includes(id), flag:(k,v)=>{ if(v===undefined) return G.flags[k]; G.flags[k]=v; },
  note(title,text,id){ if(id&&G.notes.some(n=>n.id===id)) return; G.notes.push({title,text,id}); },
  hasNote:id=>G.notes.some(n=>n.id===id),
  redraw(){ G.px=player.x; G.py=player.y; G.face=player.face; enter(G.roomId,true); },
  face(f){ player.face=f; draw(player); }, T, task, autosave, toast, speak,
  finalScore(){ return G.score; },
  rank(){ const r=API.finalScore()/(CFG.maxScore||300); const R=CFG.ranks||[]; let out=R[0]; R.forEach(x=>{ if(r>=x.min) out=x; }); return out?T(out.name):''; } };

 /* ---------- input ---------- */
 function toLogical(e){ const r=$('#stage').getBoundingClientRect(); return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]; }
 function bind(){ const st=$('#stage'), sc=$('#scene');
  st.addEventListener('pointermove',e=>{ const p=toLogical(e); ptr={x:p[0],y:p[1],in:true,onBar:!!e.target.closest('#bar')||p[1]<16};
    if(p[1]<16 && !anyModal()) showBar(); else if(p[1]>110 && !$('#bar').matches(':focus-within')) hideBar();
    hoverHs = (e.target.closest('#scene')) ? hsAt(p) : null; setCursor(); });
  st.addEventListener('pointerleave',()=>{ ptr.in=false; setCursor(); });
  let press=null;
  sc.addEventListener('pointerdown',e=>{ if(e.button!==0||anyModal()) return; const p=toLogical(e);
    press={p,x:e.clientX,y:e.clientY,t:setTimeout(()=>{ if(press&&!busy){ press.wheel=true; openWheel(p); } },420)}; });
  window.addEventListener('pointermove',e=>{ if(press&&!press.wheel&&Math.hypot(e.clientX-press.x,e.clientY-press.y)>10){ clearTimeout(press.t); } });
  window.addEventListener('pointerup',e=>{ if(!press) return; clearTimeout(press.t); const pr=press; press=null;
    if(pr.wheel){ const b=document.elementFromPoint(e.clientX,e.clientY); const v=b&&b.closest&&b.closest('.wv'); if(v){ closeWheel(); pickVerb(v.dataset.v); } return; }
    if(!anyModal()&&e.target.closest&&e.target.closest('#scene')) act(pr.p); });
  st.addEventListener('contextmenu',e=>{ e.preventDefault(); if(!anyModal()&&!busy) openWheel(toLogical(e)); });
  $('#wheel').addEventListener('pointerdown',e=>{ if(e.target.id==='wheel'){ closeWheel(); } });
  document.querySelectorAll('.vb').forEach(b=>b.addEventListener('click',()=>{ const v=b.dataset.verb, a=b.dataset.act;
    if(v) setVerb(v); else if(a==='inv') openInv(); else if(a==='note') openNotes(); else if(a==='opt') openOpts(); hideBar(); }));
  $('#bar').addEventListener('pointerleave',()=>{ if(!$('#bar').matches(':focus-within')) hideBar(); });
  document.addEventListener('keydown',e=>{ if(wheelOpen){ if(e.key==='Escape'){ e.preventDefault(); closeWheel(); } else if(/^[1-5]$/.test(e.key)){ closeWheel(); pickVerb(VERB_ORDER[+e.key-1]); } return; }
    if(/^[1-5]$/.test(e.key)&&!anyModal()&&!e.target.closest('input,textarea')){ e.preventDefault(); pickVerb(VERB_ORDER[+e.key-1]); return; }
    if(!$('#msg').hidden||!$('#fail').hidden||!$('#title').hidden||!$('#dossier').hidden||!$('#create').hidden||!$('#lexique').hidden) return;
    if(!$('#dlg').hidden){ if(e.key==='Escape') closeDlg(); return; }
    if(e.key==='Escape'){ e.preventDefault(); if($('#bar').classList.contains('down')){ hideBar(); document.activeElement.blur(); } else { showBar(); $('#bar .vb').focus(); } return; }
    if($('#bar').matches(':focus-within')) return;
    if(e.key==='Tab'){ e.preventDefault(); const l=hsList(); if(!l.length) return; focusIdx=(focusIdx+(e.shiftKey?-1:1)+l.length)%l.length; drawZones();
      const h=l[focusIdx]; const c=center(h); $('#kbTag').hidden=false; $('#kbTag').textContent=T(h.name); $('#kbTag').style.left=(c[0]/W*100)+'%'; $('#kbTag').style.top=(c[1]/H*100)+'%'; }
    else if(e.key==='Enter' && focusIdx>=0){ e.preventDefault(); const h=hsList()[focusIdx]; if(h) actOn(h, h.walkTo||center(h)); }
    else if(e.key==='Enter' && focusIdx<0){ e.preventDefault(); }
  });
 }

 let INIT=null;
 function start(cfg){ CFG=cfg; ROOMS=cfg.rooms; ITEMS=cfg.items; profile=cfg.profile; Object.assign(G,cfg.state||{}); INIT=JSON.parse(JSON.stringify(G));
   const tag=document.createElement('div'); tag.id='kbTag'; tag.hidden=true; $('#stage').appendChild(tag);
   bind(); requestAnimationFrame(tick);
   const go=()=>{ room=ROOMS[cfg.first]; enterQuiet(cfg.first); showTitle(); };
   if(!profile||!profile.name){ const c=$('#create'); c.hidden=false; mountCreator(c.querySelector('.cwrap'),p=>{ profile=p; CFG.playerLook=cfg.lookFor(p); c.hidden=true; go(); }); }
   else go(); }
 function enterQuiet(id){ const f=ROOMS[id].onEnter; ROOMS[id].onEnter=null; enter(id); ROOMS[id].onEnter=f; }
 /* test hooks (automated playthroughs) */
 const _hs=(id,verb,sel)=>{ G.verb=verb; if(sel){ G.sel=sel; G.verb='item'; } const h=hsList().find(x=>x.id===id); if(!h) return 'nohs:'+id; actOn(h,h.walkTo||center(h)); return 'ok'; };
 return { start, API, G, _task:task, _hs, _busy:()=>busy||anyModal(), _room:()=>G.roomId, _findPath:(a,b)=>findPath(a,b), _act:p=>act(p) };

  for(let i=0,x=-1000;x<2280;x+=cols,i++){ const p=[[X(x,ya),ya],[X(x+cols,ya),ya],[X(x+cols,yb),yb],[X(x,yb),yb]].map(v=>v[0].toFixed(1)+','+v[1]).join(' ');

/* ---------- 3. La cafétéria (Québec recall: partitifs) ---------- */
const FOODS=[['café','du'],['tarte aux noix de pécan','de la'],['beignets','des'],['boudin','du']];
function orderAnswers(){ const out=[]; const others=FOODS.slice(1);
 for(let i=0;i<others.length;i++) for(let j=0;j<others.length;j++){ if(i===j) continue;
  const a=others[i], b=others[j]; out.push(`Je voudrais du café, ${a[1]} ${a[0]} et ${b[1]} ${b[0]}, s'il vous plaît.`); } return out; }
function orderDiagnose(t){ const n=' '+t.toLowerCase()+' ';
 if(/ de le /.test(n)) return '« de » + « le » = « du ». On dit « du café », pas « de le café ».';
 if(/ (des|de la) café/.test(n)) return '« Café » est masculin singulier : du café.';
 if(/ (du|de la) beignets/.test(n)) return '« Beignets » est au pluriel : des beignets.';
 if(/ (du|des) tarte/.test(n)) return '« Tarte » est féminin : de la tarte.';
 if(/ (de la|des) boudin/.test(n)) return '« Boudin » est masculin : du boudin.';
 if(!/s'il vous plaît/.test(n)) return 'Mme Boudreaux attend une formule de politesse. Elle attend depuis 1987.';
 if(!/ du café/.test(n)) return 'Le café d\'abord. C\'est la loi du poste. Commencez par le café.';
 return null; }

async function CAR(A){
 if(!A.G.flags.photoPneus) return A.fail({ art:FAIL_ART.tires, text:'Vous reculez la voiture pour aller plus vite. Bravo. Les traces de pneus sont maintenant celles de la police de Lafayette.', lesson:'Procédure : il faut photographier les traces avant de bouger quoi que ce soit.' });

 if(o&&o.txt.startsWith('Oui')) return A.go('briefing','fromParking',12); }
async function HEBERT(A){ const w=who('hebert');
 if(A.G.flags.hebert) return A.say('Je vous ai tout dit, mon petit{|e}. La camionnette rouge, les écrevisses. Maintenant, mon feuilleton recommence.',{who:w});
 const o=await A.menu('Que dites-vous à Mme Hébert?',[ {txt:'Salut! Tu as vu quelque chose ce soir?'}, {txt:'Bonsoir, madame. Est-ce que vous avez vu quelque chose ce soir?'} ]);
 if(!o) return;
 if(o.txt.startsWith('Salut')){ await A.say('Salut? Tu? On ne tutoie pas une dame de mon âge, jeune homme ou jeune fille. Recommencez. Poliment.',{who:w}); return; }
 A.flag('hebert',true); A.score(3,'hebert'); A.tickClock(5);
 await A.say('Ah, bonsoir! J\'**étais en train de** regarder mon feuilleton quand une camionnette rouge **est partie** très vite. Vers 22 h 30, je pense.',{who:w});
 await A.say('Il y avait des autocollants dessus. Des [[écrevisses]], je crois. Elle a cogné la borne jaune. Ça a fait un bruit! J\'ai raté la fin de mon épisode.',{who:w});
 A.note('Témoin : Mme Hébert','Une camionnette rouge avec des autocollants d\'écrevisses est partie très vite vers 22 h 30. Elle a cogné la borne.'); }

/* ---------- the radio: the first recommendation (good → passé composé report; bad → negation report) ---------- */
const RECO_OFFICERS=[['Agent Thibodeaux, je vous recommande','vous'],['Agente Broussard, je te recommande','tu'],['Je recommande au sergent LeBlanc','au']];
const RECO_ACTIONS=[['de suivre les traces de boue','boue'],['de chercher la camionnette rouge dans les parkings','parkings'],['d\'interroger le collectionneur belge','collectionneur']];
function recoAnswers(){ const out=[]; RECO_OFFICERS.forEach(o=>RECO_ACTIONS.forEach(a=>out.push(`${o[0]} ${a[0]}.`))); return out; }
function recoDiagnose(t){ const n=' '+t.toLowerCase().replace(/\s+/g,' ')+' ';
 if(/thibodeaux/.test(n)&&/ te /.test(n)) return 'L\'agent Thibodeaux n\'est pas votre partenaire : on lui dit « vous ».';
 if(/broussard/.test(n)&&/ vous /.test(n)) return 'L\'agente Broussard est votre partenaire : on la tutoie (« je te recommande »).';
 if(/sergent/.test(n)&&/ (vous|te) /.test(n)) return 'Avec « au sergent LeBlanc », pas de pronom : « Je recommande au sergent LeBlanc de… ».';
 if(/ de interroger/.test(n)) return 'Devant une voyelle, « de » devient « d\' » : d\'interroger.';
 if(/ d' (suivre|chercher)/.test(n)) return 'Devant une consonne, on garde « de » : de suivre, de chercher.';
 if(/ recommande (suivre|chercher|interroger)/.test(n)) return 'Après « recommander », il faut « de » + infinitif.';
 if(/ à (suivre|chercher|interroger)/.test(n)) return 'On ne dit pas « recommander à faire » : on dit « recommander de faire ».';
 return null; }
async function RADIO(A){ const w=who('broussard'), cap=who('arceneaux');
 if(A.G.flags.recoBoue) return A.say('L\'équipe suit votre piste. Finissez au musée, puis rentrez au poste avec les preuves.',{who:w});
 if(!A.G.flags.arrived) return A.say('Le capitaine veut vous voir au musée d\'abord. Des recommandations sans scène de crime, c\'est de la poésie.',{who:w});
 const ev=[]; const G=A.G;
 if(G.scored.boue) ev.push({txt:'Les traces de boue : elles vont de la porte de service à la vitrine.',id:'boue'});
 if(G.flags.peinture||G.scored.borne) ev.push({txt:'La peinture rouge sur la borne du quai.',id:'peinture'});
 if(G.flags.hebert) ev.push({txt:'Mme Hébert a vu une camionnette rouge partir vers 22 h 30.',id:'hebert'});
 if(G.scored.bd||G.flags.labels) ev.push({txt:'La planche de BD a été déplacée.',id:'planche'});
 if(G.scored.vitrine) ev.push({txt:'Le couvercle de la vitrine n\'a pas été cassé.',id:'vitrine'});
 if(!ev.length) return A.say('Une recommandation? Il vous faut des preuves d\'abord, enquêt{eur|rice}. Regardez autour de vous.',{who:w});
 await A.say('Ici Broussard. On t\'écoute. Qui doit faire quoi?',{who:w});
 const r=await A.task([
  { t:'tiles', prompt:'Donnez une recommandation à un membre de l\'équipe. Choisissez la personne, l\'action et la cible.',
    tiles:['Agent Thibodeaux,','Agente Broussard,','Je recommande au sergent LeBlanc','je','vous','te','recommande','de','d\'','suivre','chercher','interroger','les traces de boue','la camionnette rouge dans les parkings','le collectionneur belge','.'],
    answers:recoAnswers(), diagnose:recoDiagnose, min:5 },
  { t:'choose', prompt:'Le capitaine demande : « Sur quelle base? » Choisissez la preuve qui appuie votre recommandation.', any:true, opts:ev }
 ],{ title:'Recommandation à l\'équipe', kind:'Dossier · Radio', cancel:true,
     intro:'Une bonne recommandation = la bonne personne (**tu** avec votre partenaire, **vous** avec un agent) + **recommander de** + infinitif + une preuve.' });
 if(r.cancelled) return A.say('« Prenez votre temps, enquêt{eur|rice}. Le voleur, lui, ne prend pas le sien. »',{who:cap});
 const sent=r.answers[0].txt, evid=r.answers[1].hit.id, act=RECO_ACTIONS.find(a=>sent.includes(a[0]))[1];
 const fits={boue:['boue'], parkings:['peinture','hebert'], collectionneur:['planche']}[act];
 if(!fits.includes(evid)) return A.say(`« Sur quelle base? » Le capitaine n'est pas convaincu : cette preuve ne justifie pas cette recommandation. ${act==='boue'?'Quelle preuve montre un chemin?':act==='parkings'?'Quelle preuve parle d\'un véhicule rouge?':'Quelle preuve parle du collectionneur?'}`,{who:cap});
 if(act==='boue'){
  A.flag('recoBoue',true); A.score(Math.max(2,6-r.mistakes),'reco1'); A.tickClock(20);
  await A.say('Vingt minutes plus tard, l\'agent Thibodeaux revient. Il a de la boue jusqu\'aux genoux et l\'air content de lui.');
  await A.say('Nous **avons suivi** les traces jusqu\'au quai. Nous **avons trouvé** un autocollant d\'[[écrevisse]] dans la boue. Mme Hébert **a vu** une camionnette rouge partir vers 22 h 30.',{who:who('thib')});
  A.note('Rapport de l\'agent Thibodeaux','Les traces vont jusqu\'au quai. Un autocollant d\'écrevisse dans la boue. Une camionnette rouge vers 22 h 30.');
  return; }
 if(act==='parkings'){ A.tickClock(90); A.flag('bad_parkings',true);
  await A.say('Une heure et demie plus tard, la radio grésille.');
  await A.say('Nous **n\'avons rien trouvé**. Nous **n\'avons vu aucune** camionnette rouge dans les parkings du centre-ville. **Personne n\'a** rien remarqué.',{who:who('broussard')});
  A.note('Écarté : les parkings du centre-ville','Aucune camionnette rouge dans les parkings du centre-ville. Personne n\'a rien remarqué.');
  return A.say('Le temps passe. Le capitaine soupire à la radio. Un long soupir, très professionnel.'); }
 A.tickClock(60); A.flag('bad_collect',true);
 await A.say('Une heure plus tard, le sergent LeBlanc vous rappelle.');
 await A.say('Le collectionneur **n\'est pas sorti** de l\'hôtel. Il **n\'a jamais visité** le musée ce soir. Le portier de l\'hôtel **ne l\'a pas vu** partir.',{who:who('leblanc')});
 A.note('Écarté (pour l\'instant) : le collectionneur','Il n\'est pas sorti de l\'hôtel ce soir. Il n\'a jamais visité le musée ce soir.');
 return A.say('Ce n\'est pas une piste. C\'est une piste en moins. Le capitaine appelle ça « éliminer ». Vous appelez ça « perdre une heure ».'); }

 A.G.flags.act2=true; A.redraw(); A.autosave();
 await A.say('Bon travail, enquêt{eur|rice}. Deux preuves enregistrées, un témoin, une déclaration, et une piste. Pour une troisième journée, c\'est presque inquiétant.',{who:w});

 await A.say('Quand vous aurez leurs déclarations, revenez ici. On fera la ligne du temps au tableau. Et prenez des notes : dans votre carnet, vous pouvez relier deux indices pour faire une déduction.',{who:w}); }

 if(!G.flags.interroDone){ await A.say('Cédric est dans la salle d\'interrogatoire, avec son avocat. Moi, je regarde derrière le miroir. Vous, vous posez les questions et vous montrez les preuves.',{who:w});

 if(!G.flags.report) return A.say('Le rapport, enquêt{eur|rice}. À votre bureau. Sans rapport, pas de mandat. Sans mandat, pas d\'arrestation. Sans arrestation, moi, à la télévision.',{who:w});

   checks:[ {re:"\\ba (alle|allee|parti|partie|venu|venue|arrive|arrivee|entre|entree|sorti|sortie|monte|montee|descendu|descendue|retourne|retournee|reste|restee|revenu|revenue)\\b",not:true,msg:'Les verbes de mouvement prennent « être » : il est allé, elle est partie, il est entré.'},

const MODEL_REPORT=`D'abord, la conservatrice a téléphoné au gardien vers 22 h 15. Ensuite, le gardien est monté au deuxième étage. Pendant la pause du groupe, Cédric Thériot est venu au musée avec la camionnette rouge. À 22 h 18, il a ouvert la porte de service avec le badge de Mme Gagnon. Puis, il a déplacé la planche de BD et il a pris la parure. Enfin, il est retourné sur scène à 22 h 50.

Je vous recommande de délivrer un mandat contre Mme Gagnon avant minuit.`;
